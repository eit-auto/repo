        // Zoom and Pan state (global within script scope)
        let zoomLevel = 1;
        let panX = 0;
        let panY = 0;
        const GRID_SIZE = 5000;

        // Transition type color theming
        function getTransitionColors(type) {
            const colors = {
                'Success': {
                    background: '#0d5a2d',
                    border: '#00ff00',
                    line: '#00ff00'
                },
                'Failure': {
                    background: '#4a1a1a',
                    border: '#ff4444',
                    line: '#ff4444'
                },
                'Always/Logic': {
                    background: '#3a3a3a',
                    border: '#d0d0d0',
                    line: '#d0d0d0'
                }
            };
            return colors[type] || colors['Success'];
        }
        
        function updateTransitionLineColors(transitionId, type) {
            const colors = getTransitionColors(type);
            const canvas = document.getElementById('workflowCanvas');
            // Update all lines FROM this transition (transition to step lines)
            const lines = canvas.querySelectorAll(`[data-from-transition="${transitionId}"]`);
            
            lines.forEach(line => {
                // Get current innerHTML and replace all color references
                let innerHTML = line.innerHTML;
                
                // Replace any hex color (#xxxxxx) with the new color
                // This handles green (#00aa00), red (#d9534f), grey (#b0b0b0), etc.
                innerHTML = innerHTML.replace(/#[0-9a-fA-F]{6}/g, colors.line);
                
                // Also replace greenArrowhead with a unique ID for this transition
                innerHTML = innerHTML.replace(/greenArrowhead/g, `arrowhead-${transitionId}`);
                
                // Update the innerHTML to apply the new colors
                line.innerHTML = innerHTML;
            });
        }
        
        function getTransitionDisplayText(type, conditions) {
            if (type === 'Conditional' && !conditions) {
                return 'Always';
            }
            return type;
        }

        // Canvas Drag-and-Drop
        function setupCanvasDragDrop() {
            const stepTypeItems = document.querySelectorAll('.step-type-item');
            const canvas = document.getElementById('workflowCanvas');
            let dragOffsetX = 0;
            let dragOffsetY = 0;

            // Setup draggable step types
            stepTypeItems.forEach(item => {
                item.addEventListener('dragstart', (e) => {
                    e.dataTransfer.effectAllowed = 'copy';
                    e.dataTransfer.setData('stepType', item.getAttribute('data-type'));
                    // Capture offset from item's top-left to mouse cursor
                    const rect = item.getBoundingClientRect();
                    dragOffsetX = e.clientX - rect.left;
                    dragOffsetY = e.clientY - rect.top;
                });
            });

            // Setup canvas to accept drops
            canvas.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'copy';
            });

            canvas.addEventListener('dragleave', (e) => {
                if (e.target === canvas) {
                    // Keep canvas transparent with grid
                }
            });

            canvas.addEventListener('drop', (e) => {
                e.preventDefault();
                
                const stepType = e.dataTransfer.getData('stepType');
                const rect = canvas.getBoundingClientRect();
                // Convert screen coordinates to grid coordinates accounting for zoom and pan
                // Subtract the drag offset so top-left of item aligns with drop point
                let x = (e.clientX - rect.left - dragOffsetX) / zoomLevel + panX;
                let y = (e.clientY - rect.top - dragOffsetY) / zoomLevel + panY;
                
                // Snap to 30px grid
                x = Math.round(x / 30) * 30;
                y = Math.round(y / 30) * 30;
                
                createStepOnCanvas(stepType, x, y);
            });
            
            // Zoom and Pan functionality
            let isPanning = false;
            let panStartX = 0;
            let panStartY = 0;
            
            function clampPan() {
                const containerRect = container.getBoundingClientRect();
                const containerWidth = containerRect.width;
                const containerHeight = containerRect.height;
                
                // Calculate visible grid area at current zoom
                const visibleWidth = containerWidth / zoomLevel;
                const visibleHeight = containerHeight / zoomLevel;
                
                // Clamp pan so viewport stays within 0,0 to GRID_SIZE,GRID_SIZE
                // panX/panY represent the top-left corner of the viewport in grid space
                panX = Math.max(0, Math.min(panX, GRID_SIZE - visibleWidth));
                panY = Math.max(0, Math.min(panY, GRID_SIZE - visibleHeight));
            }
            
            function updateTransform() {
                canvas.style.transform = `translate(${-panX}px, ${-panY}px) scale(${zoomLevel})`;
                canvas.style.transformOrigin = '0 0';
            }
            
            // Mouse wheel zoom
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                
                const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
                const newZoom = Math.max(0.55, Math.min(2, zoomLevel * zoomFactor));
                
                // Adjust pan to zoom toward mouse cursor
                const rect = container.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                panX = mouseX / newZoom + (panX * zoomLevel / newZoom) - mouseX / newZoom;
                panY = mouseY / newZoom + (panY * zoomLevel / newZoom) - mouseY / newZoom;
                
                zoomLevel = newZoom;
                clampPan();
                updateTransform();
            }, { passive: false });
            
            // Pan with left mouse button (on empty canvas only)
            const container = document.getElementById('canvasContainer');
            container.addEventListener('mousedown', (e) => {
                if (e.button === 0 && e.target === canvas) {
                    isPanning = true;
                    panStartX = e.clientX + panX;
                    panStartY = e.clientY + panY;
                    container.style.cursor = 'grabbing';
                    e.preventDefault();
                }
            });
            
            document.addEventListener('mousemove', (e) => {
                if (isPanning) {
                    panX = panStartX - e.clientX;
                    panY = panStartY - e.clientY;
                    clampPan();
                    updateTransform();
                }
            });
            
            document.addEventListener('mouseup', () => {
                if (isPanning) {
                    isPanning = false;
                    container.style.cursor = 'auto';
                }
            });
            
            // Click on empty canvas to deselect steps and transitions
            canvas.addEventListener('click', (e) => {
                if (e.target === canvas) {
                    document.querySelectorAll('[data-step-id]').forEach(el => {
                        el.style.borderColor = '#3a7a99';
                    });
                    document.querySelectorAll('[data-transition-uuid]').forEach(el => {
                        const transId = el.getAttribute('data-transition-uuid');
                        const transObj = currentTransitions.find(t => t.id === transId);
                        const transColors = getTransitionColors(transObj ? transObj.type : 'Success');
                        el.style.borderColor = transColors.border;
                    });
                    document.querySelectorAll('[data-transition-frame]').forEach(el => {
                        el.style.borderColor = '#d4af37';
                    });
                    document.getElementById('propertiesContent').innerHTML = '<div style="color: #b0b0b0; font-size: 0.85rem;">Select a step or transition to edit properties</div>';
                }
            });
        }

        function createStepOnCanvas(stepType, x, y) {
            // x and y are already snapped grid coordinates from the drop handler
            const snappedX = x;
            const snappedY = y;
            console.log(`Creating ${stepType} step at ${snappedX}, ${snappedY}`);
            
            const canvas = document.getElementById('workflowCanvas');
            const stepElement = document.createElement('div');
            const stepId = `step-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
            stepElement.setAttribute('data-step-id', stepId);
            
            // Initial size: 4x1 grid (120px x 30px)
            let width = 120;
            let height = 30;
            
            stepElement.style.cssText = `
                position: absolute;
                left: ${snappedX}px;
                top: ${snappedY}px;
                width: ${width}px;
                height: ${height}px;
                padding: 0;
                background: #0a3d55;
                border: 2px solid #3a7a99;
                border-radius: 4px;
                color: #ffffff;
                font-size: 0.9rem;
                cursor: move;
                box-sizing: border-box;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                z-index: 2;
            `;
            
            // Create a temporary text container to measure
            const textContainer = document.createElement('div');
            textContainer.style.cssText = `
                padding: 8px;
                white-space: nowrap;
                font-size: 0.9rem;
            `;
            textContainer.textContent = `${stepType} Step`;
            stepElement.appendChild(textContainer);
            
            // Add to canvas temporarily to measure
            canvas.appendChild(stepElement);
            
            // Measure the text
            const textWidth = textContainer.offsetWidth + 16; // Include padding
            const textHeight = textContainer.offsetHeight + 16; // Include padding
            
            // Expand width if needed (in 30px grid increments)
            if (textWidth > width) {
                const gridSpaces = Math.ceil((textWidth - width) / 30);
                width = 120 + (gridSpaces * 30);
                stepElement.style.width = width + 'px';
            }
            
            // Only expand width if needed (height stays at 30px / 1 grid box)
            // No height expansion
            
            // Generate UUID for step data (different from DOM step-id)
            const stepUUID = `${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
            
            // Create step data object
            const stepData = {
                id: stepUUID,
                name: `${stepType} Step`,
                type: stepType,
                action: '',
                variables: [],
                transitions: [],
                trans_vertical: false,
                trans_mode: 'First',
                position: {
                    x: snappedX,
                    y: snappedY
                }
            };
            
            // Store step data and associate with DOM element
            stepElement.setAttribute('data-step-uuid', stepUUID);
            currentSteps.push(stepData);
            
            // Add click handler to show properties
            stepElement.addEventListener('click', (e) => {
                e.stopPropagation();
                showStepProperties(stepUUID);
                
                // Deselect all other steps and transitions
                document.querySelectorAll('[data-step-id]').forEach(el => {
                    el.style.borderColor = '#3a7a99';
                });
                document.querySelectorAll('[data-transition-uuid]').forEach(el => {
                    el.style.borderColor = '#00aa00';
                });
                stepElement.style.borderColor = '#00ff00';
            });
            
            // Add connection points (circles) on edges
            const connectionPoints = [
                { name: 'top', top: '-6px', left: '50%', transform: 'translateX(-50%)' },
                { name: 'bottom', bottom: '-6px', left: '50%', transform: 'translateX(-50%)' },
                { name: 'left', top: '50%', left: '-6px', transform: 'translateY(-50%)' },
                { name: 'right', top: '50%', right: '-6px', transform: 'translateY(-50%)' }
            ];
            
            connectionPoints.forEach(point => {
                const circle = document.createElement('div');
                circle.setAttribute('data-connection-point', point.name);
                circle.style.cssText = `
                    position: absolute;
                    width: 12px;
                    height: 12px;
                    border-radius: 50%;
                    background: #0a0a0a;
                    border: 2px solid #3a7a99;
                    ${point.top ? `top: ${point.top};` : ''}
                    ${point.bottom ? `bottom: ${point.bottom};` : ''}
                    ${point.left ? `left: ${point.left};` : ''}
                    ${point.right ? `right: ${point.right};` : ''}
                    transform: ${point.transform};
                    pointer-events: auto;
                    cursor: crosshair;
                    z-index: 1;
                `;
                
                // Add drag-to-draw line functionality
                let isDrawing = false;
                let startX, startY;
                let fromStepId = null;
                let fromConnectionPoint = point.name;
                let frameUUID = ''; // Will be generated when drag completes
                const MIN_DRAG_DISTANCE = 10; // pixels required to create a transition
                
                circle.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    isDrawing = true;
                    fromStepId = stepElement.getAttribute('data-step-id');
                    const rect = stepElement.getBoundingClientRect();
                    const canvasRect = canvas.getBoundingClientRect();
                    const circleRect = circle.getBoundingClientRect();
                    const screenStartX = circleRect.left - canvasRect.left + 6; // Center of circle
                    const screenStartY = circleRect.top - canvasRect.top + 6;
                    // Convert to grid coordinates
                    startX = (screenStartX / zoomLevel) + panX;
                    startY = (screenStartY / zoomLevel) + panY;
                    
                    // Add listeners only when dragging starts
                    document.addEventListener('mousemove', handleMouseMove);
                    document.addEventListener('mouseup', handleMouseUp);
                });
                
                const handleMouseMove = (e) => {
                    if (isDrawing) {
                        const canvasRect = canvas.getBoundingClientRect();
                        const screenCurrentX = e.clientX - canvasRect.left;
                        const screenCurrentY = e.clientY - canvasRect.top;
                        // Convert to grid coordinates
                        const currentX = (screenCurrentX / zoomLevel) + panX;
                        const currentY = (screenCurrentY / zoomLevel) + panY;
                        
                        // Update or create line preview
                        let line = canvas.querySelector('[data-preview-line]');
                        if (!line) {
                            line = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                            line.setAttribute('data-preview-line', 'true');
                            line.style.cssText = `
                                position: absolute;
                                top: 0;
                                left: 0;
                                width: 100%;
                                height: 100%;
                                pointer-events: none;
                                z-index: 0;
                            `;
                            canvas.appendChild(line);
                        }
                        
                        line.innerHTML = `<line x1="${startX}" y1="${startY}" x2="${currentX}" y2="${currentY}" stroke="#3a7a99" stroke-width="2"/>`;
                    }
                };
                
                const handleMouseUp = (e) => {
                    if (isDrawing) {
                        isDrawing = false;
                        document.removeEventListener('mousemove', handleMouseMove);
                        document.removeEventListener('mouseup', handleMouseUp);
                        
                        const canvasRect = canvas.getBoundingClientRect();
                        const screenEndX = e.clientX - canvasRect.left;
                        const screenEndY = e.clientY - canvasRect.top;
                        
                        // Convert to grid coordinates
                        const gridEndX = (screenEndX / zoomLevel) + panX;
                        const gridEndY = (screenEndY / zoomLevel) + panY;
                        
                        // Check minimum drag distance
                        const dragDistance = Math.hypot(gridEndX - startX, gridEndY - startY);
                        if (dragDistance < MIN_DRAG_DISTANCE) {
                            // Drag too short, don't create transition
                            return;
                        }
                        
                        // Generate unique frame ID
                        frameUUID = String(Date.now()) + '-' + Math.random().toString(36).substr(2, 9);
                        
                        // Snap to 30px grid
                        const snappedX = Math.round(gridEndX / 30) * 30;
                        const snappedY = Math.round(gridEndY / 30) * 30;
                        
                        // Store frame data
                        const frameData = {
                            id: frameUUID,
                            execution: 'First',
                            conditions: []
                        };
                        currentTransitionFrames = currentTransitionFrames || [];
                        currentTransitionFrames.push(frameData);
                        
                        // Create default Success condition
                        transitionCounter++;
                        const defaultConditionId = String(transitionCounter);
                        const defaultConditionData = {
                            id: defaultConditionId,
                            name: '',
                            type: 'Success',
                            conditions: '',
                            targetSteps: [],
                            order: 1
                        };
                        
                        // Add condition to frame data
                        frameData.conditions.push(defaultConditionId);
                        currentTransitions.push(defaultConditionData);
                        
                        // Render the frame with the default condition
                        renderTransitionFrame(frameUUID, false);
                        
                        // Get the rendered frame element
                        const frameRect = canvas.querySelector(`[data-transition-frame="${frameUUID}"]`);
                        
                        // Position the frame at the snapped coordinates
                        if (frameRect) {
                            frameRect.style.left = (snappedX - 45) + 'px';
                            frameRect.style.top = (snappedY - 30) + 'px';
                        }
                        
                        // Update the preview line to be permanent, connecting to frame
                        let connectionLine = canvas.querySelector('[data-preview-line]');
                        if (connectionLine) {
                            connectionLine.removeAttribute('data-preview-line');
                            connectionLine.setAttribute('data-connection-line', 'true');
                            connectionLine.setAttribute('data-from-step', fromStepId);
                            connectionLine.setAttribute('data-from-point', fromConnectionPoint);
                            connectionLine.setAttribute('data-to-frame', frameUUID);
                            
                            // Update step's transitions array with the new frame
                            const sourceStepElement = canvas.querySelector(`[data-step-id="${fromStepId}"]`);
                            if (sourceStepElement) {
                                const sourceStepUUID = sourceStepElement.getAttribute('data-step-uuid');
                                const sourceStepData = currentSteps.find(s => s.id === sourceStepUUID);
                                if (sourceStepData) {
                                    // Add all conditions from the frame to the step's transitions
                                    const frame = currentTransitionFrames.find(f => f.id === frameUUID);
                                    if (frame) {
                                        frame.conditions.forEach(conditionId => {
                                            if (!sourceStepData.transitions.find(t => t.id === conditionId)) {
                                                // Find the full transition object and add it
                                                const transitionObj = currentTransitions.find(t => t.id === conditionId);
                                                if (transitionObj) {
                                                    sourceStepData.transitions.push(transitionObj);
                                                }
                                            }
                                        });
                                        updatePreview();
                                    }
                                }
                            }
                            
                            // Add defs with marker if not already present
                            if (!connectionLine.querySelector('defs')) {
                                const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                                const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
                                marker.setAttribute('id', 'blueArrowhead');
                                marker.setAttribute('markerWidth', '10');
                                marker.setAttribute('markerHeight', '10');
                                marker.setAttribute('refX', '9');
                                marker.setAttribute('refY', '3');
                                marker.setAttribute('orient', 'auto');
                                const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                                polygon.setAttribute('points', '0 0, 10 3, 0 6');
                                polygon.setAttribute('fill', '#3a7a99');
                                marker.appendChild(polygon);
                                defs.appendChild(marker);
                                connectionLine.appendChild(defs);
                            }
                            
                            // Update line to use curved path
                            // Frame is positioned at (snappedX - 45, snappedY - 30) and is 90px wide x 60px tall
                            const frameActualX = snappedX - 45;
                            const frameActualY = snappedY - 30;
                            const frameWidth = frameRect ? frameRect.offsetWidth : 90;
                            const frameHeight = frameRect ? frameRect.offsetHeight : 60;
                            const frameSideCenters = [
                                { x: frameActualX + frameWidth / 2, y: frameActualY, name: 'top' },
                                { x: frameActualX + frameWidth / 2, y: frameActualY + frameHeight, name: 'bottom' },
                                { x: frameActualX, y: frameActualY + frameHeight / 2, name: 'left' },
                                { x: frameActualX + frameWidth, y: frameActualY + frameHeight / 2, name: 'right' }
                            ];
                            
                            let nearestSide = frameSideCenters[0];
                            let minDistance = Infinity;
                            frameSideCenters.forEach(side => {
                                const distance = Math.hypot(startX - side.x, startY - side.y);
                                if (distance < minDistance) {
                                    minDistance = distance;
                                    nearestSide = side;
                                }
                            });
                            
                            const blueCurvePath = createCurvedPath(startX, startY, fromConnectionPoint, nearestSide.x, nearestSide.y, nearestSide.name);
                            connectionLine.innerHTML = `<defs><marker id="blueArrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#3a7a99"/></marker></defs><path d="${blueCurvePath}" stroke="#3a7a99" stroke-width="2" fill="none" marker-end="url(#blueArrowhead)"/>`;
                            
                            // Mark the connection circle as connected and change its background
                            const fromStep = canvas.querySelector(`[data-step-id="${fromStepId}"]`);
                            if (fromStep) {
                                const connectedCircle = fromStep.querySelector(`[data-connection-point="${fromConnectionPoint}"]`);
                                if (connectedCircle) {
                                    connectedCircle.style.background = '#3a7a99';
                                    connectedCircle.setAttribute('data-connected', 'true');
                                }
                            }
                        }
                    }
                };
                
                document.addEventListener('mouseup', handleMouseUp);
                
                stepElement.appendChild(circle);
            });
            
            // Make step draggable to reposition
            let isDragging = false;
            let dragOffsetX = 0;
            let dragOffsetY = 0;
            
            stepElement.addEventListener('mousedown', (e) => {
                isDragging = true;
                const rect = stepElement.getBoundingClientRect();
                // Convert screen offset to grid offset, accounting for zoom
                dragOffsetX = (e.clientX - rect.left) / zoomLevel;
                dragOffsetY = (e.clientY - rect.top) / zoomLevel;
                stepElement.style.opacity = '0.8';
            });
            
            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const canvasRect = canvas.getBoundingClientRect();
                    // Convert screen coordinates to grid coordinates
                    let newX = (e.clientX - canvasRect.left) / zoomLevel + panX - dragOffsetX;
                    let newY = (e.clientY - canvasRect.top) / zoomLevel + panY - dragOffsetY;
                    
                    // Snap to 30px grid
                    newX = Math.round(newX / 30) * 30;
                    newY = Math.round(newY / 30) * 30;
                    
                    // Keep within canvas bounds
                    newX = Math.max(0, newX);
                    newY = Math.max(0, newY);
                    
                    stepElement.style.left = newX + 'px';
                    stepElement.style.top = newY + 'px';
                    
                    // Update any blue connection lines from this step
                    const blueLines = canvas.querySelectorAll(`[data-connection-line][data-from-step="${stepId}"]`);
                    blueLines.forEach(line => {
                        const fromPoint = line.getAttribute('data-from-point');
                        const toFrameId = line.getAttribute('data-to-frame');
                        const toFrame = canvas.querySelector(`[data-transition-frame="${toFrameId}"]`);
                        console.log('Blue line update - toFrameId:', toFrameId, 'toFrame found:', !!toFrame);
                        
                        if (toFrame) {
                            // Get current step width for dynamic centering (from style, not affected by zoom transform)
                            const stepWidth = parseFloat(stepElement.style.width);
                            const stepCenterX = newX + (stepWidth / 2);
                            
                            let lineStartX = stepCenterX; // Center horizontally
                            let lineStartY = newY + 15; // Middle vertically
                            
                            if (fromPoint === 'top') {
                                lineStartX = stepCenterX;
                                lineStartY = newY;
                            } else if (fromPoint === 'bottom') {
                                lineStartX = stepCenterX;
                                lineStartY = newY + 30;
                            } else if (fromPoint === 'left') {
                                lineStartX = newX;
                                lineStartY = newY + 15;
                            } else if (fromPoint === 'right') {
                                lineStartX = newX + stepWidth;
                                lineStartY = newY + 15;
                            }
                            
                            // Get frame position in grid space
                            const frameRect = toFrame.getBoundingClientRect();
                            const canvasRect = canvas.getBoundingClientRect();
                            const frameScreenX = frameRect.left - canvasRect.left;
                            const frameScreenY = frameRect.top - canvasRect.top;
                            // Convert screen coords back to grid coords
                            const frameActualX = (frameScreenX / zoomLevel) + panX;
                            const frameActualY = (frameScreenY / zoomLevel) + panY;
                            console.log('Frame calc:', { frameScreenX, frameScreenY, zoomLevel, panX, panY, frameActualX, frameActualY });
                            
                            // Find nearest side of frame (use actual frame dimensions in grid space)
                            const frameWidth = frameRect.width / zoomLevel;
                            console.log('Frame dims:', { frameWidth, frameHeight, width: frameRect.width, height: frameRect.height });
                            const frameSideCenters = [
                                { x: frameActualX + frameWidth / 2, y: frameActualY, name: 'top' },
                                { x: frameActualX + frameWidth / 2, y: frameActualY + frameHeight, name: 'bottom' },
                                { x: frameActualX, y: frameActualY + frameHeight / 2, name: 'left' },
                                { x: frameActualX + frameWidth, y: frameActualY + frameHeight / 2, name: 'right' }
                            ];
                            
                            let nearestSide = frameSideCenters[0];
                            let minDistance = Infinity;
                            frameSideCenters.forEach(side => {
                                const distance = Math.hypot(lineStartX - side.x, lineStartY - side.y);
                                if (distance < minDistance) {
                                    minDistance = distance;
                                    nearestSide = side;
                                }
                            });
                            
                            // Update with curved path
                            const blueCurvePath = createCurvedPath(lineStartX, lineStartY, fromPoint, nearestSide.x, nearestSide.y, nearestSide.name);
                            line.innerHTML = `<defs><marker id="blueArrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#3a7a99"/></marker></defs><path d="${blueCurvePath}" stroke="#3a7a99" stroke-width="2" fill="none" marker-end="url(#blueArrowhead)"/>`;
                        }
                    });
                    
                    // Update any green lines pointing TO this step
                    const greenLines = canvas.querySelectorAll(`[data-to-step="${stepUUID}"]`);
                    greenLines.forEach(line => {
                        const fromTransitionId = line.getAttribute('data-from-transition');
                        const fromTransition = canvas.querySelector(`[data-transition-uuid="${fromTransitionId}"]`);
                        
                        if (fromTransition) {
                            const transitionRect = fromTransition.getBoundingClientRect();
                            const transitionCanvasX = transitionRect.left - canvas.getBoundingClientRect().left;
                            const transitionCanvasY = transitionRect.top - canvas.getBoundingClientRect().top;
                            // Convert transition position to grid coordinates
                            const transitionGridX = (transitionCanvasX / zoomLevel) + panX;
                            const transitionGridY = (transitionCanvasY / zoomLevel) + panY;
                            const x1 = transitionGridX + 30;
                            const y1 = transitionGridY + 30;
                            
                            // Find nearest side center of the new position (all in grid space)
                            const stepWidth = parseFloat(stepElement.style.width);
                            const stepCenterX = newX + (stepWidth / 2);
                            const sideCenters = [
                                { x: stepCenterX, y: newY, name: 'top' },
                                { x: stepCenterX, y: newY + 30, name: 'bottom' },
                                { x: newX, y: newY + 15, name: 'left' },
                                { x: newX + stepWidth, y: newY + 15, name: 'right' }
                            ];
                            
                            let nearestSide = sideCenters[0];
                            let minDistance = Infinity;
                            sideCenters.forEach(side => {
                                const distance = Math.hypot(x1 - side.x, y1 - side.y);
                                if (distance < minDistance) {
                                    minDistance = distance;
                                    nearestSide = side;
                                }
                            });
                            
                            // Update with curved path
                            const greenCurvePath = createCurvedPath(x1, y1, 'bottom', nearestSide.x, nearestSide.y, nearestSide.name);
                            const transitionData = currentTransitions.find(t => t.id === fromTransitionId);
                            const transitionColors = getTransitionColors(transitionData ? transitionData.type : 'Success');
                            line.innerHTML = `<defs><marker id="greenArrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="${transitionColors.line}"/></marker></defs><path d="${greenCurvePath}" stroke="${transitionColors.line}" stroke-width="2" fill="none" marker-end="url(#greenArrowhead)"/>`;
                        }
                    });
                }
            });
            
            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    stepElement.style.opacity = '1';
                }
            });
            
            canvas.appendChild(stepElement);
        }

        function setupEventListeners() {
            const previewToggle = document.getElementById('previewToggle');
            const previewBox = document.getElementById('preview');
            if (previewToggle && previewBox) {
                previewToggle.addEventListener('change', function() {
                    previewBox.style.display = this.checked ? 'block' : 'none';
                });
            }
            
            setupCanvasDragDrop();
        }

        document.addEventListener('DOMContentLoaded', setupEventListeners);
        window.addEventListener('load', authenticate);
    </script>
</body>
</html>
