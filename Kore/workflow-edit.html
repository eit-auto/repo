<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Workflow</title>
    <link rel="stylesheet" href="/base.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #191A24;
            padding: 0;
            margin: 0;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        h1 {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 20px;
            color: #e0e0e0;
        }

        .header-info {
            flex: 1;
        }

        .workflow-title {
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #b0b0b0;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .version-display {
            color: #999;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .panel {
            background: #234656;
            border: 1px solid #404040;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .panel-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #5a9fb8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .editor-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .editor-section {
            flex: 1;
            min-width: 0;
        }

        #preview {
            background: #1a1a1a;
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 15px;
            color: #e0e0e0;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.85rem;
            min-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
            margin-top: 0;
            color: #e0e0e0;
            line-height: 1.2;
            display: block;
        }

        .modal-text {
            color: #b0b0b0;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        #status {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }

        #status.show {
            display: block;
        }

        #status.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
        }

        #status.error {
            background: rgba(184, 36, 47, 0.2);
            border: 1px solid #b8242f;
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div style="width: 100dvw; height: 100dvh; max-width: 100dvw; max-height: 100dvh; display: flex; flex-direction: column; overflow: auto;">
    <!-- Header Panel -->
    <div style="padding: 10px; background: #234656; margin: 6px 6px 0 6px; border-radius: 6px;">
        <div style="display: flex; align-items: flex-start; gap: 20px; margin-bottom: 10px;">
            <div style="flex: 1; display: flex; flex-direction: column;">
                <label for="workflowName" style="margin-bottom: 4px; font-size: 0.85rem; color: #b0b0b0;">Workflow Name</label>
                <input type="text" id="workflowName" placeholder="Workflow name" style="padding: 8px 10px; background: #1a3540; border: 1px solid #3a7a99; border-radius: 4px; color: #e0e0e0; font-size: 0.9rem; font-family: inherit; min-width: 0;">
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; justify-content: flex-start; gap: 8px;">
                <div style="font-size: 0.85rem; color: #b0b0b0; white-space: nowrap; text-align: right;">
                    <span id="versionDisplay">-</span> - <span id="uuidDisplay" style="font-family: monospace; font-size: 0.8rem; color: #909090;">-</span>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-blue" onclick="showJSONModal()" style="padding: 8px 16px;">View JSON</button>
                    <button class="btn btn-green" onclick="saveWorkflow()" style="padding: 8px 16px;">Save Workflow</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Full-Height Canvas Layout -->
    <div style="display: flex; flex: 1; width: 100%; max-width: 100%; height: 100%; max-height: 100%; margin: 0; padding: 0; box-sizing: border-box; overflow: auto;">
        <!-- Left Sidebar - Step Types -->
        <div style="width: 150px; background: #234656; padding: 15px; overflow-y: auto; border-radius: 6px; box-sizing: border-box; margin-left: 6px; margin-top: 6px; margin-bottom: 6px;">
            <div style="font-size: 0.85rem; font-weight: 600; margin-bottom: 15px; color: #e0e0e0;">Step Types</div>
            <div id="stepTypesList" style="display: flex; flex-direction: column; gap: 8px;">
                <div draggable="true" class="step-type-item" data-type="Generic" style="padding: 0; background: #234656; border: 2px solid #3a7a99; border-radius: 4px; cursor: move; text-align: center; font-size: 0.9rem; color: #e0e0e0; user-select: none; display: flex; align-items: center; justify-content: center; height: 30px; box-sizing: border-box;">
                    Generic
                </div>
            </div>
        </div>

        <!-- Canvas Area -->
        <div id="canvasContainer" style="flex: 1; position: relative; overflow: hidden; box-sizing: border-box; user-select: none;">
            <div id="workflowCanvas" style="position: absolute; top: 0; left: 0; width: 5000px; height: 5000px; transform-origin: 0 0; background: transparent; background-image: linear-gradient(rgba(128, 128, 128, 0.3) 1px, transparent 1px), linear-gradient(90deg, rgba(128, 128, 128, 0.3) 1px, transparent 1px); background-size: 30px 30px;">
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #606060; text-align: center; font-size: 0.9rem; white-space: nowrap; user-select: none; pointer-events: none;">
                Drag step types here to create steps
            </div>
            </div>
        </div>

        <!-- Right Panel - Properties/Settings -->
        <div id="propertiesPanel" style="width: 350px; background: #234656; padding: 15px; overflow-y: auto; border-radius: 6px; box-sizing: border-box; margin-right: 6px; margin-top: 6px; margin-bottom: 6px;">
            <div id="propertiesContent" style="color: #b0b0b0; font-size: 0.85rem;">Select a step or transition to edit properties</div>
        </div>
    </div>

    <!-- Save Confirmation Modal -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <h2 class="modal-title">Save Workflow Changes</h2>
            <p style="margin-bottom: 20px; color: var(--text-secondary);">Changes detected. Version will be incremented.</p>
            
            <div class="form-group">
                <label for="newVersion">New Version</label>
                <input type="text" id="newVersion" class="form-field-input" readonly style="background: var(--bg-tertiary); cursor: default;">
            </div>

            <div class="modal-buttons">
                <button class="btn btn-grey" onclick="closeConfirmModal()">Cancel</button>
                <button class="btn btn-blue" onclick="confirmSave()">Save with New Version</button>
            </div>
        </div>
    </div>

    <!-- Text Editor Modal -->
    <div class="modal" id="textEditorModal">
        <div class="modal-content" style="max-width: 600px;">
            <h2 class="modal-title" id="textEditorTitle">Edit Text</h2>
            
            <div class="form-group">
                <textarea id="textEditorTextarea" class="form-field-input" placeholder="Enter text here..." style="min-height: 200px; padding: 10px; font-family: monospace; font-size: 0.9rem; resize: vertical;"></textarea>
            </div>

            <div class="modal-buttons">
                <button class="btn btn-grey" onclick="closeTextEditor()">Cancel</button>
                <button class="btn btn-blue" onclick="saveTextEditor()">Save</button>
            </div>
        </div>
    </div>

    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            max-width: unset;
            max-height: unset;
            padding: 0;
            border: none;
            box-shadow: none;
        }

        .modal.show {
            display: flex;
        }

        .modal .modal-content {
            background: #234656 !important;
            border: 1px solid #404040 !important;
            border-radius: 8px;
            padding: 12px;
            max-height: 90dvh;
            max-width: 90dvw;
            min-width: 400px;
            min-height: 250px;
            width: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .modal textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #3a7a99;
            border-radius: 4px;
            background: #1a3540;
            color: #e0e0e0;
            font-size: 0.95rem;
            font-family: monospace;
            resize: vertical;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        input[readonly] {
            opacity: 0.7;
        }
    </style>

    </div>
    </div><!-- close 100dvh x 100dvw wrapper -->

    <script>
        const API_KEY = '393d5ca334f5b1b9e7127544460def61ca6be55eab20da08f1746f11f5d0b4e9';
        let currentWorkflowId = null;
        let currentVersion = null;
        let allVersions = [];
        let currentSteps = [];
        let currentTransitions = [];
        let currentTransitionFrames = [];
        let transitionFrameCounter = 0;
        let transitionCounter = 0;
        let originalJson = null;

        async function authenticate() {
            console.log('authenticate() called');
            try {
                const response = await fetch('/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Kore-Token': API_KEY
                    },
                    body: JSON.stringify({
                        user: 'test@localhost',
                        origin: 'https://localhost'
                    })
                });

                console.log('Auth response status:', response.status);
                const data = await response.json();
                console.log('Auth data:', data);
                if (data.sessionToken) {
                    sessionToken = data.sessionToken;
                    console.log('Session token set, calling loadWorkflow');
                    loadWorkflow();
                } else {
                    console.log('No sessionToken in response');
                }
            } catch (err) {
                console.error('Auth error:', err.message);
            }
        }

        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                id: params.get('id')
            };
        }

        async function loadWorkflow() {
            const { id } = getUrlParams();

            if (!id) {
                const nameField = document.getElementById('workflowName');
                if (nameField) nameField.value = 'Invalid workflow ID';
                return;
            }

            currentWorkflowId = id;

            if (!sessionToken) return;

            try {
                // Fetch the workflow by UUID (current version only)
                const response = await fetch(`/kore/workflows/${id}`, {
                    headers: { 'X-Session-Token': sessionToken }
                });

                if (!response.ok) {
                    const error = await response.json();
                    const nameField = document.getElementById('workflowName');
                    const preview = document.getElementById('preview');
                    if (nameField) nameField.value = 'Error loading workflow';
                    if (preview) preview.textContent = `Error: ${error.error || 'Failed to load workflow'}`;
                    return;
                }

                const workflow = await response.json();
                console.log('Workflow loaded:', workflow);
                
                // Set the workflow name and version
                const nameField = document.getElementById('workflowName');
                const versionField = document.getElementById('versionDisplay');
                const preview = document.getElementById('preview');
                
                console.log('Version field element:', versionField);
                console.log('Workflow version:', workflow.version);
                
                if (nameField) nameField.value = workflow.name;
                if (versionField) {
                    versionField.textContent = `v${workflow.version}`;
                    console.log('Version set to:', versionField.textContent);
                }
                
                const uuidField = document.getElementById('uuidDisplay');
                if (uuidField) {
                    uuidField.textContent = currentWorkflowId;
                }
                
                currentVersion = workflow.version;
                allVersions = [workflow.version];

                // Load the workflow definition
                currentSteps = workflow.definition.steps || [];
                // Ensure all steps have transitions and variables arrays
                currentSteps.forEach(step => {
                    if (!Array.isArray(step.transitions)) {
                        step.transitions = [];
                    }
                    if (!Array.isArray(step.variables)) {
                        step.variables = [];
                    }
                });
                
                // Recalculate transition counter from loaded steps
                transitionCounter = 0;
                currentTransitions = [];
                currentSteps.forEach(step => {
                    step.transitions.forEach((transition, index) => {
                        const id = parseInt(transition.id, 10);
                        if (!isNaN(id) && id > transitionCounter) {
                            transitionCounter = id;
                        }
                        // Add to currentTransitions if not already there
                        if (!currentTransitions.find(t => t.id === transition.id)) {
                            // Ensure order exists (for backwards compatibility)
                            if (!transition.order) {
                                transition.order = index + 1;
                            }
                            currentTransitions.push(transition);
                        }
                    });
                });
                
                originalJson = JSON.stringify({ steps: currentSteps }, null, 2);
                renderStepsEditor();
                renderLoadedStepsOnCanvas();
                updatePreview();
            } catch (err) {
                console.error('Error loading workflow:', err);
                const preview = document.getElementById('preview');
                if (preview) preview.textContent = 'Error loading workflow: ' + err.message;
            }
        }

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function renderLoadedStepsOnCanvas() {
            const canvas = document.getElementById('workflowCanvas');
            if (!canvas) return;
            
            // Clear any existing steps from canvas
            document.querySelectorAll('[data-step-id]').forEach(el => el.remove());
            
            currentSteps.forEach(step => {
                // Get position from step data, or use default
                const x = step.position?.x || 100;
                const y = step.position?.y || 100;
                
                const stepElement = document.createElement('div');
                const stepId = `step-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
                stepElement.setAttribute('data-step-id', stepId);
                stepElement.setAttribute('data-step-uuid', step.id);
                
                // Initial size: 4x1 grid (120px x 30px)
                let width = 120;
                let height = 30;
                
                stepElement.style.cssText = `
                    position: absolute;
                    left: ${x}px;
                    top: ${y}px;
                    width: ${width}px;
                    height: ${height}px;
                    padding: 0;
                    background: #0a3d55;
                    border: 2px solid #3a7a99;
                    border-radius: 4px;
                    color: #ffffff;
                    font-size: 0.9rem;
                    cursor: move;
                    box-sizing: border-box;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    text-align: center;
                    z-index: 2;
                `;
                
                // Create a temporary text container to measure
                const textContainer = document.createElement('div');
                textContainer.style.cssText = `
                    padding: 8px;
                    white-space: nowrap;
                    font-size: 0.9rem;
                `;
                textContainer.textContent = step.name || `${step.type} Step`;
                stepElement.appendChild(textContainer);
                
                // Add to canvas temporarily to measure
                canvas.appendChild(stepElement);
                
                // Measure the text
                const textWidth = textContainer.offsetWidth + 16; // Include padding
                const textHeight = textContainer.offsetHeight + 16; // Include padding
                
                // Expand width if needed (in 30px grid increments)
                if (textWidth > width) {
                    const gridSpaces = Math.ceil((textWidth - width) / 30);
                    width = 120 + (gridSpaces * 30);
                    stepElement.style.width = width + 'px';
                }
                
                // Add connection point circles
                const points = [
                    { x: width / 2, y: 0, name: 'top' },
                    { x: width / 2, y: height, name: 'bottom' },
                    { x: 0, y: height / 2, name: 'left' },
                    { x: width, y: height / 2, name: 'right' }
                ];
                
                points.forEach(point => {
                    const circle = document.createElement('div');
                    circle.style.cssText = `
                        position: absolute;
                        left: ${point.x - 4}px;
                        top: ${point.y - 4}px;
                        width: 8px;
                        height: 8px;
                        border-radius: 50%;
                        background: #3a7a99;
                        border: 1px solid #5a9ab9;
                        cursor: crosshair;
                        z-index: 1;
                    `;
                    circle.setAttribute('data-connection-point', point.name);
                    
                    // Add transition drag handler
                    circle.addEventListener('mousedown', (e) => {
                        e.stopPropagation();
                        const canvas = document.getElementById('workflowCanvas');
                        const canvasRect = canvas.getBoundingClientRect();
                        
                        const fromX = (canvasRect.left - canvasRect.left) / zoomLevel + panX + (x + point.x);
                        const fromY = (canvasRect.top - canvasRect.top) / zoomLevel + panY + (y + point.y);
                        
                        // Create preview line
                        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                        svg.setAttribute('data-preview-line', 'true');
                        svg.style.cssText = 'position: absolute; top: 0; left: 0; width: 5000px; height: 5000px; pointer-events: none; z-index: 1;';
                        canvas.appendChild(svg);
                        
                        const handleMouseMove = (e) => {
                            const toX = (e.clientX - canvasRect.left) / zoomLevel + panX;
                            const toY = (e.clientY - canvasRect.top) / zoomLevel + panY;
                            
                            const path = createCurvedPath(fromX, fromY, point.name, toX, toY, 'auto');
                            svg.innerHTML = `<defs><marker id="previewArrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#3a7a99"/></marker></defs><path d="${path}" stroke="#3a7a99" stroke-width="2" fill="none" marker-end="url(#previewArrowhead)"/>`;
                        };
                        
                        const handleMouseUp = (e) => {
                            document.removeEventListener('mousemove', handleMouseMove);
                            document.removeEventListener('mouseup', handleMouseUp);
                            svg.remove();
                            
                            // Check if dropped on a transition frame
                            const dropTarget = document.elementFromPoint(e.clientX, e.clientY);
                            const frameElement = dropTarget?.closest('[data-transition-frame]');
                            
                            if (frameElement) {
                                const frameUUID = frameElement.getAttribute('data-transition-frame');
                                const frame = currentTransitionFrames.find(f => f.id === frameUUID);
                                if (frame) {
                                    frame.sourceStepUUID = step.id;
                                    
                                    // Create permanent connection line
                                    const lineId = `conn-${Date.now()}`;
                                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                                    line.setAttribute('data-connection-line', 'true');
                                    line.setAttribute('data-from-step', step.id);
                                    line.setAttribute('data-from-point', point.name);
                                    line.setAttribute('data-to-frame', frameUUID);
                                    line.style.cssText = 'position: absolute; top: 0; left: 0; width: 5000px; height: 5000px; pointer-events: none; z-index: 0;';
                                    canvas.appendChild(line);
                                    
                                    const frameRect = frameElement.getBoundingClientRect();
                                    const framePath = createCurvedPath(fromX, fromY, point.name, frameRect.left - canvasRect.left + frameRect.width / 2, frameRect.top - canvasRect.top + frameRect.height / 2, 'center');
                                    line.innerHTML = `<defs><marker id="blueArrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#3a7a99"/></marker></defs><path d="${framePath}" stroke="#3a7a99" stroke-width="2" fill="none" marker-end="url(#blueArrowhead)"/>`;
                                }
                            }
                        };
                        
                        document.addEventListener('mousemove', handleMouseMove);
                        document.addEventListener('mouseup', handleMouseUp);
                    });
                    
                    stepElement.appendChild(circle);
                });
                
                // Add click handler to show properties
                stepElement.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showStepProperties(step.id);
                    
                    // Select this step
                    document.querySelectorAll('[data-step-id]').forEach(el => {
                        el.style.borderColor = '#3a7a99';
                    });
                    stepElement.style.borderColor = '#00ff00';
                });
                
                // Add drag handlers for step movement
                let isDragging = false;
                let dragStartX = 0;
                let dragStartY = 0;
                let startLeft = 0;
                let startTop = 0;
                
                stepElement.addEventListener('mousedown', (e) => {
                    if (e.target.hasAttribute('data-connection-point')) return;
                    
                    isDragging = true;
                    dragStartX = e.clientX;
                    dragStartY = e.clientY;
                    startLeft = parseFloat(stepElement.style.left);
                    startTop = parseFloat(stepElement.style.top);
                });
                
                const handleDrag = (e) => {
                    if (!isDragging) return;
                    
                    const deltaX = e.clientX - dragStartX;
                    const deltaY = e.clientY - dragStartY;
                    
                    let newX = startLeft + deltaX / zoomLevel;
                    let newY = startTop + deltaY / zoomLevel;
                    
                    // Snap to 30px grid
                    newX = Math.round(newX / 30) * 30;
                    newY = Math.round(newY / 30) * 30;
                    
                    stepElement.style.left = newX + 'px';
                    stepElement.style.top = newY + 'px';
                    
                    // Update step position in data
                    step.position = { x: newX, y: newY };
                };
                
                const stopDrag = () => {
                    isDragging = false;
                };
                
                document.addEventListener('mousemove', handleDrag);
                document.addEventListener('mouseup', stopDrag);
            });
        }

        function renderStepsEditor() {
            const stepsList = document.getElementById('stepsList');
            if (!stepsList) return;

            stepsList.innerHTML = '';
            currentSteps.forEach((step, index) => {
                const stepDiv = document.createElement('div');
                stepDiv.className = 'step-item';
                stepDiv.style.cssText = 'border: 1px solid #404040; border-radius: 4px; padding: 12px; margin-bottom: 12px; background: rgba(26, 53, 64, 0.5);';
                
                stepDiv.innerHTML = `
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px;">
                        <div class="form-group" style="margin-bottom: 0;">
                            <label style="display: block; margin-bottom: 4px; font-size: 0.8rem;">Name</label>
                            <input type="text" class="form-field-input step-name-${index}" value="${step.name || ''}" placeholder="Step name" onchange="regenerateTransitionSelectors()">
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label style="display: block; margin-bottom: 4px; font-size: 0.8rem;">Type</label>
                            <input type="text" class="form-field-input step-type-${index}" value="${step.type || ''}" placeholder="e.g., command, action">
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label style="display: block; margin-bottom: 4px; font-size: 0.8rem;">Action</label>

        function addStep() {
            const newStep = {
                id: generateUUID(),
                name: '',
                type: '',
                action: '',
                transitions: [],
                variables: []
            };
            currentSteps.push(newStep);
            renderStepsEditor();
        }

        function deleteStep(index) {
            if (confirm('Delete this step?')) {
                currentSteps.splice(index, 1);
                renderStepsEditor();
            }
        }

        function rebuildStepsFromForm() {
            currentSteps.forEach((step, index) => {
                step.name = document.querySelector(`.step-name-${index}`)?.value || '';
                step.type = document.querySelector(`.step-type-${index}`)?.value || '';
                step.action = document.querySelector(`.step-action-${index}`)?.value || '';
                
                // Rebuild transitions from form
                step.transitions = [];
                const transitionItems = document.querySelectorAll(`.transition-item-${index}`);
                transitionItems.forEach((item) => {
                    const targetStep = item.querySelector(`.transition-target-${index}`)?.value || '';
                    const conditions = item.querySelector(`.transition-conditions-${index}`)?.value || '';
                    if (targetStep) {
                        step.transitions.push({
                            targetStep: targetStep,
                            conditions: conditions
                        });
                    }
                });
                
                // Rebuild variables from form
                step.variables = [];
                const variableItems = document.querySelectorAll(`.variable-item-${index}`);
                variableItems.forEach((item) => {
                    const name = item.querySelector(`.variable-name-${index}`)?.value || '';
                    const value = item.querySelector(`.variable-value-${index}`)?.value || '';
                    if (name) {
                        step.variables.push({
                            name: name,
                            value: value
                        });
                    }
                });
            });
        }

        function renderTransitions(stepIndex) {
            const transitionsContainer = document.getElementById(`transitions-list-${stepIndex}`);
            if (!transitionsContainer) return;
            
            const step = currentSteps[stepIndex];
            transitionsContainer.innerHTML = '';
            
            if (!step.transitions) step.transitions = [];
            
            step.transitions.forEach((transition, transitionIndex) => {
                const transitionDiv = document.createElement('div');
                transitionDiv.className = `transition-item-${stepIndex}`;
                transitionDiv.style.cssText = 'display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-bottom: 8px; align-items: flex-end; padding: 8px; background: rgba(0, 0, 0, 0.3); border-radius: 3px;';
                
                // Build options for Target Step selector (exclude current step)
                let optionsHtml = '<option value="">-- Select Target Step --</option>';
                currentSteps.forEach((s, idx) => {
                    if (idx !== stepIndex) {
                        const selected = transition.targetStep === s.id ? 'selected' : '';
                        optionsHtml += `<option value="${s.id}" ${selected}>${s.name || '(Unnamed)'} [${s.id.substring(0, 8)}...]</option>`;
                    }
                });
                
                transitionDiv.innerHTML = `
                    <div class="form-group" style="margin-bottom: 0;">
                        <label style="display: block; margin-bottom: 4px; font-size: 0.75rem;">Target Step</label>
                        <select class="form-field-input transition-target-${stepIndex}" style="padding: 6px 8px; font-size: 0.85rem;">
                            ${optionsHtml}
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label style="display: block; margin-bottom: 4px; font-size: 0.75rem;">Conditions</label>

                            <input type="text" class="form-field-input transition-conditions-${stepIndex}" value="${transition.conditions || ''}" placeholder="Conditions" style="padding: 6px 8px; font-size: 0.85rem; flex: 1;">
                            <button class="btn btn-grey btn-small" onclick="openTextEditor('Edit Conditions', document.querySelector('.transition-conditions-${stepIndex}').value, (value) => { document.querySelector('.transition-conditions-${stepIndex}').value = value; })" title="Edit in modal" style="padding: 6px 8px; height: 36px; min-width: 32px; display: flex; align-items: center; justify-content: center;">&#9998;</button>
                        </div>
                    </div>
                    <div style="display: flex; align-items: flex-end;">
                        <button class="btn btn-red btn-small" onclick="deleteTransition(${stepIndex}, ${transitionIndex})" title="Delete transition" style="padding: 6px 8px; height: 36px; min-width: auto;">&#8856;</button>
                    </div>
                `;
                transitionsContainer.appendChild(transitionDiv);
            });
        }

        function addTransition(stepIndex) {
            const step = currentSteps[stepIndex];
            if (!step.transitions) step.transitions = [];
            
            step.transitions.push({
                targetStep: '',
                conditions: ''
            });
            renderTransitions(stepIndex);
        }

        function deleteTransition(stepIndex, transitionIndex) {
            if (confirm('Delete this transition?')) {
                currentSteps[stepIndex].transitions.splice(transitionIndex, 1);
                renderTransitions(stepIndex);
            }
        }

        function regenerateTransitionSelectors() {
            // First rebuild steps from form to get updated names
            rebuildStepsFromForm();
            // Then re-render transitions for all steps to update Target Step selectors
            currentSteps.forEach((step, stepIndex) => {
                if (step.transitions) {
                    renderTransitions(stepIndex);
                }
            });
        }

        function renderVariables(stepIndex) {
            const variablesContainer = document.getElementById(`variables-list-${stepIndex}`);
            if (!variablesContainer) return;
            
            const step = currentSteps[stepIndex];
            variablesContainer.innerHTML = '';
            
            if (!step.variables) step.variables = [];
            
            step.variables.forEach((variable, variableIndex) => {
                const variableDiv = document.createElement('div');
                variableDiv.className = `variable-item-${stepIndex}`;
                variableDiv.style.cssText = 'display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-bottom: 8px; align-items: flex-end; padding: 8px; background: rgba(0, 0, 0, 0.3); border-radius: 3px;';
                
                variableDiv.innerHTML = `

                    <div class="form-group" style="margin-bottom: 0;">

                        <div style="display: flex; gap: 4px; align-items: flex-end;">
                            <input type="text" class="form-field-input variable-value-${stepIndex}" value="${variable.value || ''}" placeholder="Value" style="padding: 6px 8px; font-size: 0.85rem; flex: 1;">
                            <button class="btn btn-grey btn-small" onclick="openTextEditor('Edit Value', document.querySelector('.variable-value-${stepIndex}').value, (value) => { document.querySelector('.variable-value-${stepIndex}').value = value; })" title="Edit in modal" style="padding: 6px 8px; height: 36px; min-width: 32px; display: flex; align-items: center; justify-content: center;">&#9998;</button>
                        </div>
                    </div>
                    <div style="display: flex; align-items: flex-end;">

                    </div>

                variablesContainer.appendChild(variableDiv);

        function addVariable(stepIndex) {
            const step = currentSteps[stepIndex];
            if (!step.variables) step.variables = [];
            
            step.variables.push({
                name: '',
                value: ''
            });
            renderVariables(stepIndex);
        }

        function deleteVariable(stepIndex, variableIndex) {
            if (confirm('Delete this variable?')) {
                currentSteps[stepIndex].variables.splice(variableIndex, 1);
                renderVariables(stepIndex);
            }
        }

            }));
            
            const workflowData = {
                steps: stepsForExport
            };
            const jsonContent = JSON.stringify(workflowData, null, 2);
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.7);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 1000;

            modal.innerHTML = `

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">

                        <button onclick="this.closest('[data-json-modal]').remove()" style="background: #3a7a99; border: 1px solid #5a9ab9; color: #e0e0e0; padding: 6px 12px; border-radius: 3px; cursor: pointer; font-size: 0.9rem;">Close</button>
                    </div>
                    <pre style="background: #0a0a0a; padding: 12px; border-radius: 4px; color: #a0c8ff; font-family: monospace; font-size: 0.85rem; margin: 0; overflow: auto; max-height: 60vh;">${jsonContent}</pre>

            modal.setAttribute('data-json-modal', 'true');
            document.body.appendChild(modal);
            modal.addEventListener('click', (e) => {

        function showTransitionFrameProperties(frameUUID) {
            const frame = (currentTransitionFrames || []).find(f => f.id === frameUUID);
            if (!frame) return;
            
            const propertiesContent = document.getElementById('propertiesContent');
            
            propertiesContent.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #d4af37;">
                    <div style="font-size: 0.9rem; color: #e0e0e0; font-weight: 500;">Transition Frame Properties</div>
                    <button class="btn btn-red" onclick="deleteTransitionFrame('${frameUUID}')" style="padding: 6px 12px;">Delete Frame</button>
                </div>
                <div style="display: flex; flex-direction: column; gap: 15px;">
                    <div>
                        <label style="display: block; font-size: 0.8rem; color: #b0b0b0; margin-bottom: 5px;">Execution Mode</label>
                        <select id="frameExecution" class="form-field-input" style="width: 100%; padding: 6px; box-sizing: border-box; font-size: 0.85rem; background: #1a3540; color: #e0e0e0; border: 1px solid #3a7a99;">
                            <option value="First" ${frame.execution === 'First' ? 'selected' : ''}>First (stop at first match)</option>

            // Add change listener for execution mode
            const executionSelect = document.getElementById('frameExecution');

        function renderTransitionFrame(frameUUID, vertical) {
            const canvas = document.getElementById('workflowCanvas');
            const frame = currentTransitionFrames.find(f => f.id === frameUUID);
            if (!frame) return;
            
            // Remove old frame element if it exists
            const oldFrame = canvas.querySelector(`[data-transition-frame="${frameUUID}"]`);
            let framePosition = { left: 0, top: 0 };
            if (oldFrame) {
                framePosition = {
                    left: oldFrame.style.left,
                    top: oldFrame.style.top
                };
                oldFrame.remove();
            }
            
            // Create new frame container
            const frameRect = document.createElement('div');
            frameRect.setAttribute('data-transition-frame', frameUUID);
            
            if (vertical) {
                // Vertical layout: 90px wide, height grows with conditions
                // Base: 60px (1 condition), +30px for each additional condition
                const frameHeight = 60 + Math.max(0, (frame.conditions.length - 1) * 30);
                frameRect.style.cssText = `
                    position: absolute;
                    width: 90px;
                    height: ${frameHeight}px;
                    left: ${framePosition.left};
                    top: ${framePosition.top};
                    background: #3a3a2a;
                    border: 2px solid #d4af37;
                    border-radius: 4px;
                    pointer-events: auto;
                    cursor: move;
                    box-sizing: border-box;
                    z-index: 2;
                    display: flex;
                    flex-direction: row;
                `;
                
                // Header: left section, vertically centered
                const header = document.createElement('div');
                header.setAttribute('data-frame-header', frameUUID);
                const verticalHeaderFontSize = frame.conditions.length >= 2 ? '0.8rem' : '0.7rem';
                header.style.cssText = `
                    padding: 0;
                    background: #2a2a1a;
                    writing-mode: vertical-rl;
                    transform: rotate(180deg);
                    text-align: center;
                    color: #d4af37;
                    font-size: ${verticalHeaderFontSize};
                    font-weight: normal;
                    cursor: pointer;
                    user-select: none;
                    width: 28px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    pointer-events: auto;
                    white-space: nowrap;
                    flex-shrink: 0;
                `;
                header.textContent = 'Transitions';
                header.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showTransitionFrameProperties(frameUUID);
                });
                frameRect.appendChild(header);
                
                // Conditions container: right 2/3rds (60px), split vertically
                const conditionsContainer = document.createElement('div');
                conditionsContainer.setAttribute('data-frame-conditions', frameUUID);
                conditionsContainer.style.cssText = `
                    background: #d4af37;
                    border-left: 2px solid #d4af37;
                    flex: 1;
                    display: flex;
                    flex-direction: column;
                    pointer-events: auto;
                    gap: 0;
                    padding: 0;
                `;
                
                // Add condition boxes - sort by order first
                const sortedConditions = frame.conditions
                    .map(cId => currentTransitions.find(t => t.id === cId))
                    .filter(t => t)
                    .sort((a, b) => (a.order || 1) - (b.order || 1))
                    .map(t => t.id);
                
                sortedConditions.forEach(conditionId => {
                    const transition = currentTransitions.find(t => t.id === conditionId);
                    const colors = getTransitionColors(transition ? transition.type : 'Success');
                    
                    const wrapper = document.createElement('div');
                    wrapper.style.cssText = `
                        position: relative;
                        display: flex;
                        flex-direction: row;
                        align-items: center;
                        justify-content: center;
                        flex: 1;
                    `;
                    
                    const conditionBox = document.createElement('div');
                    conditionBox.setAttribute('data-condition-id', conditionId);
                    conditionBox.setAttribute('data-frame-id', frameUUID);
                    conditionBox.style.cssText = `
                        width: 56px;
                        height: 27px;
                        margin: 0 0 2px 0;
                        background: ${colors.background};
                        border: none;
                        border-radius: 2px;
                        text-align: center;
                        color: ${colors.text || '#e0e0e0'};
                        font-size: 0.7rem;
                        font-weight: bold;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        user-select: none;
                        flex-shrink: 0;
                        cursor: pointer;
                    `;
                    conditionBox.textContent = transition ? (
                        transition.type === 'Always/Logic' 
                            ? (transition.conditions ? 'Logic' : 'Always')
                            : transition.type
                    ) : 'Success';
                    conditionBox.addEventListener('click', (e) => {
                        e.stopPropagation();
                        showTransitionProperties(conditionId);
                    });
                    
                    // Add drag functionality for vertical layout
                    let isDraggingCondition = false;
                    let dragStartIndex = -1;
                    
                    conditionBox.addEventListener('mousedown', (e) => {
                        if (e.button !== 0) return; // Only left mouse button
                        e.stopPropagation();
                        isDraggingCondition = true;
                        dragStartIndex = sortedConditions.indexOf(conditionId);
                        conditionBox.style.opacity = '0.6';
                    });
                    
                    document.addEventListener('mousemove', (e) => {
                        if (!isDraggingCondition || dragStartIndex === -1) return;
                        
                        // Find which condition box is under the cursor
                        const conditionBoxes = conditionsContainer.querySelectorAll('[data-condition-id]');
                        let targetIndex = -1;
                        
                        conditionBoxes.forEach((box, idx) => {
                            const rect = box.getBoundingClientRect();
                            if (e.clientY >= rect.top && e.clientY <= rect.bottom) {
                                targetIndex = idx;
                            }
                        });
                        
                        if (targetIndex !== -1 && targetIndex !== dragStartIndex) {
                            // Reorder conditions
                            const draggedCondition = currentTransitions.find(t => t.id === conditionId);
                            const targetCondition = currentTransitions.find(t => t.id === sortedConditions[targetIndex]);
                            
                            if (draggedCondition && targetCondition) {
                                const draggedOrder = draggedCondition.order;
                                const targetOrder = targetCondition.order;
                                
                                if (targetIndex > dragStartIndex) {
                                    // Moving down - decrement orders of conditions we pass
                                    for (let i = dragStartIndex + 1; i <= targetIndex; i++) {
                                        const cond = currentTransitions.find(t => t.id === sortedConditions[i]);
                                        if (cond) cond.order--;
                                    }
                                    draggedCondition.order = targetOrder;
                                } else {
                                    // Moving up - increment orders of conditions we pass
                                    for (let i = targetIndex; i < dragStartIndex; i++) {
                                        const cond = currentTransitions.find(t => t.id === sortedConditions[i]);
                                        if (cond) cond.order++;
                                    }
                                    draggedCondition.order = targetOrder;
                                }
                                
                                dragStartIndex = targetIndex;
                                renderTransitionFrame(frameUUID, true);
                                updatePreview();
                            }
                        }
                    });
                    
                    document.addEventListener('mouseup', () => {
                        isDraggingCondition = false;
                        dragStartIndex = -1;
                        conditionBox.style.opacity = '1';
                    });
                    
                    wrapper.appendChild(conditionBox);
                    
                    // Right-pointing triangle
                    const triangle = document.createElement('div');
                    triangle.style.cssText = `
                        position: absolute;
                        width: 0;
                        height: 0;
                        border-top: 8px solid transparent;
                        border-bottom: 8px solid transparent;
                        border-left: 10px solid #d4af37;
                        left: 56px;
                        top: 50%;
                        transform: translateY(-50%);
                        pointer-events: none;
                    `;
                    wrapper.appendChild(triangle);
                    
                    conditionsContainer.appendChild(wrapper);
                });
                
                // Add + button
                const addButton = document.createElement('div');
                addButton.setAttribute('data-add-condition-btn', frameUUID);
                addButton.style.cssText = `
                    width: 100%;
                    height: calc(100% - 1px);
                    padding: 0;
                    margin: 0;
                    background: #d4af37;
                    border: none;
                    border-radius: 0;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    color: #3a3a2a;
                    font-size: 18px;
                    cursor: pointer;
                    user-select: none;
                `;
                addButton.textContent = '+';
                addButton.addEventListener('click', addConditionToFrame(frameUUID, conditionsContainer));
                conditionsContainer.appendChild(addButton);
                
                frameRect.appendChild(conditionsContainer);
            } else {
                // Horizontal layout: min 90px wide x 60px tall
                frameRect.style.cssText = `
                    position: absolute;
                    min-width: 90px;
                    height: 60px;
                    left: ${framePosition.left};
                    top: ${framePosition.top};
                    background: #3a3a2a;
                    border: 2px solid #d4af37;
                    border-radius: 4px;

                    box-sizing: border-box;

                    background: #2a2a1a;
                    text-align: center;
                    color: #d4af37;
                    font-size: 0.8rem;
                    font-weight: normal;
                    cursor: pointer;
                    user-select: none;
                    flex: 1;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    pointer-events: auto;
                `;
                header.textContent = 'Transitions';
                header.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showTransitionFrameProperties(frameUUID);

                frameRect.appendChild(header);
                
                // Conditions container: bottom, full width
                const conditionsContainer = document.createElement('div');
                conditionsContainer.setAttribute('data-frame-conditions', frameUUID);
                conditionsContainer.style.cssText = `

                sortedConditions.forEach(conditionId => {

                        conditionBoxes.forEach((box, idx) => {
                            const rect = box.getBoundingClientRect();
                            if (e.clientX >= rect.left && e.clientX <= rect.right) {
                                targetIndex = idx;
                            }
                        });
                        
                        if (targetIndex !== -1 && targetIndex !== dragStartIndex) {
                            // Reorder conditions
                            const draggedCondition = currentTransitions.find(t => t.id === conditionId);
                            const targetCondition = currentTransitions.find(t => t.id === sortedConditions[targetIndex]);
                            
                            if (draggedCondition && targetCondition) {
                                const draggedOrder = draggedCondition.order;
                                const targetOrder = targetCondition.order;
                                
                                if (targetIndex > dragStartIndex) {
                                    // Moving right - decrement orders of conditions we pass
                                    for (let i = dragStartIndex + 1; i <= targetIndex; i++) {
                                        const cond = currentTransitions.find(t => t.id === sortedConditions[i]);
                                        if (cond) cond.order--;
                                    }
                                    draggedCondition.order = targetOrder;
                                } else {
                                    // Moving left - increment orders of conditions we pass
                                    for (let i = targetIndex; i < dragStartIndex; i++) {
                                        const cond = currentTransitions.find(t => t.id === sortedConditions[i]);
                                        if (cond) cond.order++;
                                    }
                                    draggedCondition.order = targetOrder;
                                }
                                
                                dragStartIndex = targetIndex;
                                renderTransitionFrame(frameUUID, false);
                                updatePreview();
                            }
                        }
                    });
                    
                    document.addEventListener('mouseup', () => {
                        isDraggingCondition = false;
                        dragStartIndex = -1;
                        conditionBox.style.opacity = '1';
                    });
                    
                    wrapper.appendChild(conditionBox);
                    
                    // Down-pointing triangle
                    const triangle = document.createElement('div');
                    triangle.style.cssText = `
                        position: absolute;
                        width: 0;
                        height: 0;
                        border-left: 8px solid transparent;
                        border-right: 8px solid transparent;
                        border-top: 10px solid #d4af37;
                        top: 28px;
                        left: 50%;
                        transform: translateX(-50%);
                        pointer-events: none;
                    `;
                    wrapper.appendChild(triangle);
                    
                    conditionsContainer.appendChild(wrapper);
                });
                
                // Add + button
                const addButton = document.createElement('div');
                addButton.setAttribute('data-add-condition-btn', frameUUID);
                addButton.style.cssText = `
                    width: 24px;
                    height: 24px;
                    padding: 0;
                    margin: 0;
                    background: #d4af37;
                    border: 2px solid #d4af37;
                    border-radius: 2px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    color: #3a3a2a;
                    font-size: 18px;
                    cursor: pointer;
                    user-select: none;
                    flex-shrink: 0;
                `;
                addButton.textContent = '+';
                addButton.addEventListener('click', addConditionToFrame(frameUUID, conditionsContainer));
                conditionsContainer.appendChild(addButton);
                
                frameRect.appendChild(conditionsContainer);
            }
            
            // Drag handling
            let dragOffsetX = 0, dragOffsetY = 0;
            frameRect.addEventListener('mousedown', (e) => {
                if (e.target.closest('[data-frame-conditions]') && !e.target.closest('[data-condition-id]') && !e.target.closest('[data-add-condition-btn]')) {
                    return; // Don't drag from conditions container
                }
                e.stopPropagation();
                const canvasRect = canvas.getBoundingClientRect();
                dragOffsetX = (e.clientX - canvasRect.left) / zoomLevel - parseInt(frameRect.style.left) + panX;
                dragOffsetY = (e.clientY - canvasRect.top) / zoomLevel - parseInt(frameRect.style.top) + panY;
                
                document.addEventListener('mousemove', handleFrameDrag);
                document.addEventListener('mouseup', stopFrameDrag);
            });
            
            const handleFrameDrag = (e) => {
                const canvasRect = canvas.getBoundingClientRect();
                const screenX = e.clientX - canvasRect.left;
                const screenY = e.clientY - canvasRect.top;
                const gridX = (screenX / zoomLevel) + panX - dragOffsetX;
                const gridY = (screenY / zoomLevel) + panY - dragOffsetY;
                
                frameRect.style.left = gridX + 'px';
                frameRect.style.top = gridY + 'px';
                
                // Update blue lines connected to this frame
                document.querySelectorAll(`[data-to-frame="${frameUUID}"]`).forEach(line => {
                    const fromStepId = line.getAttribute('data-from-step');
                    const fromPoint = line.getAttribute('data-from-point');
                    const fromStep = canvas.querySelector(`[data-step-id="${fromStepId}"]`);
                    if (fromStep) {
                        const stepX = parseInt(fromStep.style.left);
                        const stepY = parseInt(fromStep.style.top);
                        const stepWidth = parseInt(fromStep.style.width);
                        const stepHeight = parseInt(fromStep.style.height);
                        
                        // Calculate the actual connection point based on fromPoint
                        let fromX = stepX + stepWidth / 2;
                        let fromY = stepY + stepHeight / 2;
                        
                        if (fromPoint === 'top') {
                            fromY = stepY;
                        } else if (fromPoint === 'bottom') {
                            fromY = stepY + stepHeight;
                        } else if (fromPoint === 'left') {
                            fromX = stepX;
                        } else if (fromPoint === 'right') {
                            fromX = stepX + stepWidth;
                        }
                        
                        // Get frame's actual position accounting for canvas transform
                        const frameElementRect = frameRect.getBoundingClientRect();
                        const frameX = (frameElementRect.left - canvasRect.left) / zoomLevel + panX;
                        const frameY = (frameElementRect.top - canvasRect.top) / zoomLevel + panY;
                        
                        // Use actual rendered dimensions converted to grid space
                        const frameWidth = frameElementRect.width / zoomLevel;
                        const frameHeight = frameElementRect.height / zoomLevel;
                        
                        // Find nearest side of frame
                        const frameSideCenters = [
                            { x: frameX + frameWidth / 2, y: frameY, name: 'top' },
                            { x: frameX + frameWidth / 2, y: frameY + frameHeight, name: 'bottom' },
                            { x: frameX, y: frameY + frameHeight / 2, name: 'left' },
                            { x: frameX + frameWidth, y: frameY + frameHeight / 2, name: 'right' }
                        ];
                        
                        let nearestSide = frameSideCenters[0];
                        let minDistance = Infinity;
                        frameSideCenters.forEach(side => {
                            const distance = Math.hypot(fromX - side.x, fromY - side.y);
                            if (distance < minDistance) {
                                minDistance = distance;
                                nearestSide = side;
                            }
                        });
                        
                        console.log('Drag update:', { fromX, fromY, frameX, frameY, gridX, gridY, nearestSideName: nearestSide.name });
                        const path = createCurvedPath(fromX, fromY, fromPoint, nearestSide.x, nearestSide.y, nearestSide.name);
                        line.innerHTML = `<defs><marker id="blueArrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#3a7a99"/></marker></defs><path d="${path}" stroke="#3a7a99" stroke-width="2" fill="none" marker-end="url(#blueArrowhead)"/>`;
                    }
                });
            };
            
            const stopFrameDrag = () => {
                document.removeEventListener('mousemove', handleFrameDrag);
                document.removeEventListener('mouseup', stopFrameDrag);
            };
            
            // Frame click handler
            frameRect.addEventListener('click', (e) => {
                e.stopPropagation();
                showTransitionFrameProperties(frameUUID);
                
                // Deselect all steps and frames
                document.querySelectorAll('[data-step-id]').forEach(el => {
                    el.style.borderColor = '#3a7a99';
                });
                frameRect.style.borderColor = '#ffff00';
            });
            
            canvas.appendChild(frameRect);
        }
        
        function addConditionToFrame(frameUUID, conditionsContainer) {
            return (e) => {
                e.stopPropagation();
                const frame = currentTransitionFrames.find(f => f.id === frameUUID);
                if (!frame) return;
                
                // Create new condition
                transitionCounter++;
                const newConditionId = String(transitionCounter);
                // Calculate order based on how many conditions are already in this frame
                const order = frame.conditions.length + 1;
                const newConditionData = {
                    id: newConditionId,
                    name: '',
                    type: 'Success',
                    conditions: '',
                    targetSteps: [],
                    order: order
                };
                
                // Add to frame and global list
                frame.conditions.push(newConditionId);
                currentTransitions.push(newConditionData);
                
                // Also add to the connected step's transitions array
                for (const step of currentSteps) {
                    const hasConditionFromFrame = step.transitions.some(t => 
                        frame.conditions.includes(t.id)
                    );
                    if (hasConditionFromFrame) {
                        step.transitions.push(newConditionData);
                        break;
                    }
                }
                
                // Re-render the frame to include the new condition
                const vertical = currentSteps.some(step => 
                    step.transitions.some(t => frame.conditions.includes(t.id)) && step.trans_vertical
                );
                renderTransitionFrame(frameUUID, vertical);
                
                updatePreview();
            };
        }
        
        function applyFrameLayout(frameUUID, verticalLayout) {
            // This function is now just a wrapper that calls renderTransitionFrame
            renderTransitionFrame(frameUUID, verticalLayout);
        }

            for (const step of currentSteps) {
                const hasConditionFromFrame = step.transitions.some(t => 
                    frame.conditions.includes(t.id)
                );
                if (hasConditionFromFrame) {
                    isVertical = step.trans_vertical || false;
                    executionMode = step.trans_mode || 'First';

                    frame.execution = executionMode;
                    break;
                }

            const propertiesContent = document.getElementById('propertiesContent');
            propertiesContent.innerHTML = `

                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="verticalLayout" ${isVertical ? 'checked' : ''} style="cursor: pointer;">
                        <label for="verticalLayout" style="font-size: 0.8rem; color: #b0b0b0; cursor: pointer; margin: 0;">Vertical Layout</label>

            const executionSelect = document.getElementById('frameExecution');
            if (executionSelect) {

                    // Update the step(s) connected to this frame
                    currentSteps.forEach(step => {

                        );
                        if (hasConditionFromFrame) {
                            step.trans_mode = frame.execution;
                        }
                    });
                    
                    updatePreview();
                });

            const verticalLayoutCheckbox = document.getElementById('verticalLayout');
            if (verticalLayoutCheckbox) {
                verticalLayoutCheckbox.addEventListener('change', (e) => {
                    frame.verticalLayout = e.target.checked;

                    // Find the step(s) connected to this frame and update trans_vertical
                    currentSteps.forEach(step => {
                        // Check if any condition from this frame is in the step's transitions
                        const hasConditionFromFrame = step.transitions.some(t => 
                            frame.conditions.includes(t.id)
                        );
                        if (hasConditionFromFrame) {
                            step.trans_vertical = frame.verticalLayout;
                        }
                    });
                    
                    updatePreview();
                });
            }
        }

                                    { x: stepCanvasX + stepWidth, y: stepCanvasY + 15, name: 'right' }
                                ];
                                
                                let nearestSide = sideCenters[0];
                                let minDistance = Infinity;
                                sideCenters.forEach(side => {
                                    const distance = Math.hypot(x1 - side.x, y1 - side.y);
                                    if (distance < minDistance) {
                                        minDistance = distance;
                                        nearestSide = side;
                                    }
                                });
                                
                                const greenCurvePath = createCurvedPath(x1, y1, 'bottom', nearestSide.x, nearestSide.y, nearestSide.name);
                                const transitionData = currentTransitions.find(t => t.id === fromTransitionId);
                                const transitionColors = getTransitionColors(transitionData ? transitionData.type : 'Success');
                                line.innerHTML = `<defs><marker id="greenArrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="${transitionColors.line}"/></marker></defs><path d="${greenCurvePath}" stroke="${transitionColors.line}" stroke-width="2" fill="none" marker-end="url(#greenArrowhead)"/>`;
                            }
                        });
                    }
                }
                updatePreview();
            });
            
            document.getElementById('stepType').addEventListener('change', (e) => {
                step.type = e.target.value;
                updatePreview();
            });
            
            document.getElementById('stepAction').addEventListener('change', (e) => {

        async function saveWorkflow() {
            if (!sessionToken || !currentWorkflowId) {
                alert('Not ready to save');
                return;
            }

            // Don't rebuild from form - we're using canvas-based transitions now
            const currentJson = JSON.stringify({ steps: currentSteps }, null, 2);

            // Check if changes were made
            if (currentJson === originalJson) {
                const status = document.getElementById('status');
                status.className = 'status show error';
                status.innerHTML = 'No changes to save.';
                return;
            }

            // Changes detected - show confirmation modal
            const newVersion = incrementVersion(currentVersion);
            document.getElementById('newVersion').value = newVersion;
            document.getElementById('confirmModal').classList.add('show');
        }

        function incrementVersion(version) {
            // Parse version like "1.0.0"
            const parts = version.split('.');
            if (parts.length === 3) {
                // Increment patch version
                parts[2] = String(parseInt(parts[2]) + 1);
                return parts.join('.');
            }
            // Fallback: just append .1
            return version + '.1';
        }

            document.getElementById('confirmModal').classList.remove('show');
        }

        async function confirmSave() {
            const newVersion = document.getElementById('newVersion').value;
            const workflowName = document.getElementById('workflowName').value.trim();
            
            try {
                // Rebuild steps from form fields - NOT NEEDED with canvas-based transitions
                // rebuildStepsFromForm();
                
                console.log('currentSteps before sort:', JSON.stringify(currentSteps, null, 2));
                
                // Sort transitions by order before sending
                const sortedSteps = currentSteps.map(step => ({
                    ...step,
                    transitions: [...step.transitions].sort((a, b) => (a.order || 1) - (b.order || 1))
                }));
                
                console.log('sortedSteps:', JSON.stringify(sortedSteps, null, 2));
                
                const payload = {
                    name: workflowName,
                    version: newVersion,
                    definition: {
                        steps: sortedSteps
                    }
                };

                const response = await fetch(`/kore/workflows/${currentWorkflowId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Session-Token': sessionToken
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                console.log('Save response:', response.status, data);
                const status = document.getElementById('status');

                if (response.ok) {
                    currentVersion = newVersion;
                    originalJson = JSON.stringify({ steps: currentSteps }, null, 2);
                    
                    // Refresh version selector
                    allVersions.unshift(newVersion);
                    const versionSelect = document.getElementById('versionSelector');
                    const option = document.createElement('option');
                    option.value = newVersion;
                    option.textContent = `v${newVersion}`;

                    if (status) {
                        status.className = 'status show success';
                        status.innerHTML = `✓ Workflow saved: <strong>${workflowName}@${newVersion}</strong>`;
                    }
                    // Close modal after a brief delay so user sees the success message
                    setTimeout(() => {

        // Helper function to create curved SVG path from one side of a box to another
        function createCurvedPath(x1, y1, exitSide, x2, y2, enterSide) {
            // Calculate distance between points
            const distance = Math.hypot(x2 - x1, y2 - y1);
            
            // Use smaller offset for short distances to tighten the curve
            // For distances < 60, use proportional offset; otherwise use standard 40
            let offset = Math.min(40, distance * 0.4);
            if (distance < 60) {
                offset = Math.max(10, distance * 0.3); // At least 10, at most proportional
            }
            
            let cx1, cy1, cx2, cy2;
            
            // Calculate first control point (exit from source)
            switch(exitSide) {
                case 'top': cx1 = x1; cy1 = y1 - offset; break;
                case 'bottom': cx1 = x1; cy1 = y1 + offset; break;
                case 'left': cx1 = x1 - offset; cy1 = y1; break;
                case 'right': cx1 = x1 + offset; cy1 = y1; break;
                default: cx1 = x1; cy1 = y1;
            }
            
            // Calculate second control point (enter to destination)
            switch(enterSide) {
                case 'top': cx2 = x2; cy2 = y2 - offset; break;
                case 'bottom': cx2 = x2; cy2 = y2 + offset; break;
                case 'left': cx2 = x2 - offset; cy2 = y2; break;
                case 'right': cx2 = x2 + offset; cy2 = y2; break;
                default: cx2 = x2; cy2 = y2;
            }
            
            return `M ${x1} ${y1} C ${cx1} ${cy1} ${cx2} ${cy2} ${x2} ${y2}`;
        }
