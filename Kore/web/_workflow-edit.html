<div class="panel-level-1" style="flex: 1; display: flex; flex-direction: column;">
    <div id="statusMessage"></div>
    
    <!-- Header Panel -->
    <div class="panel-level-2" style="padding: 10px; margin-bottom: 5px;">
        <div style="display: flex; align-items: flex-end; gap: 20px; justify-content: space-between;">
            <h1 id="workflowNameDisplay" style="margin: 0; font-size: 1.2rem; font-weight: 600; color: var(--text-primary); flex: 1;">-</h1>
            <div style="display: flex; gap: 8px;">
                <div style="position: relative;">
                    <button class="btn" data-color="blue" data-size="sm" onclick="toggleMoreMenu()" title="More Options" style="font-size: 1.2rem; padding-bottom:5px;">...</button>
                    <div id="moreMenu" style="display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); background: var(--secondary-slate); border: 1px solid var(--border-primary); border-radius: 4px; min-width: 120px; margin-top: 4px; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">
                        <div onclick="showWorkflowSettingsModal(); toggleMoreMenu();" style="padding: 4px 6px; color: var(--text-primary); cursor: pointer; font-size: 0.7rem; font-weight: 600; white-space: nowrap; border-bottom: 1px solid;">Workflow Settings</div>
                        <div onclick="showJSONModal(); toggleMoreMenu();" style="padding: 4px 6px; color: var(--text-primary); cursor: pointer; font-size: 0.7rem; font-weight: 600; white-space: nowrap;">View JSON</div>
                    </div>
                </div>
                <button id="saveWorkflowBtn" class="btn" data-color="green" data-size="sm" onclick="saveWorkflow()" title="Save Workflow" style="font-size: 1.4rem; padding-bottom:5px;">&#128427;</button>
                <button class="btn" data-color="gold" data-size="sm" onclick="handleTestWorkflow()" title="Test Workflow" style="font-size: 1.2rem; padding-bottom: 5px; padding-top:2px;">▶</button>
            </div>
        </div>
    </div>

    <!-- Full-Height Canvas Layout -->
    <div style="display: flex; flex: 1; width: 100%; max-width: 100%; gap: 5px;">
        <!-- Left Sidebar - Step Types -->
        <div class="panel-level-2" id="stepTypesPanel" style="width: 150px; padding: 15px; overflow-y: auto; box-sizing: border-box; display: flex; flex-direction: column; transition: width 0.3s ease;">
            <div id="stepTypeHeader" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-direction: row;">
                <div id="stepTypesTitle" style="font-size: 0.85rem; font-weight: 600; color: var(--text-primary);">Step Types</div>
                <button id="stepTypesToggle" onclick="toggleStepTypesPanel()" style="background: none; border: none; color: var(--text-primary); cursor: pointer; font-size: 0.8rem; padding: 0; display: flex; align-items: center; justify-content: center; width: 20px; height: 20px;">◀</button>
            </div>
            <div id="stepTypesList" style="display: flex; flex-direction: column; gap: 8px;">
                <div draggable="true" class="step-type-item" data-type="Kore" style="padding: 0; background: #3a3a3a; border: 2px solid #666666; border-radius: 4px; cursor: move; text-align: center; font-size: 0.9rem; color: #ffffff; user-select: none; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
                    Kore
                </div>
                <div draggable="true" class="step-type-item" data-type="Workflow" style="padding: 0; background: #4a1f77; border: 2px solid #7733bb; border-radius: 4px; cursor: move; text-align: center; font-size: 0.9rem; color: #ffffff; user-select: none; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
                    Workflow
                </div>
                <div draggable="true" class="step-type-item" data-type="Plugin" style="padding: 0; background: #0a2d55; border: 2px solid #2868a8; border-radius: 4px; cursor: move; text-align: center; font-size: 0.9rem; color: #ffffff; user-select: none; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
                    Plugin
                </div>
                <div draggable="true" class="step-type-item" data-type="End" style="padding: 0; background: #5a1a1a; border: 2px solid #cc3333; border-radius: 4px; cursor: move; text-align: center; font-size: 0.9rem; color: #ffffff; user-select: none; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
                    End
                </div>
            </div>
        </div>

        <!-- Canvas Area -->
        <div class="panel-level-3" id="canvasContainer" style="flex: 1; position: relative; overflow: hidden; box-sizing: border-box; user-select: none; padding: 0; background: var(--bg-canvas);">
            <!-- workflowCanvas, tools panel, and zoom control are created by initCanvas() in wf-canvas.js -->
        </div>

        <!-- Right Panel - Properties/Settings -->
        <div class="panel-level-2" id="propertiesPanel" style="width: 350px; padding: 15px; overflow-y: auto; box-sizing: border-box; display: none;">
            <div id="propertiesContent" style="color: var(--text-muted); font-size: 0.85rem;">Select a step or transition to edit properties</div>
        </div>
    </div>
</div>

<!-- Workflow Settings Modal -->
<div id="workflowSettingsModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--overlay-dark); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: var(--bg-panel2); border: 1px solid var(--border-primary); border-radius: 6px; padding: 24px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto;">
        <h2 style="font-size: 1.3rem; font-weight: 600; margin-bottom: 20px; margin-top: 0; color: var(--text-primary);">Workflow Settings</h2>
        
        <!-- Workflow Name Section -->
        <div style="margin-bottom: 24px;">
            <label style="display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.85rem; font-weight: 600;">Workflow Name</label>
            <input type="text" id="workflowName" placeholder="Workflow name" onchange="currentWorkflowName = this.value.trim(); currentDefinition.name = this.value.trim(); document.getElementById('workflowNameDisplay').textContent = this.value.trim(); updatePreview();" style="width: 100%; padding: 8px; background: var(--bg-input); border: 1px solid var(--border-primary); border-radius: 4px; color: var(--text-input); font-size: 0.9rem; font-family: inherit; box-sizing: border-box;">
        </div>
        
        <!-- Description Section -->
        <div style="margin-bottom: 24px;">
            <label style="display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.85rem; font-weight: 600;">Description</label>
            <textarea id="workflowDescription" placeholder="Enter workflow description..." onchange="currentDefinition.description = this.value; updatePreview();" style="width: 100%; min-height: 80px; padding: 8px; background: var(--bg-input); border: 1px solid var(--border-primary); border-radius: 4px; color: var(--text-input); font-size: 0.85rem; font-family: inherit; resize: vertical;"></textarea>
        </div>
        
        <!-- Input Variables Section -->
        <div style="margin-bottom: 24px; padding-top: 12px; border-top: 1px solid var(--border-primary);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; margin-top: 12px;">
                <div style="font-size: 0.95rem; font-weight: 600; color: var(--text-primary);">Input Variables</div>
                <button class="btn" data-size="sm" onclick="addInputVariable()" style="font-size: 0.85rem;">+ Add</button>
            </div>
            <div id="inputVariablesList"></div>
        </div>

        <!-- Output Variables Section -->
        <div style="margin-bottom: 24px; padding-top: 12px; border-top: 1px solid var(--border-primary);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; margin-top: 12px;">
                <div style="font-size: 0.95rem; font-weight: 600; color: var(--text-primary);">Output Variables</div>
                <button class="btn" data-size="sm" onclick="addOutputVariable()" style="font-size: 0.85rem;">+ Add</button>
            </div>
            <div id="outputVariablesList"></div>
        </div>

        <!-- Modal Buttons -->
        <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px;">
            <button class="btn" data-color="grey" onclick="closeWorkflowSettingsModal()">Cancel</button>
            <button class="btn" data-color="green" onclick="saveWorkflowSettings()">Save Settings</button>
        </div>
    </div>
</div>

<style>
    .step-type-item {
        transition: opacity 0.2s ease;
    }
    
    .step-type-item:hover {
        opacity: 0.8;
    }

    .step {
        position: absolute;
        padding: 0;
        font-size: 0.9rem;
        cursor: move;
        box-sizing: border-box;
        display: flex;
        align-items: stretch;
        justify-content: flex-start;
        z-index: 3;
        color: #ffffff;
        border-radius: 4px;
    }

    .step.selected {
        border-color: #ffffff;
    }

    [data-node-id].selected svg circle {
        stroke: #ffffff !important;
    }

    [data-transition-frame].selected {
        border-color: #ffffff !important;
    }

    .step.invalid {
        border: 4px solid #cc3333 !important;
    }

    .node.invalid {
        box-shadow: 0 0 0 4px #cc3333 !important;
    }

    /* Connection point base styles */
    .connectionPoint {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        border: 2px solid;
        pointer-events: auto;
        cursor: default;
        z-index: 1;
        background: #3a7a99;
        border-color: #3a7a99;
    }

    /* Step type styles now applied inline by wf-render.js via getStepTypeTheme() */
</style>

<script type="module">
  await import('/lib/plugins-front.js');
  await import('/lib/wf-core.js');
  // Initialize and load workflow immediately (DOM is ready for module scripts)
  initWorkflowEditor();
  loadWorkflow();
</script>
