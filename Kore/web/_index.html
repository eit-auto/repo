<style>
    /* Greeting/date shrink smoothly as the window narrows instead of
       overflowing or wrapping awkwardly. */
    .up-dashboard-heading {
        font-size: clamp(11px, 2.6vw, 17px);
        font-weight: 700;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* .btn sets display:flex as an author rule, which otherwise wins over
       the browser's default [hidden] { display: none } — so Save/Cancel
       need this to actually disappear outside edit mode. */
    .btn[hidden] { display: none !important; }

    /* Root fills whatever height the wrapper's content area gives us and
       does not itself scroll. Only .up-dashboard-scroll (the pod grid)
       scrolls — the greeting/date/edit-toolbar row above it stays fixed. */
    .up-dashboard-root {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
        overflow: hidden;
    }
    .up-dashboard-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
    }

    /* 4-column pod grid with fixed 100px row tracks — pods occupy an
       explicit (col-start, row-start) cell rect sized by
       (--pod-col-span, --pod-row-span), all set/updated inline by
       user_dash.js. Placement is fully manual (not auto-flow) so a pod
       can be dropped on any cell; user_dash.js's collision resolver is
       what keeps pods from overlapping after a drop or resize. */
    .up-pod-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        grid-auto-rows: 40px;
        gap: 20px;
    }
    .up-pod-grid.up-grid-drag-over { outline: 2px dashed var(--brand-light); outline-offset: 6px; }
    .up-pod {
        grid-column: var(--pod-col-start, auto) / span var(--pod-col-span, 1);
        grid-row: var(--pod-row-start, auto) / span var(--pod-row-span, 6);
        display: flex;
        flex-direction: column;
        position: relative;
        min-width: 0;
        min-height: 0;
        padding: 0;
        border-top: 3px solid var(--brand-light);
    }
    .up-pod.up-pod-dragging { opacity: .35; }
    .up-pod-grid.up-edit-mode .up-pod { outline: 1px dashed var(--border-primary); outline-offset: -1px; }

    /* Cosmetic-only fill: whichever pod(s) sit at the bottom of the
       current layout extend into the grid's final row track, which
       user_dash.js's applyBottomStretch() defines as minmax(ROW_HEIGHT,
       1fr) rather than a fixed size — so they stretch to the actual
       bottom of the viewport instead of stopping short and leaving empty
       space. Only active outside Edit mode; see that function for why. */
    .up-pod-grid.up-stretch-bottom-active .up-pod.up-pod-stretch-bottom { grid-row-end: -1; }
    .up-pod-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 8px 6px 8px;
        cursor: default;
        user-select: none;
    }
    .up-pod-grid.up-edit-mode .up-pod-header { cursor: grab; }
    .up-pod-grid.up-edit-mode .up-pod-header:active { cursor: grabbing; }
    .up-pod-title { font-size: 14px; font-weight: 700; color: var(--text-header); }
    .up-pod-body { flex: 1; overflow: auto; padding: 0 8px 8px 8px; min-height: 0; }
    .up-pod-resize-handle {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 18px;
        height: 18px;
        cursor: nwse-resize;
        touch-action: none;
        background: linear-gradient(135deg, transparent 50%, var(--brand-light) 50%);
        border-radius: 0 0 5px 0;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
    }
    .up-pod-grid.up-edit-mode .up-pod-resize-handle { opacity: 0.3; pointer-events: auto; }
    .up-pod-grid.up-edit-mode .up-pod-resize-handle:hover { opacity: 0.6; }

    /* Stack to a single column on narrow screens, ignoring the explicit
       grid position entirely; disable drag/resize there. */
    @media (max-width: 899px) {
        .up-pod-grid { grid-template-columns: 1fr !important; }
        .up-pod { grid-column: 1 / -1 !important; grid-row: auto !important; }
        .up-pod-resize-handle { display: none !important; }
    }

    /* Shared list-row style reused across pod bodies */
    .up-pod-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 4px;
        border-bottom: 1px solid var(--border-primary);
    }
    .up-pod-row:last-child { border-bottom: none; }
    .up-pod-row-title { font-size: 13.5px; font-weight: 600; color: var(--text-primary); }
    .up-pod-row-sub { font-size: 12px; color: var(--secondary-slate); }
    .up-pod-row-meta { display: flex; align-items: center; gap: 14px; }
    .up-pod-row-time { font-size: 12px; color: var(--secondary-slate); width: 52px; text-align: right; }

    /* base .status-badge has a fixed 50px content width (box-sizing:
       content-box), sized for short words like "OPEN"/"CLOSED" — too
       narrow for "Table"/"Datatable", so text overflows the pill on the
       right. Let it size to its own text instead, wherever a badge shows
       up outside the ticket table (which already has its own override). */
    .up-pod-row .status-badge,
    .up-editor-item .status-badge {
        width: auto;
    }

    /* Tighter row spacing for the Shortcuts pod specifically — everything
       else using .up-pod-row (loading/empty/error messages across every
       pod type) keeps the normal padding. */
    .up-shortcut-row { padding: 6px 4px; }
    .up-shortcut-row .up-pod-row-title { font-size: 12px; }
    .up-shortcut-row .status-badge { font-size: 10px; }

    /* Compact ticket table (Service/Project Tickets pods) */
    .up-ticket-table {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
        font-size: 10.5px;
    }
    .up-ticket-table th {
        text-align: left;
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: var(--secondary-slate);
        padding: 4px 6px;
        border-bottom: 1px solid var(--border-primary);
        background: transparent;
    }
    .up-ticket-table td {
        padding: 5px 6px;
        border-bottom: 1px solid var(--border-primary);
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .up-ticket-table tbody tr:last-child td { border-bottom: none; }
    .up-ticket-table tbody tr:hover td { background: rgba(76, 181, 255, 0.05); }
    .up-ticket-table .status-badge { font-size: 8.5px; padding: 2px 6px; width: auto; }

    /* Row highlight colors for plugin_table's highlight_rules (config-driven
       — see user_dash.js). Named tokens rather than raw config-supplied
       colors, matching the existing status-badge palette for consistency. */
    .up-ticket-table tbody tr.up-row-highlight-red td { background: var(--highlight-red); }
    .up-ticket-table tbody tr.up-row-highlight-orange td { background: var(--highlight-orange); }
    .up-ticket-table tbody tr.up-row-highlight-yellow td { background: var(--highlight-yellow); }
</style>

<div class="up-dashboard-root">
    <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:16px;min-width:0;margin-bottom:8px">
        <div id="userPortalDate" class="up-dashboard-heading" style="justify-self:start;white-space:nowrap"></div>
        <div id="userPortalGreeting" class="up-dashboard-heading" style="justify-self:center">Welcome back</div>
        <div style="display:flex;justify-self:end;gap:8px">
            <button type="button" class="btn" data-size="sm" id="upDashEditBtn">Edit Layout</button>
            <button type="button" class="btn" data-color="green" data-size="sm" id="upDashSaveBtn" hidden>Save</button>
            <button type="button" class="btn" data-color="theme-slate" data-size="sm" id="upDashCancelBtn" hidden>Cancel</button>
        </div>
    </div>

    <div class="up-dashboard-scroll custom-scrollbar">
        <div class="up-pod-grid" id="upPodGrid">
            <div class="up-pod panel-level-3" data-pod-id="service_tickets" style="--pod-col-start:1;--pod-col-span:1;--pod-row-start:1;--pod-row-span:6">
                <div class="up-pod-header" draggable="true">
                    <span class="up-pod-title"></span>
                </div>
                <div class="up-pod-body custom-scrollbar"></div>
                <div class="up-pod-resize-handle" title="Drag to resize"></div>
            </div>

            <div class="up-pod panel-level-3" data-pod-id="shortcuts" style="--pod-col-start:2;--pod-col-span:1;--pod-row-start:1;--pod-row-span:6">
                <div class="up-pod-header" draggable="true">
                    <span class="up-pod-title"></span>
                </div>
                <div class="up-pod-body custom-scrollbar"></div>
                <div class="up-pod-resize-handle" title="Drag to resize"></div>
            </div>

            <div class="up-pod panel-level-3" data-pod-id="announcements" style="--pod-col-start:3;--pod-col-span:1;--pod-row-start:1;--pod-row-span:6">
                <div class="up-pod-header" draggable="true">
                    <span class="up-pod-title"></span>
                </div>
                <div class="up-pod-body custom-scrollbar"></div>
                <div class="up-pod-resize-handle" title="Drag to resize"></div>
            </div>

            <div class="up-pod panel-level-3" data-pod-id="project_tickets" style="--pod-col-start:4;--pod-col-span:1;--pod-row-start:1;--pod-row-span:6">
                <div class="up-pod-header" draggable="true">
                    <span class="up-pod-title"></span>
                </div>
                <div class="up-pod-body custom-scrollbar"></div>
                <div class="up-pod-resize-handle" title="Drag to resize"></div>
            </div>

            <div class="up-pod panel-level-3" data-pod-id="user_calendar" style="--pod-col-start:1;--pod-col-span:1;--pod-row-start:10;--pod-row-span:6">
                <div class="up-pod-header" draggable="true">
                    <span class="up-pod-title"></span>
                </div>
                <div class="up-pod-body custom-scrollbar"></div>
                <div class="up-pod-resize-handle" title="Drag to resize"></div>
            </div>
        </div>
    </div>
</div>

<script type="module" src="/lib/user_dash.js"></script>
