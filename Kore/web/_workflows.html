<div class="panel-level-1">
        <div id="statusMessage"></div>
        <div class="panel-grid-responsive" style="grid-template-columns: 230px 1fr;">
            <div class="panel-level-2 workflows-sidebar">
                <div id="foldersPanelContainer"></div>
            </div>
            <div class="panel-level-2 workflows-main">
                <div style="display: flex; justify-content: flex-start; align-items: center; margin-bottom: 15px; gap: 15px;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap;">
                            <input type="checkbox" id="hideInactive" checked style="cursor: pointer;" onchange="applyHideInactive()">
                            <span style="color: var(--text-muted); font-size: 0.9rem;">Hide Inactive</span>
                        </label>
                    </div>
                    <h2 style="margin: 0; flex: 1; text-align: center; font-size: 16px; color: var(--text-primary);">Workflows</h2>
                    <button class="btn" data-color="green" onclick="openCreateModal()">Create New Workflow</button>
                </div>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <div class="loading show" id="loadingSpinner">Loading workflows...</div>
                    <div id="workflowsList" class="panel-level-3" style="padding: 0;"></div>
                </div>
        </div>
        </div>
<style>
    .loading {
        display: none;
        text-align: center;
        color: var(--text-muted);
    }
    .loading.show {
        display: block;
    }
</style>
<script type="modules"> // UTILITY FUNCTIONS
await import('/lib/workflows.js');
window.addEventListener('DOMContentLoaded', async () => {
await loadWorkflows(); // Load workflows data
await buildWorkflowFoldersPanel('foldersPanelContainer', 'workflow-folders', 'workflows', 'renderFilteredWorkflows'); // Build and populate the folder sidebar
});
</script>
