<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persephone Workflows</title>
    <link rel="stylesheet" href="/base.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #191A24;
            padding: 0;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            display: flex;
            margin: 0;
            padding: 8px;
            box-sizing: border-box;
            height: 100%;
        }

        .form-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .main-panel {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .main-panel > .inner-panel:last-of-type {
            flex: 1;
            overflow-y: auto;
        }

        .workflows-content-wrapper {
            display: flex;
            gap: 8px;
            flex: 1;
            overflow: hidden;
        }

        .workflows-sidebar {
            width: 200px;
            flex-shrink: 0;
        }

        .workflows-main {
            flex: 1;
            overflow: hidden;
        }

        header {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 217, 255, 0.2);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 8px 16px;
            font-size: 0.85rem;
        }

        .btn-secondary:hover {
            background: var(--border);
            border-color: var(--accent);
        }

        .workflows-table {
            width: 100%;
            border-collapse: collapse;
        }

        .workflow-name {
            font-weight: 600;
            color: var(--text-primary);
        }

        .version {
            color: var(--text-secondary);
            font-family: 'Monaco', monospace;
            font-size: 0.9rem;
        }

        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status.active {
            background: rgba(0, 217, 127, 0.2);
            color: var(--success);
        }

        .status.inactive {
            background: rgba(168, 175, 199, 0.2);
            color: var(--text-secondary);
        }

        .actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #1a3540;
            border: 1px solid #3a7a99;
            border-radius: 6px;
            padding: 20px;
            min-width: 400px;
            box-shadow: none;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 15px;
            color: #e0e0e0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #b0b0b0;
            font-size: 0.8rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 6px;
            background: #0d2132;
            border: 1px solid #3a7a99;
            border-radius: 3px;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 0.85rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #5a9ab9;
            background: #0f2838;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .status-message {
            padding: 10px 12px;
            border-radius: 3px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }

        .status-message.show {
            display: block;
        }

        .status-message.error {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .loading {
            display: none;
            text-align: center;
            color: var(--text-secondary);
        }

        .loading.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
        <div class="main-panel">
        <div class="inner-panel">
        <header>
            <div>
                <h1>Workflows</h1>
                <p style="color: var(--text-secondary); font-size: 0.95rem;">Manage automation workflows</p>
            </div>
        </header>
        </div>

        <div style="height: 20px;"></div>

        <div class="workflows-content-wrapper">
            <div class="inner-panel workflows-sidebar">
                <div id="foldersPanelContainer"></div>
            </div>

            <div class="inner-panel workflows-main">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin: 0;">
                        <input type="checkbox" id="hideInactive" checked style="cursor: pointer;" onchange="applyHideInactive()">
                        <span style="color: var(--text-secondary); font-size: 0.9rem;">Hide Inactive</span>
                    </label>
                    <button class="btn btn-blue btn-small" onclick="openCreateModal()">Create New Workflow</button>
                </div>
                <div class="loading show" id="loadingSpinner">Loading workflows...</div>
                <div id="workflowsList"></div>
            </div>
        </div>
        </div><!-- close main-panel -->
        </div><!-- close form-container -->
    </div>

    <script src="/lib/kore-lib.js"></script>
    <script src="/lib/workflow.js"></script>
    <script>
        // Create folder modal
        async function openCreateFolderModal() {
            // Get current folders for dropdown
            const response = await fetch('https://app.equinoxits.com:1139/kore/workflow-folders', {
                method: 'GET',
                headers: { 
                    'X-Session-Token': sessionToken,
                    'Content-Type': 'application/json'
                }
            });
            const data = await response.json();
            const folders = data.folders || [];

            const modalOverlay = document.createElement('div');
            modalOverlay.style.cssText = `
                display: flex;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                z-index: 2000;
                align-items: center;
                justify-content: center;
            `;

            const modalBox = document.createElement('div');
            modalBox.style.cssText = `
                background: #234656;
                border-radius: 8px;
                padding: 15px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
                min-width: 400px;
                max-width: 600px;
            `;

            // Title
            const titleEl = document.createElement('h2');
            titleEl.style.cssText = 'margin: 0 0 20px 0; color: #ffffff; font-size: 1.3rem;';
            titleEl.textContent = 'Create New Folder';
            modalBox.appendChild(titleEl);

            // Folder name label
            const nameLabel = document.createElement('label');
            nameLabel.style.cssText = 'display: block; color: #ffffff; font-size: 13px; margin-bottom: 3px; font-weight: 600;';
            nameLabel.textContent = 'Folder Name';
            modalBox.appendChild(nameLabel);

            // Folder name input
            const folderNameInput = document.createElement('input');
            folderNameInput.type = 'text';
            folderNameInput.placeholder = 'Enter folder name';
            folderNameInput.style.cssText = `
                width: 100%;
                padding: 12px;
                box-sizing: border-box;
                border: 1px solid #556870;
                border-radius: 6px;
                background: #1a3540;
                color: #ffffff;
                font-size: 14px;
                margin-bottom: 15px;
            `;
            modalBox.appendChild(folderNameInput);

            // Parent folder label
            const parentLabel = document.createElement('label');
            parentLabel.style.cssText = 'display: block; color: #ffffff; font-size: 13px; margin-bottom: 3px; font-weight: 600;';
            parentLabel.textContent = 'Parent Folder (optional)';
            modalBox.appendChild(parentLabel);

            // Parent folder dropdown
            const parentSelect = document.createElement('select');
            parentSelect.style.cssText = `
                width: 100%;
                padding: 12px;
                box-sizing: border-box;
                border: 1px solid #556870;
                border-radius: 6px;
                background: #1a3540;
                color: #ffffff;
                font-size: 14px;
                margin-bottom: 15px;
            `;
            
            const noneOption = document.createElement('option');
            noneOption.value = '';
            noneOption.textContent = '-- None --';
            parentSelect.appendChild(noneOption);

            folders.forEach(folder => {
                const option = document.createElement('option');
                option.value = folder.id;
                option.textContent = folder.name;
                parentSelect.appendChild(option);
            });
            modalBox.appendChild(parentSelect);

            // Error element
            const errorElement = document.createElement('div');
            errorElement.style.cssText = `
                color: #ff6b6b;
                font-size: 12px;
                margin-bottom: 15px;
                display: none;
            `;
            modalBox.appendChild(errorElement);

            // Buttons
            const buttonContainer = document.createElement('div');
            buttonContainer.style.cssText = 'display: flex; gap: 10px; justify-content: flex-end; margin-top: 25px;';
            
            const cancelBtn = document.createElement('button');
            cancelBtn.textContent = 'Cancel';
            cancelBtn.className = 'btn btn-secondary btn-small';
            cancelBtn.onclick = () => modalOverlay.remove();
            buttonContainer.appendChild(cancelBtn);

            const createBtn = document.createElement('button');
            createBtn.textContent = 'Create';
            createBtn.className = 'btn btn-blue btn-small';
            createBtn.onclick = async () => {
                const folderName = folderNameInput.value.trim();
                if (!folderName) {
                    errorElement.textContent = 'Folder name is required';
                    errorElement.style.display = 'block';
                    return;
                }
                const parentId = parentSelect.value || null;
                await createNewWorkflowFolder(folderName, parentId);
                modalOverlay.remove();
            };
            buttonContainer.appendChild(createBtn);

            modalBox.appendChild(buttonContainer);
            modalOverlay.appendChild(modalBox);

            // Close on overlay click
            modalOverlay.onclick = (e) => {
                if (e.target === modalOverlay) {
                    modalOverlay.remove();
                }
            };

            document.body.appendChild(modalOverlay);
            folderNameInput.focus();
        }

        // Initialize on page load
        window.addEventListener('load', () => {
            auth(async () => {
                await loadWorkflows();
                // Build folders panel after workflows are fully loaded
                await buildWorkflowFoldersPanel('foldersPanelContainer', 'workflow-folders', 'workflows', 'renderFilteredWorkflows');
            });
        });
    </script>
</body>
</html>
