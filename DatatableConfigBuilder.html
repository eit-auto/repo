    <div id="page-content">
    <div class="main-panel">

                    <div class="form-container"><div class="form-group">
                        <select id="existingConfigDropdown" onchange="updateLoadButtonState()">
                            <option value="">-- Existing DataTable Configuration --</option>
                        </select>
                    </div>
</div>
                </div>
                <button id="loadConfigBtn" class="btn btn-green" onclick="loadSelectedConfig()" disabled>Load</button>
            </div>
            <div style="display: flex; gap: 0.5rem;">
                <button id="deleteBtn" class="btn btn-red" onclick="deleteConfiguration()" disabled>Delete</button>
                <button id="saveBtn" class="btn btn-green" onclick="saveConfiguration()">Save</button>
                <button id="resetBtn" class="btn btn-bluegrey" onclick="resetConfiguration()">Reset</button>
            </div>
        </div>

            </div>
        </div>

        <div class="main-content" id="mainContent">
            <!-- Basic Configuration Panel -->
            <div class="inner-panel">
                <h2>Basic Configuration</h2>

                <div class="form-container"><div class="form-group" style="grid-column: 1 / -1;">
                    <label class="">Datatable Name</label>
                    <input type="text" id="datatableName" placeholder="e.g., automation_requests">
                </div>
</div>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const ORG_ID = window.ORG_ID;
        const DISCOVERY_WORKFLOW_ID = '0198d3fa-fa9b-75ac-9866-341fda8e72a3';
        const userName = "{{ CTX.user.username }}" || "Unknown User";
        const getCurrentTimeStamp = () => new Date().toISOString();
        let nextDatatableNumber = 1;  // Will be calculated after loading org vars
        
        // ============================================
        // FETCH EXISTING DATATABLE CONFIGURATIONS
        // ============================================
        let datatableConfigsAlreadyFetched = false;
        let datatableConfigsCurrentlyFetching = false;
        let datatableConfigsFetchPromise = null;

        async function loadOrgVariables() {
            // If already fetched, return immediately
            if (datatableConfigsAlreadyFetched) {
                console.log('Datatable configs already fetched, skipping...');
                return window.savedOrgVariables || [];
            }
            
            // If currently fetching, wait for that to complete
            if (datatableConfigsCurrentlyFetching && datatableConfigsFetchPromise) {
                console.log('Datatable configs currently being fetched, waiting for completion...');
                return await datatableConfigsFetchPromise;
            }
            
            // Set flag and create promise
            datatableConfigsCurrentlyFetching = true;
            
            datatableConfigsFetchPromise = (async () => {
                try {
                    console.log('Fetching datatable configurations from org variables...');
                    
                    const response = await fetch('/graphql', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            query: `{
                                visibleOrgVariables(
                                    visibleForOrgId: "${ORG_ID}"
                                    search: { 
                                        organization: { id: { _eq: "${ORG_ID}" } }
                                        name: { _ilike: "datatable_%" }
                                    }
                                ) {
                                    id
                                    name
                                    value
                                    category
                                    cascade
                                    createdAt
                                    updatedAt
                                    organization {
                                        id
                                        name
                                    }
                                }
                            }`
                        })
                    });

                    const data = await response.json();
                    console.log('GraphQL Response:', data);

                    if (data.errors) {
                        throw new Error(`GraphQL Error: ${data.errors[0]?.message || 'Unknown error'}`);
                    }

                    // Extract org variables
                    const variables = data.data?.visibleOrgVariables || [];
                    
                    if (!variables || variables.length === 0) {
                        console.warn('No datatable configurations found');
                        datatableConfigsCurrentlyFetching = false;
                        datatableConfigsAlreadyFetched = true;
                        window.savedOrgVariables = [];
                        return [];
                    }

                    // Build datatable config objects from variables
                    const configs = variables.map(v => {
                        let configName = v.name;
                        let configData = null;
                        
                        try {
                            configData = JSON.parse(v.value);
                            // Try both 'name' and 'datatable_name' fields
                            if (configData.name) {
                                configName = configData.name;
                            } else if (configData.datatable_name) {
                                configName = configData.datatable_name;
                            }
                        } catch (e) {
                            // If not valid JSON, use the variable name
                        }
                        
                        return {
                            config_id: v.name.replace('datatable_', ''),
                            config_name: configName,
                            config_raw: v.value,
                            config_parsed: configData,
                            orgVarId: v.id,
                            orgVarName: v.name
                        };
                    });

                    console.log('Successfully extracted datatable configs:', configs);
                    console.log('Number of configs:', configs.length);
                    
                    // Calculate next datatable number
                    const existingNumbers = configs.map(c => {
                        const match = c.orgVarName.match(/datatable_(\d+)/);
                        return match ? parseInt(match[1]) : 0;
                    });
                    nextDatatableNumber = Math.max(0, ...existingNumbers) + 1;
                    console.log('Next datatable number will be:', nextDatatableNumber);
                    
                    // Store org variables globally for use in the builder
                    window.savedOrgVariables = configs;
                    
                    datatableConfigsAlreadyFetched = true;
                    datatableConfigsCurrentlyFetching = false;
                    
                    return configs;
                    
                } catch (error) {
                    console.error('Error fetching datatable configurations:', error);
                    console.error('Error stack:', error.stack);
                    
                    datatableConfigsCurrentlyFetching = false;
                    return [];
                }
            })();
            
            return await datatableConfigsFetchPromise;
        }

        // ============================================

        let columns = [];

        let filters = [];  // Array to store filter objects {col_name, display_label, default_checked}

        // ============================================
        // REWST APP LIBRARY
        // ============================================
        class RewstApp {
            constructor(config = {}) {
                this.graphqlUrl = config.graphqlPath || '/graphql';
                this.orgId = config.orgId || null;
                this.isInitialized = config.orgId ? true : false;
                this.debugMode = config.debug || false;
            }

            _log(...args) {
                if (this.debugMode) console.log('[Rewst]', ...args);
            }

            _error(message, error) {
                console.error(`[Rewst Error] ${message}`);
                if (error) console.error('Details:', error);
            }

            async getWorkflowTriggers(workflowId) {
                const query = `
                    query getTriggers($id: ID!) {
                        workflowTriggers: workflow(where: {id: $id}) {
                            triggers {
                                id
                                enabled
                                orgInstances {
                                    id
                                    orgId
                                }
                            }
                        }
                    }
                `;

                const result = await this._graphql('getTriggers', query, { id: workflowId });
                return result.workflowTriggers?.triggers || [];
            }

            async runWorkflowSmart(workflowId, inputData = {}, options = {}) {
                if (!this.isInitialized) {
                    throw new Error('Rewst not initialized. Missing orgId.');
                }

                this._log('Running workflow:', workflowId);
                return await this.runWorkflowWithWait(workflowId, inputData, options);
            }

            async runWorkflowWithWait(workflowId, inputData = {}, options = {}) {
                const query = `
                    mutation testWorkflow($id: ID!, $orgId: ID!, $input: JSON) {
                        testResult: testWorkflow(id: $id, orgId: $orgId, input: $input) {
                            executionId
                        }
                    }
                `;

                const testResult = await this._graphql('testWorkflow', query, { 
                    id: workflowId, 
                    orgId: this.orgId,
                    input: inputData 
                });
                this._log('Workflow execution started:', testResult.testResult.executionId);
                
                return await this._waitForCompletion(testResult.testResult.executionId, options.onProgress);
            }

            async getExecutionStatus(executionId) {
                const query = `
                    query getExecution($id: ID!) {
                        workflowExecution(where: {id: $id}) {
                            id
                            status
                            conductor {
                                errors
                                output
                            }
                        }
                    }
                `;

                const result = await this._graphql('getExecution', query, { id: executionId });
                return result.workflowExecution || {};
            }

            async _waitForCompletion(executionId, onProgress = null) {
                const pollInterval = 2000;
                const maxAttempts = 150;
                let attempts = 0;
                let emptyOutputRetries = 0;
                const maxEmptyRetries = 5;

                await new Promise(resolve => setTimeout(resolve, 500));

                while (attempts < maxAttempts) {
                    try {
                        const execution = await this.getExecutionStatus(executionId);
                        
                        if (onProgress) {
                            try {
                                onProgress(execution.status);
                            } catch (e) {}
                        }

                        const terminalStates = ['COMPLETED', 'SUCCESS', 'succeeded', 'FAILED', 'failed', 'ERROR'];
                        const isComplete = terminalStates.some(s => execution.status?.toUpperCase?.() === s.toUpperCase());

                        if (isComplete) {
                            const isFailed = ['FAILED', 'failed', 'ERROR'].some(s => execution.status?.toUpperCase?.() === s.toUpperCase());
                            if (isFailed) {
                                throw new Error(`Workflow failed: ${execution.status}`);
                            }
                            
                            // Check if output is empty and retry if we haven't hit max retries
                            const hasOutput = execution.conductor?.output && Object.keys(execution.conductor.output).length > 0;
                            if (!hasOutput && emptyOutputRetries < maxEmptyRetries) {
                                emptyOutputRetries++;
                                this._log(`Workflow completed but output empty, retrying (${emptyOutputRetries}/${maxEmptyRetries})`);
                                await new Promise(resolve => setTimeout(resolve, 2000));
                                attempts++;
                                continue;
                            }
                            
                            return { ...execution, success: true };
                        }

                        await new Promise(resolve => setTimeout(resolve, pollInterval));
                        attempts++;

                    } catch (err) {
                        this._error('Error checking execution status', err);
                        throw err;
                    }
                }

                throw new Error('Workflow execution timeout');
            }

            async _graphql(operationName, query, variables) {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 30000);

                try {
                    const response = await fetch(this.graphqlUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query, variables, operationName }),
                        signal: controller.signal
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const data = await response.json();
                    if (data.errors) {
                        throw new Error(data.errors[0]?.message || 'GraphQL error');
                    }
                    
                    return data.data;
                } catch (err) {
                    throw err;
                } finally {
                    clearTimeout(timeout);
                }
            }
        }

        const rewst = new RewstApp({

            document.body.appendChild(deletingModal);
            
            (async () => {
                try {
                    const orgVarId = window.savedOrgVariables.find(v => v.orgVarName === orgVarName)?.orgVarId;
                    
                    if (!orgVarId) {
                        throw new Error('Could not find org variable ID for deletion');
                    }
                    
                    console.log('Deleting org variable:', orgVarName, 'with ID:', orgVarId);
                    
                    const deleteResult = await rewst._graphql('deleteOrgVariable', `
                        mutation deleteOrgVariable($id: ID!) {
                            deleteOrgVariable(id: $id)
                        }
                    `, {
                        id: orgVarId
                    });
                    
                    console.log('Delete result:', deleteResult);
                    
                    document.body.removeChild(deletingModal);
                    document.body.removeChild(backdrop);
                    
                    showModalMessage(`Configuration "${configName}" has been deleted`, 'success');
                    
                    // Reset form and reload org variables
                    setTimeout(() => {
                        datatableConfigsAlreadyFetched = false;
                        resetConfiguration();
                        loadOrgVariables().then(() => {
                            // Repopulate the dropdown after org variables are loaded
                            populateExistingConfigDropdown();

                    return;
                }
            }
            
            // Set flag to prevent marking as changed during reset

            // Clear all form fields
            datatableName.value = '';
            datatableDesc.value = '';
            dataWorkflow.value = '';
            dataWorkflow.dataset.value = '';
            updateWorkflow.value = '';
            updateWorkflow.dataset.value = '';
            outputVar.value = '';
            sqlQuery.value = '';
            tableName.value = '';
            tableName.dataset.value = '';
            
            allowCreate.checked = true;
            allowUpdate.checked = true;
            allowDelete.checked = true;

            if (editTypeWindow) {

            }

            columns = [];
            inputVariables = [];
            filters = [];

            window.currentEditingConfigId = null;

            isLocked = false;

            if (lockWarningRow) lockWarningRow.style.display = 'none';
            
            // Reset dropdown to placeholder
            const configDropdown = document.getElementById('existingConfigDropdown');
            if (configDropdown) configDropdown.value = '';
            
            const loadBtn = document.getElementById('loadConfigBtn');
            if (loadBtn) loadBtn.disabled = true;
            
            const deleteBtn = document.getElementById('deleteBtn');
            if (deleteBtn) deleteBtn.disabled = true;
            
            // Re-enable save button
            const saveBtn = document.getElementById('saveBtn');
            if (saveBtn) saveBtn.disabled = false;
            
            // Trigger re-render
            renderColumns();
            renderInputVariables();
            renderFilters();
            sqlData.dispatchEvent(new Event('change', { bubbles: true }));
            resetChangeTracking();
            updateOutput();
            
            // Clear the flag after reset is complete
            isResetting = false;

        function loadSavedConfiguration(configId) {
            if (!window.savedOrgVariables) {
                alert('No saved configurations loaded yet');
                return;
            }
            
            // Reset form first
            resetConfiguration();
            
            const savedConfig = window.savedOrgVariables.find(v => v.config_id === configId);
            if (!savedConfig) {
                alert(`Configuration not found`);
                return;
            }
            
            try {
                // Track that we're editing this config
                window.currentEditingConfigId = configId;
                window.currentEditingOrgVarName = savedConfig.orgVarName;
                
                // Enable delete button since we have a config loaded
                const deleteBtn = document.getElementById('deleteBtn');
                if (deleteBtn) deleteBtn.disabled = false;
                
                const config = savedConfig.config_parsed;
                console.log('Loading configuration:', config);
                
                // Populate form fields - use correct field names from saved config
                datatableName.value = config.name || config.datatable_name || '';
                datatableDesc.value = config.desc || config.datatable_description || '';
                
                // Set workflows - find the workflow name from allWorkflows if available
                const dataWorkflowId = config.data_workflow || '';
                const updateWorkflowId = config.update_workflow || '';
                
                if (dataWorkflowId && typeof allWorkflows !== 'undefined' && allWorkflows.length > 0) {
                    const dataWf = allWorkflows.find(w => w.id === dataWorkflowId);
                    if (dataWf) {
                        dataWorkflow.value = dataWf.name;
                        dataWorkflow.dataset.value = dataWf.id;
                    } else {
                        // Workflow not found in list, just set the ID
                        dataWorkflow.value = dataWorkflowId;
                        dataWorkflow.dataset.value = dataWorkflowId;
                    }
                } else {
                    dataWorkflow.value = dataWorkflowId;
                    dataWorkflow.dataset.value = dataWorkflowId;
                }
                
                if (updateWorkflowId && typeof allWorkflows !== 'undefined' && allWorkflows.length > 0) {
                    const updateWf = allWorkflows.find(w => w.id === updateWorkflowId);
                    if (updateWf) {
                        updateWorkflow.value = updateWf.name;
                        updateWorkflow.dataset.value = updateWf.id;
                    } else {
                        // Workflow not found in list, just set the ID
                        updateWorkflow.value = updateWorkflowId;
                        updateWorkflow.dataset.value = updateWorkflowId;
                    }
                } else {
                    updateWorkflow.value = updateWorkflowId;
                    updateWorkflow.dataset.value = updateWorkflowId;
                }
                
                outputVar.value = config.output_var || '';
                
                allowCreate.checked = config.allow_create !== false;
                allowUpdate.checked = config.allow_update !== false;
                allowDelete.checked = config.allow_delete !== false;
                
                // Load permissions
                if (config.permissions && Array.isArray(config.permissions)) {
                    const permissionsSelect = document.getElementById('permissionsSelect');
                    if (permissionsSelect) {
                        permissionsSelect.setAttribute('data-selected-values', JSON.stringify(config.permissions));
                    }
                }
                
                // Handle edit_type radio buttons
                const editType = config.edit_type || 'window';
                const editTypeRadio = document.querySelector(`input[name="editType"][value="${editType}"]`);
                if (editTypeRadio) {
                    editTypeRadio.checked = true;
                }
                
                // Handle use_sql checkbox
                if (config.use_sql !== undefined) {
                    sqlData.checked = config.use_sql;
                }
                
                // Handle table_name field
                if (config.table_name) {
                    tableName.value = config.table_name;
                    tableName.dataset.value = config.table_name;
                }
                
                // Populate SQL query if it exists
                if (config.input_vars && config.input_vars.sql_query) {
                    sqlQuery.value = config.input_vars.sql_query;
                }
                
                // Populate columns - handle both old and new field names
                columns = [];
                const colSettings = config.col_settings || config.column_settings || [];
                if (Array.isArray(colSettings)) {
                    columns = colSettings.map(col => ({
                        col_name: col.col_name || '',
                        data_type: col.type || col.data_type || '',
                        col_label: col.col_label || '',
                        required: col.required || false,
                        p_key: col.p_key || false,
                        hide_table: col.hide_table || false,
                        hide_edit: col.hide_edit || false,
                        editable: col.editable !== false,
                        gen: col.gen || false,
                        from_sql: col.from_sql || false,
                        not_null: col.not_null || false
                    }));
                }
                
                // Populate input variables - exclude sql_query since it's handled separately
                inputVariables = [];
                if (config.input_vars && typeof config.input_vars === 'object') {
                    Object.entries(config.input_vars).forEach(([key, value]) => {
                        if (key !== 'sql_query') {
                            // Check if this variable has config info
                            let varConfig = {};
                            if (config.input_var_config && Array.isArray(config.input_var_config)) {
                                varConfig = config.input_var_config.find(v => v.name === key) || {};
                            }
                            
                            // Get workflow name from ID if available
                            const workflowId = varConfig.workflow || '';
                            let workflowName = '';
                            if (workflowId && typeof allWorkflows !== 'undefined' && allWorkflows.length > 0) {
                                const wf = allWorkflows.find(w => w.id === workflowId);
                                workflowName = wf ? wf.name : workflowId;
                            } else {
                                workflowName = workflowId;
                            }
                            
                            inputVariables.push({
                                name: key,
                                value: value || '',
                                fromUrl: varConfig.from_url || false,
                                required: varConfig.required || false,
                                fromDataset: varConfig.from_dataset || false,
                                datatable_var: varConfig.datatable_var || false,
                                dspl_name: varConfig.dspl_name || '',
                                dataset_source: varConfig.dataset_source || 'workflow',
                                workflow: workflowName,
                                workflow_id: workflowId,
                                input_var: varConfig.input_var || '',
                                proxy_query: varConfig.proxy_query || '',
                                graphql_operation: varConfig.graphql_operation || '',
                                output_var: varConfig.output_var || '',
                                output_id: varConfig.output_id || 'id',
                                output_label: varConfig.output_label || 'name'
                            });
                        }
                    });
                }
                
                // Populate filters
                filters = [];
                if (config.filters && Array.isArray(config.filters)) {
                    filters = config.filters.map(filterItem => ({
                        col_name: filterItem.col_name || '',
                        display_label: filterItem.display_label || '',
                        default_checked: filterItem.default_checked !== false
                    }));
                }
                
                // Trigger the sqlData checkbox change event to show/hide relevant fields
                if (config.use_sql) {
                    // Use a small delay to ensure the DOM is ready before triggering the event
                    setTimeout(() => {
                        console.log('Triggering sqlData change event for MySQL config');
                        sqlData.dispatchEvent(new Event('change', { bubbles: true }));
                    }, 100);
                } else {
                    // For workflow-based configs, ensure workflow fields are visible
                    setTimeout(() => {
                        console.log('Ensuring workflow fields are visible for workflow-based config');
                        const dataWorkflowGroup = document.getElementById('dataWorkflowGroup');
                        const outputVarGroup = document.getElementById('outputVarGroup');
                        const updateWorkflowGroup = document.getElementById('updateWorkflowGroup');
                        if (dataWorkflowGroup) dataWorkflowGroup.style.display = 'block';
                        if (outputVarGroup) outputVarGroup.style.display = 'block';
                        if (updateWorkflowGroup) updateWorkflowGroup.style.display = 'block';
                    }, 100);
                }
                
                renderColumns();
                renderInputVariables();
                renderFilters();
                updateOutput();
                markConfigurationLoaded();
                
                // Check if configuration is locked
                isLocked = config.locked === true;
                const saveBtn = document.getElementById('saveBtn');
                const lockWarningRow = document.getElementById('lockWarningRow');
                const lockWarningDiv = document.getElementById('lockWarning');
                
                if (isLocked && saveBtn) {
                    saveBtn.disabled = true;
                    if (lockWarningRow && lockWarningDiv) {
                        const orgVarName = window.currentEditingOrgVarName || 'datatable_config';
                        lockWarningDiv.innerHTML = `This configuration is locked, no edits can be saved. Unlock by manually editing the associated org variable '<strong>${orgVarName}</strong>' and setting <strong>locked</strong> to <strong>false</strong>.`;
                        lockWarningRow.style.display = 'block';
                    }
                }
                
                showModalMessage(`Configuration "${savedConfig.config_name}" loaded successfully!`, 'success');
            } catch (error) {
                console.error('Error loading configuration:', error);
                showModalMessage('Error loading configuration: ' + error.message, 'error');
            }
        }

        // INITIALIZATION
        // ============================================
        function initializeApp() {
            console.log('initializeApp: Starting');
            
            // Initialize Load button state
            updateLoadButtonState();
            
            // Load organization variables on page load
            loadOrgVariables().then(configs => {
                if (configs && configs.length > 0) {
                    console.log('Available saved configurations:', configs.map(c => c.config_name));
                    console.log('Configs ready for loading:', configs);
                    // Populate the dropdown
                    populateExistingConfigDropdown();

                    console.log('No datatable configurations found');
                }
            });
            
            // Get DOM elements
            datatableName = document.getElementById('datatableName');
            datatableDesc = document.getElementById('datatableDesc');
            sqlData = document.getElementById('sqlData');
            tableName = document.getElementById('tableName');
            tableNameGroup = document.getElementById('tableNameGroup');
            sqlQueryGroup = document.getElementById('sqlQueryGroup');
            dataWorkflow = document.getElementById('dataWorkflow');
            updateWorkflow = document.getElementById('updateWorkflow');
            sqlQuery = document.getElementById('sqlQuery');
            outputVar = document.getElementById('outputVar');
            allowCreate = document.getElementById('allowCreate');
            allowUpdate = document.getElementById('allowUpdate');
            allowDelete = document.getElementById('allowDelete');
            newColName = document.getElementById('newColName');
            columnsList = document.getElementById('columnsList');
            filtersList = document.getElementById('filtersList');
            jsonOutput = document.getElementById('jsonOutput');

            validationOutput = document.getElementById('validationOutput');
            
            console.log('initializeApp: DOM elements loaded');
            
            // Set default permissions to "role-admin" on page load
            const permissionsSelect = document.getElementById('permissionsSelect');
            if (permissionsSelect) {
                permissionsSelect.setAttribute('data-selected-values', JSON.stringify(['role-admin']));
                console.log('initializeApp: Set default permissions to role-admin');
            }
            
            // Listen for permissions being saved in modal
            document.addEventListener('permissionsSaved', () => {
                console.log('initializeApp: Permissions saved, updating output');
                updateOutput();
            });
            
            // Event listeners for real-time updates
            [datatableName, datatableDesc, sqlQuery, outputVar, allowCreate, allowUpdate, allowDelete, tableName].forEach(el => {
                if (el) {
                    el.addEventListener('change', updateOutput);
                    el.addEventListener('input', updateOutput);
                }
            });
            
            if (newColName) {
                newColName.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        addColumn();
                    }
                });
            }

            // Helper functions for workflow field state management
            const sqlWorkflowId = '0198d3fa-fa9b-75ac-9866-341fda8e72a3';
            
            function setSQLWorkflow(field, dropdown) {
                const sqlWorkflowName = allWorkflows.find(w => w.id === sqlWorkflowId)?.name || sqlWorkflowId;
                field.value = sqlWorkflowName;
                field.dataset.value = sqlWorkflowId;
                field.setAttribute('readonly', 'readonly');
                field.style.cursor = 'not-allowed';
                field.style.opacity = '0.6';
                if (dropdown) dropdown.classList.remove('active');
            }
            
            function setWorkflowEditable(field, dropdown) {
                field.value = '';
                field.dataset.value = '';
                field.removeAttribute('readonly');
                field.style.cursor = 'pointer';
                field.style.opacity = '1';
                if (dropdown && allWorkflows.length > 0) {
                    dropdown.innerHTML = allWorkflows.map(w => 
                        `<div class="searchable-select-option" onclick="selectWorkflow('${field.id}', '${w.id}', '${w.name}')">${w.name}</div>`
                    ).join('');
                    // Don't auto-open - let user click to open
                    dropdown.classList.remove('active');

        // ============================================
        // WORKFLOW EXECUTION
        // ============================================
        async function executeWorkflowForTables() {
            console.log('executeWorkflowForTables: Starting with DISCOVERY_WORKFLOW_ID:', DISCOVERY_WORKFLOW_ID);
            if (isLoadingTableInfo) {
                console.log('executeWorkflowForTables: Already loading, returning');
                return;
            }
            
            try {
                isLoadingTableInfo = true;
                
                // Save the current table name value if it exists (in case a config was loaded)
                const currentValue = tableName.value;
                const currentDataValue = tableName.dataset.value;
                tableName.dataset.savedValue = currentValue;
                tableName.dataset.savedDataValue = currentDataValue;
                console.log('executeWorkflowForTables: Saving table name before workflow:', currentValue);
                
                // Show loading message in table name field
                if (tableName) {
                    tableName.value = 'Loading...';
                    tableName.disabled = true;
                    tableName.classList.add('loading-state');
                }
                console.log('executeWorkflowForTables: Calling ProxyLib.executeQuery');
                
                const sqlQuery = `
                    SELECT TABLE_NAME, COLUMN_NAME, DATA_TYPE, COLUMN_KEY, EXTRA, COLUMN_DEFAULT, IS_NULLABLE
                    FROM INFORMATION_SCHEMA.COLUMNS
                    WHERE TABLE_SCHEMA = 'rewst'
                    ORDER BY TABLE_NAME, ORDINAL_POSITION
                `;
                
                // Authenticate and execute query via proxy
                const sessionToken = await ProxyLib.authenticateWithKeyName(
                    rewstUser.username,
                    window.location.origin,  // ProxyLib will auto-detect parent origin if needed
                    'proxy_api_mysql'  // Org variable name for proxy API key
                );
                
                const result = await ProxyLib.executeQuery(
                    sessionToken,
                    rewstUser.username,
                    sqlQuery
                );
                console.log('executeWorkflowForTables: ProxyLib result:', result);

                if (result && result.success) {
                    console.log('executeWorkflowForTables: Query success, parsing result');
                    
                    const sqlResult = result.result || [];
                    console.log('executeWorkflowForTables: Extracted result:', sqlResult);
                    
                    if (Array.isArray(sqlResult)) {
                        tableColumnInfo = {};
                        const tableNames = new Set();
                        
                        sqlResult.forEach(row => {
                            const tname = row.TABLE_NAME || row.table_name;
                            const cname = row.COLUMN_NAME || row.column_name;
                            let dtype = row.DATA_TYPE || row.data_type;
                            const ckey = row.COLUMN_KEY || row.column_key || '';
                            const extra = row.EXTRA || row.extra || '';
                            const columnDefault = row.COLUMN_DEFAULT || row.column_default;
                            const isNullable = row.IS_NULLABLE || row.is_nullable || 'YES';
                            
                            // Check if tinyint with default 0 or 1 should be treated as boolean
                            if (dtype && dtype.toLowerCase() === 'tinyint' && (columnDefault === '0' || columnDefault === '1' || columnDefault === 0 || columnDefault === 1)) {
                                dtype = 'boolean';
                                console.log(`executeWorkflowForTables: Converting ${tname}.${cname} from tinyint to boolean (default: ${columnDefault})`);
                            }
                            
                            if (tname && cname) {
                                tableNames.add(tname);
                                
                                if (!tableColumnInfo[tname]) {
                                    tableColumnInfo[tname] = [];
                                }
                                
                                tableColumnInfo[tname].push({
                                    name: cname,
                                    type: dtype,
                                    isPrimaryKey: ckey === 'PRI',
                                    isGenerated: extra.includes('auto_increment') || extra.includes('GENERATED'),
                                    isNullable: isNullable === 'YES'
                                });
                            }
                        });
                        
                        console.log('executeWorkflowForTables: Found tables:', Array.from(tableNames));
                        populateTableDropdown(Array.from(tableNames));
                    }
                }
            } catch (error) {
                console.error('Error discovering tables:', error);
            } finally {
                isLoadingTableInfo = false;
                // Restore the previous table name AFTER the dropdown is populated
                if (tableName) {
                    // Use setTimeout to allow the dropdown population to complete first
                    setTimeout(() => {
                        const savedValue = tableName.dataset.savedValue;
                        const savedDataValue = tableName.dataset.savedDataValue;
                        
                        console.log('executeWorkflowForTables finally: savedValue=', savedValue, 'current value=', tableName.value);
                        
                        if (savedValue && savedValue !== 'Loading...') {
                            tableName.value = savedValue;
                            tableName.dataset.value = savedDataValue || savedValue;
                            console.log('executeWorkflowForTables: Restored table name:', savedValue);
                        } else if (!tableName.value || tableName.value === 'Loading...') {
                            tableName.value = '';
                            tableName.dataset.value = '';
                        }
                        // else: keep whatever value is currently in the field
                        
                        // Clear the saved values
                        delete tableName.dataset.savedValue;
                        delete tableName.dataset.savedDataValue;
                        
                        tableName.disabled = false;
                        tableName.classList.remove('loading-state');
                        console.log('executeWorkflowForTables finally: final value=', tableName.value);
                    }, 150);  // Increased delay slightly
                }
            }
        }

        async function loadWorkflows() {
            try {
                console.log('loadWorkflows: Starting GraphQL query');
                const query = `
                    query {
                        workflows {
                            id
                            name
                        }
                    }
                `;
                
                const response = await fetch('/graphql', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                console.log('loadWorkflows: Response status', response.status);
                
                const data = await response.json();
                console.log('loadWorkflows: Response data', data);
                
                if (!response.ok) {
                    console.error('loadWorkflows: HTTP error', response.status);
                    console.error('loadWorkflows: Error details', data);
                    return;
                }

                if (data.errors) {
                    console.error('loadWorkflows: GraphQL errors', data.errors);
                    data.errors.forEach((err, idx) => {
                        console.error(`  Error ${idx + 1}:`, err.message);
                    });
                    return;
                }
                
                const workflows = data.data?.workflows || [];
                console.log('loadWorkflows: Parsed workflows', workflows.length, 'items');
                allWorkflows = workflows;  // Store for later lookup
                populateWorkflowDropdowns(workflows);
            } catch (error) {
                console.error('Error loading workflows:', error);
            }
        }

        function populateTableDropdown(tableNames) {
            console.log('populateTableDropdown: Populating with tables:', tableNames);
            const wrapper = tableName.parentElement;
            const dropdown = wrapper.querySelector('.searchable-select-dropdown');
            if (!dropdown) {
                console.error('populateTableDropdown: Could not find dropdown');
                return;
            }
            
            dropdown.innerHTML = tableNames.map(name => 
                `<div class="searchable-select-option" onclick="selectTable('${name}')">${name}</div>`
            ).join('');
            
            console.log('populateTableDropdown: Dropdown populated');
            
            // Add input listener for filtering
            tableName.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                const filtered = tableNames.filter(name => name.toLowerCase().includes(query));
                dropdown.innerHTML = filtered.map(name => 
                    `<div class="searchable-select-option" onclick="selectTable('${name}')">${name}</div>`
                ).join('');
                dropdown.classList.toggle('active', filtered.length > 0);
            });
            
            // Show dropdown on focus
            tableName.addEventListener('focus', (e) => {
                dropdown.classList.add('active');
            });
        }

            tableName.value = name;
            tableName.dataset.value = name;
            const dropdown = tableName.parentElement.querySelector('.searchable-select-dropdown');
            if (dropdown) dropdown.classList.remove('active');
            if (tableColumnInfo[name]) {
                autoPopulateColumnsForTable(name);
            }

        function autoPopulateColumnsForTable(tableName) {
            console.log('Auto-populating columns for table:', tableName);
            
            const tableInfo = tableColumnInfo[tableName];
            if (!tableInfo) return;
            
            columns = [];
            let hasPrimaryKey = false;
            
            tableInfo.forEach(col => {
                const isPrimaryKey = col.isPrimaryKey;
                if (isPrimaryKey) hasPrimaryKey = true;
                
                columns.push({
                    col_name: col.name,
                    data_type: col.type,
                    p_key: isPrimaryKey,
                    hide_table: false,
                    hide_edit: isPrimaryKey,
                    gen: col.isGenerated,
                    editable: !col.isGenerated,
                    from_sql: true,
                    not_null: !col.isNullable  // Convert isNullable to not_null (inverse)
                });
            });
            
            sqlQuery.value = `select * from rewst.${tableName}`;
            renderColumns();
            updateOutput();
            
            const addColSection = document.querySelector('.panel-section:has(#newColName)');
            if (addColSection) {
                addColSection.style.display = 'none';
            }
        }

                [columns[idx], columns[idx - 1]] = [columns[idx - 1], columns[idx]];
                renderColumns();
                updateOutput();
            } else if (direction === 'down' && idx < columns.length - 1) {
                [columns[idx], columns[idx + 1]] = [columns[idx + 1], columns[idx]];
                renderColumns();
                updateOutput();
            }
        }

        function updateColumnByIndex(idx, field, value) {

                columns[idx][field] = value;

                // For checkbox/boolean updates, just update output to avoid page jump
                if (field === 'col_name' || field === 'data_type' || field === 'col_label') {
                    renderColumns();
                }
                updateOutput();
            }
        }

            return wf ? wf.id : '';

                inputVariables[index][field] = '';

                inputVariables[index][field] = value;
            } else {

            if (field === 'workflow' && value) {
                inputVariables[index].workflow_id = getWorkflowIdFromName(value);

        function buildConfigObject() {
            // Build config object for comparison and output
            const config = {
                user: userName,
                updated: getCurrentTimeStamp(),
                name: datatableName.value || 'unnamed_table',
                desc: datatableDesc.value,
                edit_type: document.querySelector('input[name="editType"]:checked').value,
                input_vars: {
                    sql_query: sqlQuery.value,
                    ...Object.fromEntries(inputVariables
                        .filter(iv => iv.name && iv.name.trim())  // Only include variables with names
                        .map(iv => [iv.name, iv.value]))
                },
                input_var_config: [
                    ...(sqlData.checked ? [{ name: 'sql_query', datatable_var: true }] : []),
                    ...inputVariables.map(iv => {
                        const varConfig = { name: iv.name };
                        if (iv.fromUrl) varConfig.from_url = true;
                        if (iv.required) varConfig.required = true;
                        if (iv.datatable_var) varConfig.datatable_var = true;
                        if (iv.dspl_name) varConfig.dspl_name = iv.dspl_name;
                        if (iv.fromDataset) {
                            varConfig.from_dataset = true;
                            varConfig.dataset_source = iv.dataset_source || 'workflow';
                            if (iv.dataset_source === 'workflow') {
                                if (iv.input_var) varConfig.input_var = iv.input_var;
                                if (iv.workflow_id) varConfig.workflow = iv.workflow_id;
                                if (iv.output_var) varConfig.output_var = iv.output_var;
                            } else if (iv.dataset_source === 'mysql') {
                                if (iv.proxy_query) varConfig.proxy_query = iv.proxy_query;
                            } else if (iv.dataset_source === 'graphql') {
                                if (iv.graphql_operation) varConfig.graphql_operation = iv.graphql_operation;
                            }
                            if (iv.output_id) varConfig.output_id = iv.output_id;
                            if (iv.output_label) varConfig.output_label = iv.output_label;
                        }
                        return varConfig;
                    })
                ],
                allow_create: allowCreate.checked,
                allow_update: allowUpdate.checked,
                allow_delete: allowDelete.checked,
                permissions: (() => {
                    const permissionsSelect = document.getElementById('permissionsSelect');
                    if (permissionsSelect && permissionsSelect.dataset.selectedValues) {
                        try {
                            return JSON.parse(permissionsSelect.dataset.selectedValues);
                        } catch (e) {
                            return [];
                        }
                    }
                    return [];
                })(),
                use_sql: sqlData.checked,
                col_settings: columns.map(({from_sql, data_type, ...col}) => {
                    const colConfig = { col_name: col.col_name };
                    if (col.col_label) colConfig.col_label = col.col_label;
                    if (col.required) colConfig.required = true;
                    if (col.p_key) colConfig.p_key = true;
                    if (col.hide_table) colConfig.hide_table = true;
                    if (col.hide_edit) colConfig.hide_edit = true;
                    if (col.gen) colConfig.gen = true;
                    colConfig.editable = col.editable;
                    colConfig.type = data_type;
                    colConfig.not_null = col.not_null || false;  // Add not_null, default to false
                    return colConfig;
                }),
                filters: filters.filter(f => f.col_name && f.col_name.trim()),  // Only include filters with a col_name
                locked: false
            };
            
            // Only include workflow fields if NOT using MySQL data
            if (!sqlData.checked) {
                config.data_workflow = dataWorkflow.dataset.value || dataWorkflow.value;
                config.update_workflow = updateWorkflow.dataset.value || updateWorkflow.value || null;
                config.output_var = outputVar.value;
                config.table_name = tableName.value;
            } else {
                // For MySQL configs, include table_name instead of workflows
                config.table_name = tableName.value;
            }
            
            return config;
        }

        function updateOutput() {
            markAsChanged();
            // Check for validation errors and disable Save button if needed
            const saveBtn = document.getElementById('saveBtn');
            
            // Build validation errors list
            const errors = [];
            
            // Check if configuration is locked
            if (isLocked) {
                errors.push('Configuration is locked');
            }
            
            // Essential fields
            if (!datatableName.value) {
                errors.push('Datatable Name is required');
            }
            if (!dataWorkflow.dataset.value) {
                errors.push('Data Workflow is required');
            }
            if (!updateWorkflow.dataset.value && !updateWorkflow.value) {
                errors.push('Update Workflow is required');
            }
            if (!outputVar.value || outputVar.value.trim() === '') {
                errors.push('Output Variable Name is required');
            }
            
            // MySQL Data validations
            if (sqlData.checked) {
                if (!tableName.value && !tableName.dataset.value) {
                    errors.push('SQL Table Name is required when using MySQL Data');
                }
                if (!sqlQuery.value || sqlQuery.value.trim() === '') {
                    errors.push('SQL Query For Initial Data Retrieval is required when using MySQL Data');
                }
            }
            
            // Column name validation
            const columnsWithoutName = columns.filter(col => !col.col_name || col.col_name.trim() === '');
            if (columnsWithoutName.length > 0) {
                errors.push(`Column${columnsWithoutName.length > 1 ? 's' : ''} must have a name (${columnsWithoutName.length} column${columnsWithoutName.length > 1 ? 's' : ''} without name)`);
            }
            
            // Input Variables validation
            const inputVarsWithoutName = inputVariables.filter(iv => !iv.name || iv.name.trim() === '');
            if (inputVarsWithoutName.length > 0) {
                errors.push(`Input Variable${inputVarsWithoutName.length > 1 ? 's' : ''} must have a name (${inputVarsWithoutName.length} ${inputVarsWithoutName.length > 1 ? 'variables' : 'variable'} without name)`);
            }
            
            // Check for duplicate input variable names
            const inputVarNames = inputVariables
                .map(iv => iv.name)
                .filter(name => name && name.trim());
            const uniqueNames = new Set(inputVarNames.map(n => n.toLowerCase()));
            if (uniqueNames.size < inputVarNames.length) {
                // Find which names are duplicated
                const nameCounts = {};
                inputVarNames.forEach(name => {
                    const lowerName = name.toLowerCase();
                    nameCounts[lowerName] = (nameCounts[lowerName] || 0) + 1;
                });
                const duplicateNames = Object.entries(nameCounts)
                    .filter(([name, count]) => count > 1)
                    .map(([name]) => name);
                errors.push(`Duplicate input variable name${duplicateNames.length > 1 ? 's' : ''}: ${duplicateNames.join(', ')}`);
            }
            
            // Validate fromDataset based on dataset_source
            // Workflow source: requires workflow and output_var
            const workflowVarsWithoutWorkflow = inputVariables.filter(iv => iv.fromDataset && iv.dataset_source === 'workflow' && (!iv.workflow || iv.workflow.trim() === ''));
            if (workflowVarsWithoutWorkflow.length > 0) {
                errors.push(`Input Variable${workflowVarsWithoutWorkflow.length > 1 ? 's' : ''} with Workflow dataset source must have a Dataset Selector Workflow selected`);
            }
            
            const workflowVarsWithoutOutputVar = inputVariables.filter(iv => iv.fromDataset && iv.dataset_source === 'workflow' && (!iv.output_var || iv.output_var.trim() === ''));
            if (workflowVarsWithoutOutputVar.length > 0) {
                errors.push(`Input Variable${workflowVarsWithoutOutputVar.length > 1 ? 's' : ''} with Workflow dataset source must have a Workflow Output Variable specified`);
            }
            
            // MySQL source: requires proxy_query
            const mysqlVarsWithoutQuery = inputVariables.filter(iv => iv.fromDataset && iv.dataset_source === 'mysql' && (!iv.proxy_query || iv.proxy_query.trim() === ''));
            if (mysqlVarsWithoutQuery.length > 0) {
                errors.push(`Input Variable${mysqlVarsWithoutQuery.length > 1 ? 's' : ''} with MySQL Query dataset source must have a SQL Query specified`);
            }
            
            // GraphQL source: requires graphql_operation
            const graphqlVarsWithoutOp = inputVariables.filter(iv => iv.fromDataset && iv.dataset_source === 'graphql' && (!iv.graphql_operation || iv.graphql_operation.trim() === ''));
            if (graphqlVarsWithoutOp.length > 0) {
                errors.push(`Input Variable${graphqlVarsWithoutOp.length > 1 ? 's' : ''} with GraphQL Query dataset source must have a GraphQL Operation selected`);
            }
            
            // All dataset sources require: output_id and output_label
            const datasetVarsWithoutOutputId = inputVariables.filter(iv => iv.fromDataset && (!iv.output_id || iv.output_id.trim() === ''));
            if (datasetVarsWithoutOutputId.length > 0) {
                errors.push(`Input Variable${datasetVarsWithoutOutputId.length > 1 ? 's' : ''} with "From Dataset Selector" checked must have an Output ID Variable specified`);
            }
            
            // Validate fromDataset requires output_label
            const datasetVarsWithoutOutputLabel = inputVariables.filter(iv => iv.fromDataset && (!iv.output_label || iv.output_label.trim() === ''));
            if (datasetVarsWithoutOutputLabel.length > 0) {
                errors.push(`Input Variable${datasetVarsWithoutOutputLabel.length > 1 ? 's' : ''} with "From Dataset Selector" checked must have an Output Label Variable specified`);
            }
            
            // Disable Save button if there are errors
            const hasErrors = errors.length > 0;
            saveBtn.disabled = hasErrors;
            
            // Display validation messages
            if (validationOutput) {
                let validationHTML = '';
                
                if (errors.length > 0) {
                    validationHTML += '<div style="color: #ff6b6b; margin-bottom: 1rem;"><strong>Blocking Validations:</strong><ul style="text-align: left; margin: 0.5rem 0; padding-left: 1.5rem;">' + 
                        errors.map(err => `<li>${err}</li>`).join('') + 
                        '</ul></div>';
                }
                
                // Non-blocking warnings
                if (columns.length === 0) {
                    validationHTML += '<div style="color: #ffa500;"><strong>⚠  Warning:</strong> No columns defined</div>';
                }
                
                if (validationHTML === '') {
                    validationHTML = '<div style="color: #4caf50;"><strong>✓ No validation issues</strong></div>';
                }
                
                validationOutput.innerHTML = validationHTML;
            }
            
            const config = buildConfigObject();

            if (sqlData.checked) {
                const selectedTable = tableName.dataset.value || tableName.value;
                if (selectedTable) {
                    config.table_name = selectedTable;
                }
            }

            jsonOutput.textContent = JSON.stringify(config, null, 2);
            
            const orgVarName = datatableName.value || 'config';
            
            updateValidation(config);
        }

        function updateValidation(config) {
            const issues = [];
            
            if (!config.name || config.name === 'unnamed_table') {
                issues.push({ type: 'invalid', text: 'Datatable name is required' });
            }
            
            // Only require data_workflow and output_var if NOT using MySQL
            if (!config.use_sql) {
                if (!config.data_workflow) {
                    issues.push({ type: 'invalid', text: 'Data workflow is required' });
                }
                if (!config.output_var) {
                    issues.push({ type: 'invalid', text: 'Output variable name is required' });
                }
            } else {
                // MySQL configs require table_name
                if (!config.table_name) {
                    issues.push({ type: 'invalid', text: 'Table name is required for MySQL data' });
                }
            }
            
            const colSettings = config.col_settings || config.column_settings || [];
            if (colSettings.length === 0) {
                issues.push({ type: 'warning', text: 'No columns configured' });
            }

            // Validation output is now handled earlier in the function
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            const tabId = tabName + 'Tab';
            const tabEl = document.getElementById(tabId);
            const btnEl = event.target;
            
            if (tabEl) tabEl.classList.add('active');
            if (btnEl) btnEl.classList.add('active');
        }

        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            const text = element.textContent;
            
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        }

        // Track unsaved changes
        let hasUnsavedChanges = false;
        let configurationLoaded = false;
        let pageInitialized = false;
        let originalLoadedConfig = null;
        let isResetting = false;
        let isLocked = false;

        function markAsChanged() {
            // Skip marking as changed during reset operations
            if (isResetting) {
                return;
            }
            
            // Only mark as changed if the page has finished initializing
            if (pageInitialized) {
                // If a config was loaded, compare current state with original
                if (configurationLoaded && originalLoadedConfig) {
                    const currentConfig = buildConfigObject();
                    // Remove user and updated fields for comparison
                    const currentForComparison = { ...currentConfig };
                    const originalForComparison = { ...originalLoadedConfig };
                    delete currentForComparison.user;
                    delete currentForComparison.updated;
                    delete originalForComparison.user;
                    delete originalForComparison.updated;
                    
                    // Compare JSON strings to detect changes
                    const hasActualChanges = JSON.stringify(currentForComparison) !== JSON.stringify(originalForComparison);
                    hasUnsavedChanges = hasActualChanges;
                } else if (!configurationLoaded) {
                    // For new configs, mark as changed if any substantial field has a value
                    if (!hasUnsavedChanges) {
                        hasUnsavedChanges = true;
                    }
                }
            }
        }

        function resetChangeTracking() {
            hasUnsavedChanges = false;
            configurationLoaded = false;
            originalLoadedConfig = null;
        }

        function markConfigurationLoaded() {
            configurationLoaded = true;
            hasUnsavedChanges = false;
            // Store the original config for comparison
            originalLoadedConfig = buildConfigObject();
        }

        // Set up beforeunload event listener
        window.addEventListener('beforeunload', (e) => {
            // Check if we have unsaved changes (new config with changes or loaded config with changes)
            if ((configurationLoaded && hasUnsavedChanges) || (!configurationLoaded && hasUnsavedChanges)) {
                e.preventDefault();
                e.returnValue = '';
                return '';
            }
        });

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
