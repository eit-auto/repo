        // ============================================
        // UTILITY FUNCTIONS FOR [[ ]] VARIABLE REPLACEMENT
        // (Accessible to loadFieldOptions and other outer-scope functions)
        // ============================================

        /**
         * Recursively scan object/string for [[ ]] variable references
         * Returns Set of varNames found
         */
        const scanPropertyForReferences = (value) => {
            const varNames = new Set();
            
            if (typeof value === 'string') {
                const regex = /\[\[\s*(\w+)(?:\.([^\]]+))?\s*\]\]/g;
                let match;
                while ((match = regex.exec(value)) !== null) {
                    varNames.add(match[1]);
                }
            } else if (typeof value === 'object' && value !== null) {
                Object.values(value).forEach(val => {
                    scanPropertyForReferences(val).forEach(v => varNames.add(v));
                });
            }
            
            return varNames;
        };

        /**
         * Universal function to replace [[ ]] references in ANY value
         * Handles strings, objects (recursive), and arrays
         */
        const replaceReferencesInValue = (value, replaceFunc) => {
            if (typeof value === 'string') {
                return replaceFunc(value);
            } else if (typeof value === 'object' && value !== null) {
                if (Array.isArray(value)) {
                    return value.map(item => replaceReferencesInValue(item, replaceFunc));
                } else {
                    const replaced = {};
                    Object.keys(value).forEach(key => {
                        replaced[key] = replaceReferencesInValue(value[key], replaceFunc);
                    });
                    return replaced;
                }
            }
            return value;
        };

        /**
         * Check if a field has [[ ]] refs in any execution parameters
         */
        const hasExecutionParameterReferences = (config) => {
            const executionProps = ['workflow_input', 'graphql_op_variables', 'query', 'command', 'node_query'];
            for (const prop of executionProps) {
                if (!config[prop]) continue;
                const varNames = scanPropertyForReferences(config[prop]);
                if (varNames.size > 0) {
                    return true;
                }
            }
            return false;
        };

        /**
         * Get a copy of the field config with all [[ ]] references replaced
         * Uses outer-scope replaceReferencesInValue for value resolution
         */
        const getResolvedFieldConfig = (config) => {
            const resolved = { ...config };
            
            // Replace in execution parameters using outer-scope function
            const executionProps = ['workflow_input', 'graphql_op_variables', 'query', 'command', 'node_query'];
            executionProps.forEach(prop => {
                if (resolved[prop]) {
                    resolved[prop] = replaceReferencesInValue(config[prop], (str) => {
                        // Replace [[ varName.property ]] with values from window.pageVariables
                        return str.replace(/\[\[\s*(\w+)(?:\.([^\]]+))?\s*\]\]/g, (match, varName, propertyPath) => {
                            if (!propertyPath) {
                                // [[ varName ]] - whole object
                                const val = window.pageVariables[varName];
                                // For strings, return raw value; for objects/arrays, stringify; otherwise stringify
                                if (val === undefined) return match;
                                if (typeof val === 'string') return val;
                                return JSON.stringify(val);
                            } else {
                                // [[ varName.property ]]
                                const pageVar = window.pageVariables[varName];
                                if (pageVar === undefined) return match;
                                
                                const trimmedPath = propertyPath.trim();
                                const parts = trimmedPath.split('.');
                                let current = pageVar;
                                for (const part of parts) {
                                    if (current && typeof current === 'object') {
                                        current = current[part];
                                    } else {
                                        return match;
                                    }
                                }
                                return current !== undefined ? String(current) : match;
                            }
                        });
                    });
                }
            });
            
            // Replace in display parameters
            ['default_value', 'default_select', 'description', 'content', 'field_displayname'].forEach(prop => {
                if (resolved[prop] && typeof resolved[prop] === 'string') {
                    resolved[prop] = resolved[prop].replace(/\[\[\s*(\w+)(?:\.([^\]]+))?\s*\]\]/g, (match, varName, propertyPath) => {
                        if (!propertyPath) {
                            const val = window.pageVariables[varName];
                            // For display params, strings can be raw, objects stringify
                            if (val === undefined) return match;
                            if (typeof val === 'string') return val;
                            return JSON.stringify(val);
                        } else {
                            const pageVar = window.pageVariables[varName];
                            if (pageVar === undefined) return match;
                            const trimmedPath = propertyPath.trim();
                            const parts = trimmedPath.split('.');
                            let current = pageVar;
                            for (const part of parts) {
                                if (current && typeof current === 'object') {
                                    current = current[part];
                                } else {
                                    return match;
                                }
                            }
                            return current !== undefined ? String(current) : match;
                        }
                    });
                }
            });
            
            return resolved;
        };

        function loadFieldOptions(config, allFieldConfigs = [], formConfig = {}, preselectedValues = []) {
            const formGroup = document.querySelector(`[data-field-name="${config.field_name}"]`);
            console.log(`>>> formGroup found?`, !!formGroup);
            
            // Get resolved config with all [[ ]] variable references replaced
            // This is used for execution-time replacement
            const resolvedConfig = getResolvedFieldConfig(config);
            
            // Check for unresolved [[ ]] variable references in execution parameters
            // If field has refs in query/command/workflow_input and page variables aren't ready, skip execution
            if (hasExecutionParameterReferences(config)) {
                console.log(`[PAGE_VAR_EXEC] Field ${config.field_name} has variable refs in execution params, checking if ready...`);
                
                // Scan to see which variables are referenced
                const executionProps = ['workflow_input', 'graphql_op_variables', 'query', 'command', 'node_query'];
                let hasUnresolvedRef = false;
                let unresolvedVarName = null;
                
                for (const prop of executionProps) {
                    if (!config[prop]) continue;
                    const varNames = scanPropertyForReferences(config[prop]);
                    for (const varName of varNames) {
                        if (window.pageVariables[varName] === undefined) {
                            console.log(`[PAGE_VAR_EXEC] Field ${config.field_name} waiting for ${varName}`);
                            hasUnresolvedRef = true;
                            unresolvedVarName = varName;
                            break;
                        }
                    }
                    if (hasUnresolvedRef) break;
                }
                
                if (hasUnresolvedRef) {
                    console.log(`[PAGE_VAR_EXEC] Field ${config.field_name} has unresolved refs, showing waiting state`);
                    if (formGroup) {
                        RewstLib.utils.showWaitingMessage(formGroup, config, allFieldConfigs, unresolvedVarName);
                    }
                    return Promise.resolve();
                }
            }
            
            // Handle data_retrieval fields
            if (config.type === 'data_retrieval') {
                return executeDataRetrievalField(config, allFieldConfigs, formConfig);
            }
            
            // Handle dropdown_prefetch fields - populate from cached data_retrieval results
            if (config.type === 'dropdown_prefetch') {
                const formGroup = document.querySelector(`[data-field-name="${config.field_name}"]`);
                const sourceFieldName = config.source_element_name || config.source_element_uid;
                const resultPath = config.result_path;
                const labelField = config.label_field || 'label';
                const valueField = config.value_field || 'value';
                
                // Check if dependencies are met
                if (config.dependant_fields) {
                    const allDepsMet = RewstLib.utils.areDependenciesMet(config, allFieldConfigs);
                    if (!allDepsMet) {
                        if (formGroup) {
                            RewstLib.utils.hideLoadingMessage(formGroup, config);
                            RewstLib.utils.showWaitingMessage(formGroup, config, allFieldConfigs);
                        }
                        return;
                    } else {
                        if (formGroup) {
                            RewstLib.utils.hideWaitingMessage(formGroup, config);
                        }
                    }
                }
                
                // Get cached data from data_retrieval field
                let options = [];
                if (proxyCache.dataRetrievalResults[sourceFieldName]) {
                    const sourceData = proxyCache.dataRetrievalResults[sourceFieldName];
                    if (sourceData && sourceData[resultPath]) {
                        const results = sourceData[resultPath];
                        if (Array.isArray(results)) {
                            options = results.map(item => ({
                                label: item[labelField] || item.name || String(item.id),
                                value: item[valueField] || item.id || ''
                            }));
                        }
                    }
                }
                
                // Store metadata about this dropdown's data source (points to data_retrieval)
                dropdownSourceMetadata[config.field_name] = {
                    cacheType: 'data_retrieval',
                    sourceFieldName: sourceFieldName,
                    resultPath: resultPath,
                    valueName: valueField,
                    labelName: labelField,
                    data: options
                };
                
                // Populate the dropdown
                if (config.multi_select) {
                    RewstLib.utils.repopulateMultiSelectField(config.field_name, options, preselectedValues);
                } else {
                    // Single select
                    const select = formGroup.querySelector('select:not(.multi-select-hidden-select)');
                    if (select) {
                        const placeholder = select.querySelector('option[value=""]');
                        select.innerHTML = '';
                        if (placeholder) {
                            select.appendChild(placeholder);
                        } else {
                            const opt = document.createElement('option');
                            opt.value = '';
                            opt.textContent = RewstLib.utils.getGrammaticalPhrase(config.field_displayname);
                            select.appendChild(opt);
                        }
                        
                        options.forEach(opt => {
                            const option = document.createElement('option');
                            option.value = String(opt.value);
                            option.textContent = String(opt.label);
                            select.appendChild(option);
                        });
                    }
                }
                
                if (formGroup) {
                    RewstLib.utils.hideLoadingMessage(formGroup, config);
                    RewstLib.utils.hideWaitingMessage(formGroup, config);
                }
                
                return Promise.resolve();
            }
            
            // Skip loading options if the field is hidden
            // Use offsetParent check - if null, element is hidden via CSS or display:none
            if (formGroup && (formGroup.offsetParent === null || window.getComputedStyle(formGroup).display === 'none')) {
                console.log(`>>> Field ${config.field_name} is hidden, skipping loadFieldOptions`);
                return Promise.resolve();
            }
            if (formGroup && config.type !== 'form_extend') {
                RewstLib.utils.hideWaitingMessage(formGroup, config);
                
                // Only show loading message for data-fetching field types
                if (config.type === 'dropdown' || config.type === 'dropdown_graphql' || config.type === 'data_retrieval') {
                    RewstLib.utils.showLoadingMessage(formGroup, config);
                }
            }
            
            if (config.dependant_fields) {
                const allDepsMet = RewstLib.utils.areDependenciesMet(config, allFieldConfigs);
                
                if (!allDepsMet) {
                    console.log(`Dependencies not met for ${config.field_name}, skipping workflow`);
                    if (formGroup) {
                        RewstLib.utils.hideLoadingMessage(formGroup, config);
                        RewstLib.utils.showWaitingMessage(formGroup, config, allFieldConfigs);
                    }
                    return Promise.resolve();
                }
            }
            
            let workflowInput = { ...config.workflow_input };
            
            // Replace field references in workflow_input values
            // Supports both direct field names and [[ field_name ]] syntax
            if (config.workflow_input) {
                Object.keys(config.workflow_input).forEach(key => {
                    let value = config.workflow_input[key];
                    
                    // If value is a string, check for [[ field_name ]] tags
                    if (typeof value === 'string') {
                        // Replace [[ field_name ]] tags with actual field values
                        value = value.replace(/\[\[\s*(\w+)\s*\]\]/g, (match, fieldName) => {
                            const input = document.querySelector(`input[name="${fieldName}"], select[name="${fieldName}"], textarea[name="${fieldName}"]`);
                            if (input) {
                                let fieldValue = input.value;
                                if (input.type === 'checkbox') fieldValue = input.checked;
                                else if (input.type === 'radio') {
                                    const checkedRadio = document.querySelector(`input[name="${fieldName}"]:checked`);
                                    fieldValue = checkedRadio ? checkedRadio.value : null;
                                }
                                return fieldValue !== null && fieldValue !== undefined ? fieldValue : match;
                            }
                            return match;
                        });
                        workflowInput[key] = value;
                    } else {
                        // For non-string values, check if it matches a field name directly (backwards compatibility)
                        const fieldRef = allFieldConfigs.find(f => f.field_name === value);
                        if (fieldRef) {
                            const input = document.querySelector(`input[name="${value}"], select[name="${value}"], textarea[name="${value}"]`);
                            if (input) {
                                let fieldValue = input.value;
                                if (input.type === 'checkbox') fieldValue = input.checked;
                                else if (input.type === 'radio') {
                                    const checkedRadio = document.querySelector(`input[name="${value}"]:checked`);
                                    fieldValue = checkedRadio ? checkedRadio.value : null;
                                }
                                workflowInput[key] = fieldValue;
                            }
                        }
                    }
                });
            }
            
            // Also add all dependent field values to the payload (both blocking and non-blocking)
            if (config.dependant_fields) {
                const depValues = RewstLib.utils.getDependencyValues(config, allFieldConfigs);
                Object.assign(workflowInput, depValues);
                
                // Ensure dependencies with incl_hidden:true are in payload, even if blank
                Object.keys(config.dependant_fields).forEach(depFieldName => {
                    const depConfig = config.dependant_fields[depFieldName];
                    if (depConfig.incl_hidden && !(depFieldName in workflowInput)) {
                        // Field should be included but isn't in the payload yet
                        // Try to get its value, use blank if not found
                        const input = document.querySelector(`input[name="${depFieldName}"], select[name="${depFieldName}"], textarea[name="${depFieldName}"]`);
                        let value = '';
                        if (input) {
                            value = input.type === 'checkbox' ? input.checked : (input.value || '');
                        }
                        workflowInput[depFieldName] = value;
                        console.log(`[WORKFLOW] Including incl_hidden dependency ${depFieldName} = "${value}"`);
                    }
                });
            }
            
            console.log(`Executing workflow ${config.workflow_id} for field ${config.field_name}`, workflowInput);
            
            // ============================================
            // DROPDOWN GRAPHQL HELPER FUNCTIONS
            // ============================================
            
            /**
             * Load GraphQL dropdown options using metadata
             */
            // Use library's loadGraphQLDropdownOptions instead of local function
            
            // Check if this field config has skip_cache flag
            // Also skip cache if this field has blocking dependencies (means parent changed)
            const skipCache = config.skip_cache === true || (config.dependant_fields && Object.values(config.dependant_fields).some(dep => dep.blocking === true));
            const options = skipCache ? { skip_cache: true } : {};
            
            // Handle dropdown_graphql separately with caching
            if (config.type === 'dropdown_graphql') {
                console.log(`Loading GraphQL options for ${config.field_name} using operation: ${config.graphql_op}`);
                
                // Check if dependencies are met (for fields that have blocking dependencies)
                if (config.dependant_fields) {
                    const depsMet = RewstLib.utils.areDependenciesMet(config, allFieldConfigs);
                    console.log(`[GRAPHQL] Dependencies for ${config.field_name}: met=${depsMet}`, config.dependant_fields);
                    
                    if (!depsMet) {
                        console.log(`[GRAPHQL] Dependencies not met for ${config.field_name}, showing waiting message`);
                        if (formGroup) {
                            RewstLib.utils.showWaitingMessage(formGroup, config, allFieldConfigs);
                        }
                        return Promise.resolve();
                    } else {
                        // Dependencies are met, hide the waiting message
                        if (formGroup) {
                            RewstLib.utils.hideWaitingMessage(formGroup, config);
                        }
                    }
                }
                
                // Create cache key based on operation + resolved variables
                const cacheKey = getGraphQLCacheKey(resolvedConfig.graphql_op, resolvedConfig.graphql_op_variables || {});
                
                // Helper function to populate dropdown with data
                const populateDropdownWithData = (data) => {
                    const input = document.querySelector(`select[name="${config.field_name}"]`);
                    if (input) {
                        // Handle both array results (list_orgs) and single object results (get_org_var)
                        const itemsArray = Array.isArray(data) ? data : (data ? [data] : []);
                        
                        // Store metadata about this dropdown's data source
                        dropdownSourceMetadata[config.field_name] = {
                            cacheType: 'graphql',
                            cacheKey: cacheKey,
                            valueName: config.value_name || 'id',
                            labelName: config.label_name || 'name',
                            data: itemsArray
                        };
                        
                        if (itemsArray.length > 0) {
                            input.innerHTML = `<option value="">${RewstLib.utils.getGrammaticalPhrase(config.field_displayname)}</option>`;
                            itemsArray.forEach(item => {
                                const value = item[config.value_name] || item.id;
                                const label = item[config.label_name] || item.name;
                                if (value && label) {
                                    const opt = document.createElement('option');
                                    opt.value = value;
                                    opt.textContent = label;
                                    input.appendChild(opt);
                                }
                            });
                            
                            // If multi-select, initialize the component with loaded options
                            if (config.multi_select) {
                                const msOptions = RewstLib.utils.mapResultsToOptions(itemsArray, config.value_name, config.label_name);
                                RewstLib.utils.initializeDropdownMultiSelect(config.field_name, msOptions);
                            }
                        } else {
                            // No results - show "None Found"
                            input.innerHTML = `<option value="">${RewstLib.utils.getGrammaticalPhrase(config.field_displayname, 'Select', {noResults: true})}</option>`;
                            console.log(`[DROPDOWN] No results for ${config.field_name}, showing "None Found"`);
                        }
                    }
                };
                
                // Check cache if not skipping
                if (!skipCache && graphqlCache.results[cacheKey]) {
                    console.log(`[GRAPHQL CACHE] Using cached results for: ${cacheKey}`);
                    const cachedData = graphqlCache.results[cacheKey];
                    if (formGroup) RewstLib.utils.hideLoadingMessage(formGroup, config);
                    populateDropdownWithData(cachedData);
                    return Promise.resolve();
                }
                
                // Check if already in-flight
                if (!skipCache && graphqlCache.inFlight[cacheKey]) {
                    console.log(`[GRAPHQL CACHE] Waiting for in-flight GraphQL request: ${cacheKey}`);
                    return graphqlCache.inFlight[cacheKey].then(data => {
                        if (formGroup) RewstLib.utils.hideLoadingMessage(formGroup, config);
                        populateDropdownWithData(data);
                    }).catch(error => {
                        console.error(`Error loading GraphQL options for ${config.field_name}:`, error);
                        if (formGroup) RewstLib.utils.hideLoadingMessage(formGroup, config);
                        const input = document.querySelector(`select[name="${config.field_name}"]`);
                        if (input) input.innerHTML = `<option value="">-- Error loading options --</option>`;
                    });
                }
                
                // Execute GraphQL query with resolved config
                const graphqlPromise = RewstLib.utils.loadGraphQLDropdownOptions(resolvedConfig, formConfig);
                
                // Store in-flight promise
                if (!skipCache) {
                    graphqlCache.inFlight[cacheKey] = graphqlPromise;
                }
                
                return graphqlPromise.then(data => {
                    console.log(`GraphQL result for ${config.field_name}:`, data);
                    if (formGroup) RewstLib.utils.hideLoadingMessage(formGroup, config);
                    
                    // Cache the result
                    if (!skipCache) {
                        graphqlCache.results[cacheKey] = data;
                        delete graphqlCache.inFlight[cacheKey];
                    }
                    
                    populateDropdownWithData(data);
                }).catch(error => {
                    console.error(`Error loading GraphQL options for ${config.field_name}:`, error);
                    if (formGroup) RewstLib.utils.hideLoadingMessage(formGroup, config);
                    
                    // Remove from in-flight on error
                    if (!skipCache) {
                        delete graphqlCache.inFlight[cacheKey];
                    }
                    
                    const input = document.querySelector(`select[name="${config.field_name}"]`);
                    if (input) input.innerHTML = `<option value="">-- Error loading options --</option>`;
                });
            }
            
            // Handle dropdown_mysql - execute SQL query and populate dropdown
            if (config.type === 'dropdown_mysql') {
                const cacheKey = getQueryCacheKey(config.query, config.query_variables || {});
                
                // Check if dependencies are met (for fields that have blocking dependencies)
                if (config.dependant_fields) {
                    const depsMet = RewstLib.utils.areDependenciesMet(config, allFieldConfigs);
                    
                    if (!depsMet) {
                        if (formGroup) {
                            RewstLib.utils.showWaitingMessage(formGroup, config, allFieldConfigs);
                        }
                        return Promise.resolve();
                    } else {
                        // Dependencies are met, hide the waiting message
                        if (formGroup) {
                            RewstLib.utils.hideWaitingMessage(formGroup, config);
                        }
                    }
                }
                
                // Helper function to populate dropdown with data
                const populateMysqlDropdown = (data) => {
                    if (!Array.isArray(data)) {
                        console.error(`[MYSQL] Data is not an array`);
                        return;
                    }
                    
                    // Store metadata about this dropdown's data source
                    dropdownSourceMetadata[config.field_name] = {
                        cacheType: 'mysql',
                        cacheKey: cacheKey,
                        valueName: config.value_field || 'id',
                        labelName: config.label_field || 'name',
                        data: data
                    };
                    
                    // For multi-select, use the library function
                    if (config.multi_select) {
                        const options = data.map(item => ({
                            value: item[config.value_field] || item.id,
                            label: item[config.label_field] || item.name
                        }));
                        RewstLib.utils.repopulateMultiSelectField(config.field_name, options, preselectedValues);
                    } else {
                        // Single-select: populate the select element
                        const input = document.querySelector(`select[name="${config.field_name}"]`);
                        if (!input) {
                            console.error(`[MYSQL] SELECT element not found for ${config.field_name}`);
                            return;
                        }
                        
                        if (data.length > 0) {
                            input.innerHTML = `<option value="">${RewstLib.utils.getGrammaticalPhrase(config.field_displayname)}</option>`;
                            let successCount = 0;
                            data.forEach((item) => {
                                const value = item[config.value_field] || item.id;
                                const label = item[config.label_field] || item.name;
                                if (value && label) {
                                    const opt = document.createElement('option');
                                    opt.value = value;
                                    opt.textContent = label;
                                    input.appendChild(opt);
                                    successCount++;
                                }
                            });
                        } else {
                            input.innerHTML = `<option value="">-- No results --</option>`;
                        }
                    }
                };
                
                // Check cache
                if (!skipCache && proxyCache.queryResults[cacheKey]) {
                    if (formGroup) RewstLib.utils.hideLoadingMessage(formGroup, config);
                    populateMysqlDropdown(proxyCache.queryResults[cacheKey]);
                    return Promise.resolve();
                }
                
                // Execute query and return promise
                return (async () => {
                    try {
                        const queryResult = await executeQueryWithRetry('proxy_api_mysql', resolvedConfig.query, 2);
                        
                        if (formGroup) RewstLib.utils.hideLoadingMessage(formGroup, config);
                        
                        // Cache the result
                        if (!skipCache && queryResult.result) {
                            proxyCache.queryResults[cacheKey] = queryResult.result;
                        }
                        
                        populateMysqlDropdown(queryResult.result);
                    } catch (error) {
                        console.error(`[MYSQL] Error executing query for ${config.field_name}:`, error);
                        if (formGroup) RewstLib.utils.hideLoadingMessage(formGroup, config);
                        if (config.multi_select) {
                            // Error occurred in multi-select field - cannot display error in multi-select
                        } else {
                            const input = document.querySelector(`select[name="${config.field_name}"]`);
                            if (input) input.innerHTML = `<option value="">-- Error loading options --</option>`;
                        }
                    }
                })();
            }
            
            // Handle dropdown_mesh - execute command or retrieve nodes
            if (config.type === 'dropdown_mesh') {
                console.log(`[MESH] loadFieldOptions: checking dependencies for ${config.field_name}, has dependant_fields:`, !!config.dependant_fields);
                
                // Check if dependencies are met (for fields that have blocking dependencies)
                if (config.dependant_fields) {
                    const depsMet = RewstLib.utils.areDependenciesMet(config, allFieldConfigs);
                    console.log(`[MESH] Dependencies for ${config.field_name}: met=${depsMet}`, config.dependant_fields);
                    
                    if (!depsMet) {
                        console.log(`[MESH] Dependencies not met for ${config.field_name}, showing waiting message`);
                        if (formGroup) {
                            RewstLib.utils.showWaitingMessage(formGroup, config, allFieldConfigs);
                        }
                        return Promise.resolve();
                    } else {
                        // Dependencies are met, hide the waiting message
                        if (formGroup) {
                            RewstLib.utils.hideWaitingMessage(formGroup, config);
                        }
                    }
                }
                
                const isNodesMode = config.mode === 'nodes';
                // Skip cache if node_selection_type is 'query' and has variables (since results depend on variable values)
                const hasQueryVariables = config.node_selection_type === 'query' && config.node_query && config.node_query.includes('[[');
                const cacheKey = isNodesMode 
                    ? `mesh_nodes_${resolvedConfig.node_query}`
                    : config.node_selection_type === 'query'
                    ? `mesh_command_query_${resolvedConfig.node_query}_${resolvedConfig.command}`
                    : `mesh_command_${resolvedConfig.node_id}_${resolvedConfig.command}`;
                
                // Helper function to populate dropdown with data
                const populateMeshDropdown = (data) => {
                    if (!Array.isArray(data)) {
                        console.error(`[MESH] Data is not an array`);
                        return;
                    }
                    
                    // Store metadata about this dropdown's data source
                    dropdownSourceMetadata[config.field_name] = {
                        cacheType: 'mesh',
                        cacheKey: cacheKey,
                        valueName: config.value_field || 'id',
                        labelName: config.label_field || 'name',
                        data: data
                    };
                    
                    // For multi-select, use the library function
                    if (config.multi_select) {
                        console.log(`[MESH] Populating multi-select for ${config.field_name}`);
                        const options = data.map(item => ({
                            value: item[config.value_field] || item.id,
                            label: item[config.label_field] || item.name
                        }));
                        RewstLib.utils.initializeDropdownMultiSelect(config.field_name, options);
                    } else {
                        // Single-select: populate the select element
                        console.log(`[MESH] Populating single-select for ${config.field_name}`);
                        const input = document.querySelector(`select[name="${config.field_name}"]`);
                        if (!input) {
                            console.error(`[MESH] SELECT element not found for ${config.field_name}`);
                            return;
                        }
                        
                        if (data.length > 0) {
                            input.innerHTML = `<option value="">${RewstLib.utils.getGrammaticalPhrase(config.field_displayname)}</option>`;
                            let successCount = 0;
                            data.forEach((item) => {
                                const value = item[config.value_field] || item.id;
                                const label = item[config.label_field] || item.name;
                                if (value && label) {
                                    const opt = document.createElement('option');
                                    opt.value = value;
                                    opt.textContent = label;
                                    input.appendChild(opt);
                                    successCount++;
                                }
                            });
                        } else {
                            input.innerHTML = `<option value="">-- No results --</option>`;
                        }
                    }
                };
                
                // Helper function to flatten nodes from mesh groups
                const flattenNodes = (meshGroupsObj) => {
                    const nodes = [];
                    if (typeof meshGroupsObj === 'object' && meshGroupsObj !== null) {
                        Object.entries(meshGroupsObj).forEach(([groupKey, value]) => {
                            if (Array.isArray(value)) {
                                // The value is directly an array of nodes
                                nodes.push(...value);
                            } else if (value && typeof value === 'object') {
                                // The value is an object that might have a .nodes property
                                const groupNodes = value.nodes;
                                if (Array.isArray(groupNodes)) {
                                    nodes.push(...groupNodes);
                                } else if (typeof groupNodes === 'object') {
                                    // nodes is an object of node_id -> node_data
                                    const nodesArray = Object.values(groupNodes);
                                    nodes.push(...nodesArray);
                                }
                            }
                        });
                    }
                    return nodes;
                };
                
                // Check cache (skip if query has variables since results depend on variable values)
                if (!skipCache && !hasQueryVariables && proxyCache.commandResults[cacheKey]) {
                    if (formGroup) RewstLib.utils.hideLoadingMessage(formGroup, config);
                    populateMeshDropdown(proxyCache.commandResults[cacheKey]);
                    return Promise.resolve();
                }
                
                // Execute operation and return promise
                return (async () => {
                    try {
                        // Show loading message
                        if (formGroup) RewstLib.utils.showLoadingMessage(formGroup, config);
                        
                        const sessionToken = await getProxySessionToken('proxy_api_meshcentral');
                        let resultData;
                        
                        if (isNodesMode) {
                            // Get nodes matching the query
                            const nodesResult = await ProxyLib.getNodes(sessionToken, REWST_USER, {
                                query: resolvedConfig.node_query
                            });
                            
                            // Flatten the nested mesh group structure
                            resultData = flattenNodes(nodesResult.result);
                        } else {
                            // Execute command on specific node
                            let nodeId = config.node_id;
                            console.log(`[MESH] Command execution block - node_id from config: "${nodeId}"`);
                            
                            // Handle node_selection_type: "query" - resolve node_id from getNodes query
                            if (config.node_selection_type === 'query' && resolvedConfig.node_query) {
                                console.log(`[MESH] Node selection type is "query", processing query: ${resolvedConfig.node_query}`);
                                
                                const nodesResult = await ProxyLib.getNodes(sessionToken, REWST_USER, {
                                    query: resolvedConfig.node_query
                                });
                                
                                // Flatten the results to get an array of nodes
                                const queryNodes = flattenNodes(nodesResult.result);
                                console.log(`[MESH] Query returned ${queryNodes.length} node(s)`);
                                
                                if (queryNodes.length === 0) {
                                    throw new Error(`Query matched 0 nodes. Please refine the query to return exactly one node.`);
                                } else if (queryNodes.length > 1) {
                                    throw new Error(`Query matched ${queryNodes.length} nodes. Please refine the query to return exactly one node.`);
                                }
                                
                                // Extract node_id from the single matching node
                                nodeId = queryNodes[0]._id;
                                console.log(`[MESH] Resolved node_id from query: "${nodeId}"`);
                            } else {
                                // Use node_id from resolved config (which has all [[ ]] refs replaced)
                                nodeId = resolvedConfig.node_id;
                                console.log(`[MESH] Using resolved node_id: "${nodeId}"`);
                            }
                            
                            // Determine command type based on mode or explicit config
                            // Type 1 = CMD, Type 2 = PowerShell
                            let commandType = config.command_type;
                            
                            if (!commandType) {
                                // If mode is explicitly set, use that
                                if (config.mode === 'powershell') {
                                    commandType = 2;
                                    console.log('[MESH] Mode is powershell, using type 2 (PowerShell)');
                                } else if (config.mode === 'cmd') {
                                    commandType = 1;
                                    console.log('[MESH] Mode is cmd, using type 1 (CMD)');
                                } else if (resolvedConfig.command) {
                                    // Auto-detect: if command contains PowerShell-specific keywords, use type 2
                                    const psKeywords = ['Import-Module', 'Write-Output', 'Get-', 'Set-', '$', 'Write-Error', 'ConvertTo-Json'];
                                    if (psKeywords.some(kw => resolvedConfig.command.includes(kw))) {
                                        commandType = 2;
                                        console.log('[MESH] Auto-detected PowerShell command, using type 2');
                                    } else {
                                        commandType = 1;
                                        console.log('[MESH] Auto-detected CMD command, using type 1');
                                    }
                                } else {
                                    commandType = 1; // Default to CMD
                                }
                            }
                            
                            const commandResult = await ProxyLib.executeCommand(
                                sessionToken, 
                                REWST_USER, 
                                nodeId, 
                                resolvedConfig.command, 
                                commandType
                            );
                            
                            // Parse result - handle nested structure
                            let parsedResult = commandResult.result;
                            
                            // If result is an object with a nested 'result' property, get that
                            if (typeof parsedResult === 'object' && parsedResult !== null && parsedResult.result) {
                                parsedResult = parsedResult.result;
                            }
                            
                            // Parse as JSON string if needed
                            if (typeof parsedResult === 'string') {
                                try {
                                    parsedResult = JSON.parse(parsedResult);
                                } catch (e) {
                                    console.warn('[MESH] Could not parse command result as JSON:', e);
                                    parsedResult = [];
                                }
                            }
                            
                            resultData = Array.isArray(parsedResult) ? parsedResult : [];
                        }
                        
                        if (formGroup) RewstLib.utils.hideLoadingMessage(formGroup, config);
                        
                        // Cache the result (skip if query has variables since results depend on variable values)
                        if (!skipCache && !hasQueryVariables && Array.isArray(resultData)) {
                            proxyCache.commandResults[cacheKey] = resultData;
                        }
                        
                        populateMeshDropdown(Array.isArray(resultData) ? resultData : []);
                    } catch (error) {
                        console.error(`[MESH] Error loading ${isNodesMode ? 'nodes' : 'command'} for ${config.field_name}:`, error);
                        if (formGroup) RewstLib.utils.hideLoadingMessage(formGroup, config);
                        if (!config.multi_select) {
                            const input = document.querySelector(`select[name="${config.field_name}"]`);
                            if (input) input.innerHTML = `<option value="">-- Error loading options --</option>`;
                        }
                    }
                })();
            }
            
            // Handle form_extend separately
            if (config.type === 'form_extend') {
                console.log(`[FORM_EXTEND] Loading extended config for ${config.field_name}, extend_var: ${config.extend_var}`);
                
                // Collect current form data for variable replacement
                const currentFormData = {};
                if (formConfig && formConfig.field_configs) {
                    formConfig.field_configs.forEach(fc => {
                        const inp = document.querySelector(`input[name="${fc.field_name}"], select[name="${fc.field_name}"], textarea[name="${fc.field_name}"]`);
                        if (inp) {
                            if (inp.type === 'checkbox') {
                                currentFormData[fc.field_name] = inp.checked;
                            } else if (inp.type === 'radio') {
                                const checked = document.querySelector(`input[name="${fc.field_name}"]:checked`);
                                currentFormData[fc.field_name] = checked ? checked.value : null;
                            } else {
                                currentFormData[fc.field_name] = inp.value;
                            }
                        }
                    });
                }
                
                // Process extend_var_variables with tag replacement
                let varName = config.extend_var;
                let orgId = null;
                
                if (config.extend_var_variables) {
                    // Process varName
                    if (config.extend_var_variables.varName) {
                        if (config.extend_var_variables.varName.startsWith('[[') && config.extend_var_variables.varName.endsWith(']]')) {
                            const fieldName = config.extend_var_variables.varName.slice(2, -2).trim();
                            varName = currentFormData[fieldName] || config.extend_var_variables.varName;
                        } else {
                            varName = config.extend_var_variables.varName;
                        }
                    }
                    
                    // Process orgId
                    if (config.extend_var_variables.orgId) {
                        if (config.extend_var_variables.orgId.startsWith('[[') && config.extend_var_variables.orgId.endsWith(']]')) {
                            const fieldName = config.extend_var_variables.orgId.slice(2, -2).trim();
                            orgId = currentFormData[fieldName];
                        } else {
                            orgId = config.extend_var_variables.orgId;
                        }
                    }
                    
                    console.log(`[FORM_EXTEND] Processed variables: varName=${varName}, orgId=${orgId}`);
                }
                
                // Fallback if orgId not found
                if (!orgId) {
                    const depFieldName = config.dependant_fields ? config.dependant_fields.split(',')[0].trim() : null;
                    if (depFieldName) {
                        const depFieldInput = document.querySelector(`select[name="${depFieldName}"]`);
                        orgId = depFieldInput ? depFieldInput.value : null;
                    }
                }
                
                if (!orgId) {
                    console.log(`[FORM_EXTEND] No org ID found, skipping extended config load`);
                    return Promise.resolve();
                }
                
                // Load the org variable using processed variables
                const extendPromise = RewstLib.orgVariables.get(varName, orgId);
                
                return extendPromise.then(orgVar => {
                    console.log(`[FORM_EXTEND] Retrieved org variable:`, orgVar);
                    
                    if (!orgVar || !orgVar.value) {
                        console.log(`[FORM_EXTEND] No org variable found, clearing extended fields`);
                        // Remove the extended section entirely
                        const extendedSection = document.getElementById('extendedFieldsSection');
                        if (extendedSection) {
                            extendedSection.remove();
                        }
                        // Remove old extended fields from the main form
                        const baseFieldNames = new Set(formConfig.field_configs.map(f => f.field_name));
                        document.querySelectorAll('[data-field-name]').forEach(formGroup => {
                            const fieldName = formGroup.getAttribute('data-field-name');
                            if (!baseFieldNames.has(fieldName)) {
                                formGroup.remove();
                            }
                        });
                        return;
                    }
                    
                    // Parse the extend_config from the org variable value
                    let extendConfig;
                    try {
                        const parsed = JSON.parse(orgVar.value);
                        // Support both old nested format (extend_config) and new flat format
                        extendConfig = parsed.extend_config || parsed;
                        console.log(`[FORM_EXTEND] Parsed extend_config:`, extendConfig);
                    } catch (e) {
                        console.error(`[FORM_EXTEND] Failed to parse org variable value:`, e);
                        // Remove the extended section on parse error
                        const extendedSection = document.getElementById('extendedFieldsSection');
                        if (extendedSection) {
                            extendedSection.remove();
                        }
                        // Remove old extended fields from the main form
                        const baseFieldNames = new Set(formConfig.field_configs.map(f => f.field_name));
                        document.querySelectorAll('[data-field-name]').forEach(formGroup => {
                            const fieldName = formGroup.getAttribute('data-field-name');
                            if (!baseFieldNames.has(fieldName)) {
                                formGroup.remove();
                            }
                        });
                        return;
                    }
                    
                    if (!extendConfig || !extendConfig.field_configs || !Array.isArray(extendConfig.field_configs)) {
                        console.log(`[FORM_EXTEND] No field_configs found in extend_config, clearing extended fields`);
                        // Remove the extended section
                        const extendedSection = document.getElementById('extendedFieldsSection');
                        if (extendedSection) {
                            extendedSection.remove();
                        }
                        // Remove old extended fields from the main form
                        const baseFieldNames = new Set(formConfig.field_configs.map(f => f.field_name));
                        document.querySelectorAll('[data-field-name]').forEach(formGroup => {
                            const fieldName = formGroup.getAttribute('data-field-name');
                            if (!baseFieldNames.has(fieldName)) {
                                formGroup.remove();
                            }
                        });
                        return;
                    }
                    
                    // Merge extended field configs with main form configs
                    const extendedFields = extendConfig.field_configs;
                    console.log(`[FORM_EXTEND] Found ${extendedFields.length} extended fields`);
                    
                    // Create or get the extended section container
                    const previewContent = document.getElementById('previewContent');
                    let extendedSection = document.getElementById('extendedFieldsSection');
                    
                    if (!extendedSection) {
                        extendedSection = document.createElement('div');
                        extendedSection.id = 'extendedFieldsSection';
                        extendedSection.className = 'form-container';
                        extendedSection.style.borderTop = '1px solid #ffffff';
                        extendedSection.style.marginTop = '12px';
                        extendedSection.style.paddingTop = '11px';
                        previewContent.appendChild(extendedSection);
                    } else {
                        // Clear existing content when dependency changes
                        extendedSection.innerHTML = '';
                        // Remove any form-groups that are NOT in the base formConfig (these are old extended fields)
                        const baseFieldNames = new Set(formConfig.field_configs.map(f => f.field_name));
                        document.querySelectorAll('[data-field-name]').forEach(formGroup => {
                            const fieldName = formGroup.getAttribute('data-field-name');
                            if (!baseFieldNames.has(fieldName)) {
                                formGroup.remove();
                            }
                        });
                    }
                    
                    // Render extend_title if provided and show_title is true (default true if not specified)
                    const shouldShowTitle = extendConfig.show_title !== false;
                    if (extendConfig.extend_title && shouldShowTitle) {
                        console.log(`[FORM_EXTEND] Rendering title: ${extendConfig.extend_title}`);
                        const titleElement = document.createElement('h3');
                        titleElement.textContent = extendConfig.extend_title;
                        titleElement.style.color = '#ffffff';
                        titleElement.style.marginBottom = '15px';
                        titleElement.style.marginTop = '0px';
                        titleElement.style.fontSize = '1.1rem';
                        titleElement.style.fontWeight = '600';
                        titleElement.style.textAlign = 'center';
                        extendedSection.appendChild(titleElement);
                    }
                    
                    // Render extended fields with column layout
                    // Group extended fields by column
                    const extendedColumns = {};
                    extendedFields.forEach(config => {
                        const col = config.column || 1;
                        if (!extendedColumns[col]) {
                            extendedColumns[col] = [];
                        }
                        extendedColumns[col].push(config);
                    });
                    
                    // Sort fields within each column by sequence
                    Object.keys(extendedColumns).forEach(col => {
                        extendedColumns[col].sort((a, b) => (a.sequence || 0) - (b.sequence || 0));
                    });
                    
                    // Create a wrapper div for column layout
                    const columnWrapper = document.createElement('div');
                    columnWrapper.style.display = 'flex';
                    columnWrapper.style.gap = '30px';
                    
                    // Use column_count from config if provided, otherwise detect from fields
                    let columnCount = extendConfig.column_count;
                    if (!columnCount) {
                        columnCount = Math.max(...Object.keys(extendedColumns).map(Number));
                    }
                    
                    const showVertSep = extendConfig.show_vert_sep === true;
                    
                    // Render columns
                    for (let i = 1; i <= columnCount; i++) {
                        const columnDiv = document.createElement('div');
                        columnDiv.style.flex = '1';
                        
                        if (extendedColumns[i]) {
                            extendedColumns[i].forEach(config => {
                                const existingField = document.querySelector(`[data-field-name="${config.field_name}"]`);
                                if (!existingField) {
                                    console.log(`[FORM_EXTEND] Rendering field: ${config.field_name}`);
                                    const fieldHTML = renderFieldHTML(config, [...formConfig.field_configs, ...extendedFields]);
                                    columnDiv.innerHTML += fieldHTML;
                                }
                            });
                        }
                        
                        columnWrapper.appendChild(columnDiv);
                        
                        // Add vertical separator if not the last column
                        if (showVertSep && i < columnCount) {
                            const separator = document.createElement('div');
                            separator.style.width = '1px';
                            separator.style.background = '#ffffff';
                            separator.style.margin = '0';
                            columnWrapper.appendChild(separator);
                        }
                    }
                    
                    extendedSection.appendChild(columnWrapper);
                    
                    // Set up change listeners for extended fields
                    extendedFields.forEach(extConfig => {
                        const input = document.querySelector(`input[name="${extConfig.field_name}"], select[name="${extConfig.field_name}"], textarea[name="${extConfig.field_name}"]`);
                        if (input) {
                            input.addEventListener('change', () => {
                                console.log(`[FORM_EXTEND] Change event in extended field: ${extConfig.field_name}`);
                                RewstLib.forms.evaluateConditionalVisibility([...formConfig.field_configs, ...extendedFields]);
                            });
                        }
                    });
                    
                    // Show the extended section
                    if (formGroup) {
                        formGroup.style.display = '';
                    }
                    
                    console.log(`[FORM_EXTEND] Extended fields rendered successfully`);
                }).catch(error => {
                    console.error(`[FORM_EXTEND] Error loading extended config:`, error);
                });
            }
            
            // Only execute workflow for fields that are not form_extend
            if (config.type !== 'form_extend' && config.workflow_id) {
                // Resolve any [[ varName.property ]] page variable references in workflowInput
                const resolvedWorkflowInput = replaceReferencesInValue(workflowInput, (str) => {
                    // Replace [[ varName.property ]] with values from window.pageVariables
                    return str.replace(/\[\[\s*(\w+)(?:\.([^\]]+))?\s*\]\]/g, (match, varName, propertyPath) => {
                        if (!propertyPath) {
                            // [[ varName ]] - whole object
                            const val = window.pageVariables[varName];
                            return val !== undefined ? JSON.stringify(val) : match;
                        } else {
                            // [[ varName.property ]]
                            const pageVar = window.pageVariables[varName];
                            if (pageVar === undefined) return match;
                            
                            const trimmedPath = propertyPath.trim();
                            const parts = trimmedPath.split('.');
                            let current = pageVar;
                            for (const part of parts) {
                                if (current && typeof current === 'object') {
                                    current = current[part];
                                } else {
                                    return match;
                                }
                            }
                            return current !== undefined ? JSON.stringify(current) : match;
                        }
                    });
                });
                
                // Use cached workflow execution, passing the resolved workflowInput
                return getOrExecuteWorkflow(config, resolvedWorkflowInput, allFieldConfigs, formConfig).then(() => {
                    // Workflow completed successfully, hide loading message
                    if (formGroup) RewstLib.utils.hideLoadingMessage(formGroup, config);
                }).catch(error => {
                    console.error(`Error executing workflow for ${config.field_name}:`, error);
                    if (formGroup) RewstLib.utils.hideLoadingMessage(formGroup, config);
                    const input = document.querySelector(`select[name="${config.field_name}"]`);
                    if (input) input.innerHTML = `<option value="">-- Error loading options --</option>`;
                });
            }
        }

        /**
         * Setup sorting handlers for datatable fields
         * Allows clicking on column headers to sort ascending/descending
         */
        function setupDatatableSortHandlers(fieldConfigs) {
            // Store current sort state for each datatable
            if (!window.datatableSortState) {
                window.datatableSortState = {};
            }
            
            fieldConfigs.forEach(config => {
                if (config.type !== 'datatable') return;
                
                const formGroup = document.querySelector(`[data-field-name="${config.field_name}"]`);
                if (!formGroup) return;
                
                const table = formGroup.querySelector('table');
                if (!table) return;
                
                const headers = table.querySelectorAll('th[data-sort-col]');
                
                headers.forEach(header => {
                    header.addEventListener('click', (e) => {
                        const colName = header.getAttribute('data-sort-col');
                        
                        // Get current sort state
                        const sortKey = `${config.field_name}__${colName}`;
                        const currentSort = window.datatableSortState[sortKey];
                        const isAscending = currentSort?.direction === 'asc' ? false : true;
                        
                        // Update sort state
                        window.datatableSortState[sortKey] = {
                            column: colName,
                            direction: isAscending ? 'asc' : 'desc'
                        };
                        
                        // Get data from page variable
                        const dataVarPath = parseDataVariable(config.data_variable);
                        const datatableData = dataVarPath ? getPageVariableValue(dataVarPath) : undefined;
                        
                        if (!Array.isArray(datatableData) || datatableData.length === 0) {
                            return;
                        }
                        
                        // Sort the data
                        const sortedData = [...datatableData].sort((a, b) => {
                            const aVal = a[colName];
                            const bVal = b[colName];
                            
                            // Handle null/undefined
                            if (aVal === null || aVal === undefined) return isAscending ? 1 : -1;
                            if (bVal === null || bVal === undefined) return isAscending ? -1 : 1;
                            
                            // Numeric comparison
                            if (typeof aVal === 'number' && typeof bVal === 'number') {
                                return isAscending ? aVal - bVal : bVal - aVal;
                            }
                            
                            // String comparison
                            const aStr = String(aVal).toLowerCase();
                            const bStr = String(bVal).toLowerCase();
                            
                            if (isAscending) {
                                return aStr.localeCompare(bStr);
                            } else {
                                return bStr.localeCompare(aStr);
                            }
                        });
                        
                        // Re-render table with sorted data
                        const contentDiv = formGroup.querySelector('.datatable-content');
                        if (contentDiv) {
                            contentDiv.innerHTML = renderDatatable(sortedData, config);
                            
                            // Re-attach sort handlers to new table
                            setupDatatableSortHandlers(fieldConfigs);
                        }
                    });
                });
            });
        }
