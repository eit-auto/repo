    <!-- Load form config and check permissions before rendering body -->
    <script>
        /**
         * Load form config from org variables before body renders
         * This allows permission checking before page content is shown
         */
        async function loadFormConfigEarly() {
                const formId = RewstLib.forms.detectUrlFormId();
                console.log('[CONFIG EARLY LOAD] Form ID detected:', formId);
                
                if (!formId) {
                    console.warn('[CONFIG EARLY LOAD] No form ID found, skipping early permission check');
                    return;
                }
                
                // Fetch form config from org variables
                console.log('[CONFIG EARLY LOAD] Fetching form config for:', formId);
                const formVariable = await RewstLib.orgVariables.get(`form_${formId}`);
                
                if (!formVariable) {
                    console.warn('[CONFIG EARLY LOAD] Form config not found:', formId);
                    return;
                }
                
                let formConfig = null;
                try {
                    formConfig = JSON.parse(formVariable.value);
                } catch (e) {
                    console.error('[CONFIG EARLY LOAD] Failed to parse form config:', e);
                    return;
                }
                
                console.log('[CONFIG EARLY LOAD] Form config loaded, permissions:', formConfig.permissions);
                
                // Re-populate pagePermissions with form config permissions
                if (formConfig.permissions && Array.isArray(formConfig.permissions)) {
                    pagePermissions = formConfig.permissions;
                    console.log('[CONFIG EARLY LOAD] Updated pagePermissions:', pagePermissions);
                    
                    // Check permissions before page renders
                    checkPagePermission(pagePermissions);
                } else {
                    console.log('[CONFIG EARLY LOAD] No permissions in form config, showing page');
                    showPageContent();
                }
        }
        
        // Wait for RewstLib to be available before running config loading
        function waitForRewstLibThenLoad() {
            if (typeof RewstLib !== 'undefined' && RewstLib.forms) {
                console.log('[CONFIG EARLY LOAD] RewstLib ready, loading config...');
                loadFormConfigEarly();
            } else {
                console.log('[CONFIG EARLY LOAD] Waiting for RewstLib...');
                setTimeout(waitForRewstLibThenLoad, 100);
            }
        }
        
        waitForRewstLibThenLoad();
    </script>

    <script>
        // ============================================
        // REWST APP LIBRARY (Simplified)
        // ============================================
        class RewstApp {
            constructor(config = {}) {
                this.graphqlUrl = config.graphqlPath || '/graphql';
                this.orgId = config.orgId || null;
                this.isInitialized = config.orgId ? true : false;
                this.debugMode = config.debug || false;
            }

            _log(...args) {
                if (this.debugMode) console.log('[Rewst]', ...args);
            }

            _error(message, error) {
                console.error(`[Rewst Error] ${message}`);
                if (error) console.error('Details:', error);
            }

            async runWorkflowSmart(workflowId, inputData = {}, options = {}) {
                if (!this.isInitialized) {
                    throw new Error('Rewst not initialized. Call rewst.init(orgId) first!');
                }

                this._log('Running workflow (smart mode):', workflowId);

                try {
                    return await this.runWorkflow(workflowId, inputData, options);
                } catch (firstError) {
                    this._log('testWorkflow failed:', firstError.message);
                    this._log('Attempting trigger-based execution...');

                    try {
                        const triggers = await this.getWorkflowTriggers(workflowId);

                        if (!triggers || triggers.length === 0) {
                            throw new Error('Workflow has no triggers configured');
                        }

                        const enabledTrigger = triggers.find(t => t.enabled);
                        if (!enabledTrigger) {
                            throw new Error('No enabled triggers found');
                        }

                        const instance = enabledTrigger.orgInstances?.find(inst => inst.orgId === this.orgId);
                        if (!instance) {
                            throw new Error(`No trigger instance found for org ${this.orgId}`);
                        }

                        return await this.runWorkflowWithTrigger(
                            instance.id,
                            enabledTrigger.id,
                            inputData,
                            options
                        );

                    } catch (secondError) {
                        this._error('Both execution methods failed', secondError);
                        throw new Error(`Failed to run workflow: ${secondError.message}`);
                    }
                }
            }

            async runWorkflow(workflowId, inputData = {}, options = {}) {
                if (!this.isInitialized) {
                    throw new Error('Rewst not initialized. Missing orgId.');
                }

                this._log('Running workflow:', workflowId);

                try {
                    const query = `
                        mutation testWorkflow($id: ID!, $orgId: ID!, $input: JSON) {
                            testResult: testWorkflow(id: $id, orgId: $orgId, input: $input) {
                                executionId
                            }
                        }
                    `;

                    const result = await this._graphql('testWorkflow', query, { 
                        id: workflowId, 
                        orgId: this.orgId,
                        input: inputData 
                    });
                    
                    this._log('Workflow execution started:', result.testResult.executionId);
                    return await this._waitForCompletion(result.testResult.executionId, options.onProgress);
                    
                } catch (firstError) {
                    this._log('Direct execution failed:', firstError.message);
                    console.error('Direct execution error details:', firstError);
                    throw firstError;
                }
            }

            async runWorkflowWithTrigger(triggerInstanceId, triggerId, inputData = {}, options = {}) {
                const query = `
                    mutation testTrigger($input: JSON, $triggerInstance: OrgTriggerInstanceInput!) {
                        testResult: testWorkflowTrigger(triggerInstance: $triggerInstance, input: $input) {
                            executionId
                        }
                    }
                `;

                const result = await this._graphql('testTrigger', query, {
                    input: inputData,
                    triggerInstance: {
                        id: triggerInstanceId,
                        orgId: this.orgId,
                        isManualActivation: true,
                        organization: { id: this.orgId, name: 'Current Org' },
                        trigger: { id: triggerId, vars: [], orgId: this.orgId }
                    }
                });

                return await this._waitForCompletion(result.testResult.executionId, options.onProgress);
            }

            async _waitForCompletion(executionId, onProgress = null) {
                const pollInterval = 2000;
                const maxAttempts = 150;
                let attempts = 0;

                console.log('Starting poll for execution:', executionId);
                await new Promise(resolve => setTimeout(resolve, 500));

                while (attempts < maxAttempts) {
                    try {
                        console.log(`Poll attempt ${attempts + 1}/${maxAttempts}`);
                        const execution = await this.getExecutionStatus(executionId);

                        if (onProgress) {
                            try {
                                onProgress(execution.status, execution.numSuccessfulTasks);
                            } catch (e) {}
                        }

                        console.log('Poll status:', execution.status);

                        const terminalStates = ['COMPLETED', 'SUCCESS', 'succeeded', 'FAILED', 'failed', 'ERROR'];
                        const isComplete = terminalStates.some(s => execution.status.toUpperCase() === s.toUpperCase());

                        if (isComplete) {
                            const isFailed = ['FAILED', 'failed', 'ERROR'].some(s => execution.status.toUpperCase() === s.toUpperCase());
                            if (isFailed) {
                                const errorMsg = execution.conductor?.errors || 'Unknown error';
                                console.error('Workflow failed with error:', errorMsg);
                                throw new Error(`Workflow failed: ${errorMsg}`);
                            }
                            
                            // Check if conductor.output is ready
                            if (!execution.conductor?.output) {
                                console.log('Execution complete but conductor.output is empty, polling 5 more times to ensure output is ready');
                                let outputReadyAttempts = 0;
                                const maxOutputAttempts = 5;
                                
                                while (outputReadyAttempts < maxOutputAttempts) {
                                    await new Promise(resolve => setTimeout(resolve, pollInterval));
                                    const refreshedExecution = await this.getExecutionStatus(executionId);
                                    console.log(`Output ready check ${outputReadyAttempts + 1}/${maxOutputAttempts}, output:`, refreshedExecution.conductor?.output);
                                    
                                    if (refreshedExecution.conductor?.output) {
                                        console.log('Output is now ready, returning execution');
                                        return { ...refreshedExecution, success: true };
                                    }
                                    
                                    outputReadyAttempts++;
                                }
                                
                                // Output still not ready after 5 more attempts, but workflow is complete
                                console.warn('Output still empty after 5 additional polls, returning execution anyway');
                            }
                            
                            console.log('Execution completed successfully, output:', execution.conductor?.output);
                            return { ...execution, success: true };
                        }

                        await new Promise(resolve => setTimeout(resolve, pollInterval));
                        attempts++;

                    } catch (err) {
                        console.error('Poll error:', err);
                        throw err;
                    }
                }

                throw new Error('Workflow execution timeout');
            }

            async getExecutionStatus(executionId) {
                const query = `
                    query getExecution($id: ID!) {
                        workflowExecution(where: {id: $id}) {
                            id
                            status
                            conductor {
                                errors
                                output
                            }
                            numSuccessfulTasks
                            taskLogs {
                                id
                                createdAt
                                updatedAt
                                status
                                message
                            }
                        }
                    }
                `;

                const result = await this._graphql('getExecution', query, { id: executionId });
                return result.workflowExecution || {};
            }

            async startWorkflowExecution(workflowId, inputData = {}) {
                const query = `
                    mutation testWorkflow($id: ID!, $orgId: ID!, $input: JSON) {
                        testResult: testWorkflow(id: $id, orgId: $orgId, input: $input) {
                            executionId
                        }
                    }
                `;

                try {
                    const testResult = await this._graphql('testWorkflow', query, { 
                        id: workflowId, 
                        orgId: this.orgId,
                        input: inputData 
                    });
                    this._log('Workflow execution started:', testResult.testResult.executionId);
                    return testResult.testResult;
                } catch (firstError) {
                    this._log('testWorkflow failed:', firstError.message);
                    this._log('Attempting trigger-based execution...');

                    try {
                        const triggers = await this.getWorkflowTriggers(workflowId);

                        if (!triggers || triggers.length === 0) {
                            throw new Error('Workflow has no triggers configured');
                        }

                        const enabledTrigger = triggers.find(t => t.enabled);
                        if (!enabledTrigger) {
                            throw new Error('No enabled triggers found');
                        }

                        const instance = enabledTrigger.orgInstances?.find(inst => inst.orgId === this.orgId);
                        if (!instance) {
                            throw new Error(`No trigger instance found for org ${this.orgId}`);
                        }

                        const triggerQuery = `
                            mutation testTrigger($input: JSON, $triggerInstance: OrgTriggerInstanceInput!) {
                                testResult: testWorkflowTrigger(triggerInstance: $triggerInstance, input: $input) {
                                    executionId
                                }
                            }
                        `;

                        const triggerResult = await this._graphql('testTrigger', triggerQuery, {
                            input: inputData,
                            triggerInstance: {
                                id: instance.id,
                                orgId: this.orgId,
                                isManualActivation: true,
                                organization: { id: this.orgId, name: 'Current Org' },
                                trigger: { id: enabledTrigger.id, vars: [], orgId: this.orgId }
                            }
                        });

                        this._log('Workflow execution started via trigger:', triggerResult.testResult.executionId);
                        return triggerResult.testResult;

                    } catch (secondError) {
                        this._error('Both execution methods failed', secondError);
                        throw new Error(`Failed to run workflow: ${secondError.message}`);
                    }
                }
            }

            async getDetailedTaskLogs(executionId) {
                const query = `
                    query getTaskLogs($executionId: ID!) {
                        taskLogs(where: {workflowExecutionId: $executionId}) {
                            id
                            createdAt
                            status
                            message
                            workflowTaskId
                        }
                    }
                `;

                const result = await this._graphql('getTaskLogs', query, { executionId });
                return result.taskLogs || [];
            }

            async getWorkflowDetails(workflowId) {
                const query = `
                    query getWorkflow($workflowId: ID!) {
                        workflow(where: {id: $workflowId}) {
                            id
                            name
                            description
                            tasks {
                                id
                                name
                                action {
                                    name
                                    pack {
                                        name
                                    }
                                }
                            }
                        }
                    }
                `;

                try {
                    const result = await this._graphql('getWorkflow', query, { workflowId });
                    const workflow = result.workflow || {};
                    return workflow;
                } catch (error) {
                    console.error('getWorkflowDetails error:', error);
                    throw error;
                }
            }

            async getWorkflowTriggers(workflowId) {
                const query = `
                    query getTriggers($id: ID!) {
                        workflowTriggers: workflow(where: {id: $id}) {
                            triggers {
                                id
                                enabled
                                orgInstances {
                                    id
                                    orgId
                                }
                            }
                        }
                    }
                `;

                const result = await this._graphql('getTriggers', query, { id: workflowId });
                return result.workflowTriggers?.triggers || [];
            }

            async _graphql(operationName, query, variables) {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 30000);

                try {
                    const response = await fetch(this.graphqlUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query, variables, operationName }),
                        signal: controller.signal
                    });

                    if (!response.ok) {
                        const responseText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${responseText}`);
                    }
                    
                    const data = await response.json();
                    if (data.errors) {
                        throw new Error(data.errors[0]?.message || 'GraphQL error');
                    }
                    
                    return data.data;
                } catch (err) {
                    throw err;
                } finally {
                    clearTimeout(timeout);
                }
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        // UPDATE THESE VALUES FOR YOUR REWST INSTANCE
        const FETCH_FORMS_WORKFLOW_ID = '019b6911-bea8-75a9-a323-1676beb3334a';
        const SKIP_CACHE = false;  // Set to true to skip workflow result caching globally
        // Rewst processes {{ CTX.user.username }} server-side before sending HTML
        const REWST_USER = "{{ CTX.user.username }}";
        console.log('[FORM_VIEWER] REWST_USER value:', REWST_USER);
        console.log('[FORM_VIEWER] REWST_USER type:', typeof REWST_USER);
        console.log('[FORM_VIEWER] REWST_USER length:', REWST_USER.length);
        
        const rewst = new RewstApp({ 
            graphqlPath: '/graphql',
            orgId: window.ORG_ID,
            debug: true
        });

        let existingForms = [];
        let selectedFormId = null;

        // ============================================
        // URL PARAMETER DETECTION
        // ============================================
        // Shorter aliases for library functions
        const getUrlParameter = (name) => RewstLib.forms.getUrlParameter(name);
        const getFormIdFromParent = () => RewstLib.forms.getFormIdFromParent();
        const detectUrlFormId = () => RewstLib.forms.detectUrlFormId();
        const formatTaskName = (name) => RewstLib.forms.formatTaskName(name);

        // ============================================
        // LOAD FORM DIRECTLY FROM URL PARAMETER
        // ============================================
        async function loadFormFromUrlParameter(formId) {
            try {

        // ============================================

        /**
         * Parse data_variable from datatable config
         * Removes [[ ]] and spaces to get pure variable path
         * Examples: "so_data.products" or "[[ so_data.products ]]" both become "so_data.products"
         */
        function parseDataVariable(dataVar) {
            if (!dataVar) return null;
            // Remove [[ and ]] and trim spaces
            return dataVar.replace(/^\[\[\s*/, '').replace(/\s*\]\]$/, '').trim();
        }

        /**
         * Get value from page variables using dot notation
         * Examples: "so_data" or "so_data.products" or "org.address.street"
         */
        function getPageVariableValue(variablePath) {
            if (!variablePath) return undefined;
            
            const parts = variablePath.split('.');
            let current = window.pageVariables[parts[0]];
            
            for (let i = 1; i < parts.length; i++) {
                if (current && typeof current === 'object') {
                    current = current[parts[i]];
                } else {
                    return undefined;
                }
            }
            
            return current;
        }

        /**
         * Render a datatable from an array of objects
         * Returns HTML table or error message
         */
        function renderDatatable(data, config) {
            // Validate data is an array of objects
            if (!Array.isArray(data)) {
                return `<div style="color: #dc3545; font-size: 0.9rem; padding: 1rem; text-align: center;">Invalid data object</div>`;
            }
            
            if (data.length === 0) {
                return `<div style="color: #888; font-size: 0.9rem; padding: 1rem; text-align: center;">No data</div>`;
            }
            
            // Validate first item
            const firstItem = data[0];
            if (typeof firstItem !== 'object' || firstItem === null) {
                return `<div style="color: #dc3545; font-size: 0.9rem; padding: 1rem; text-align: center;">Invalid data object</div>`;

            const columns = Object.keys(firstItem);
            const listView = config?.list_view === true;
            
            if (listView) {
                // Card view: each row becomes a vertical card with 2-column property layout

                    cardsHtml += `<div style="display: grid; grid-template-columns: repeat(3, auto); gap: 1rem;">`;
                    
                    columns.forEach(col => {
                        const value = item[col];

                        cardsHtml += `<div>
                            <div style="font-weight: 700; color: #a0a0a0; font-size: 0.85rem; margin-bottom: 0.25rem;">${escapeHtml(col)}</div>
                            <div style="color: #e0e0e0; font-size: 0.9rem; word-wrap: break-word;">${escapeHtml(displayValue)}</div>
                        </div>`;
                    });
                    
                    cardsHtml += `</div></div>`;
                });
                
                cardsHtml += `</div>`;
                return cardsHtml;
            } else {
                // Table view: current horizontal table layout
                let tableHtml = `<table style="width: 100%; border-collapse: collapse; margin-top: 0.5rem;">
                    <thead style="background: #32373e;">
                        <tr>`;
                
                // Add sortable headers
                columns.forEach(col => {
                    tableHtml += `<th style="padding: 0.75rem; text-align: left; font-weight: 700; color: #ffffff; border-bottom: 2px solid #556870; cursor: pointer; user-select: none;" data-sort-col="${col}" title="Click to sort">${escapeHtml(col)}</th>`;
                });
                
                tableHtml += `</tr>
                    </thead>
                    <tbody>`;
                
                // Add rows

                    tableHtml += `<tr style="background: ${idx % 2 === 0 ? 'rgba(0, 0, 0, 0.25)' : 'rgba(0, 0, 0, 0.15)'};">`;

        /**
         * Assign renderMultiSelectContainer to RewstLib BEFORE renderForm is called
         * so it's available when renderFieldHTML needs it
         */
        // renderMultiSelectContainer already exists in RewstLib - don't overwrite
        // Instead, we'll inject the waiting message div after the container is rendered

        async function renderForm(form) {
            console.log('>>> renderForm STARTED');
            const previewContent = document.getElementById('previewContent');
            console.log('>>> previewContent element found:', !!previewContent);
            const previewParent = previewContent.parentElement;
            
            // Clear dropdown metadata for this form render
            dropdownSourceMetadata = {};
            
            if (!form) {
                previewContent.innerHTML = '<div class="preview-placeholder">Form data not found</div>';
                formButtonsContainer.style.display = 'none';
                return;
            }

            let html = '';

            // Extract form data - form_config is nested, but form_name is at root
            const formConfig = form.form_config;
            if (!formConfig) {
                previewContent.innerHTML = '<div class="preview-placeholder">Invalid form configuration</div>';
                formButtonsContainer.style.display = 'none';
                return;
            }

            const formName = form.form_name || formConfig.form_name || '';
            const showName = formConfig.show_form === true;
            const fieldConfigs = formConfig.field_configs || [];
            const columnCount = formConfig.column_count || 1;
            const workflowId = formConfig.form_workflow || '';
            
            // ========================================
            // DEFINE buildPageVariableDependencyMap FIRST
            // (This must be defined before it's called below)
            // ========================================
            
            /**
             * Whitelist of properties to scan for [[ ]] variable references by field type
             */
            const PROPERTY_WHITELIST = {
                // All field types
                'default_value': true,
                'description': true,
                // Display content
                'content': true,
                // Query/Command execution
                'query': true,
                'command': true,
                'node_query': true,
                // Workflow/API parameters
                'workflow_input': true,
                'graphql_op_variables': true,
                // Radio/Checkbox
                'default_select': true,
                // Field displayname (rarely, but possible)
                'field_displayname': true
            };

            /**
             * Recursively scan object/string for [[ ]] variable references
             * Returns array of varNames found
             */
            const scanPropertyForReferences = (value) => {
                const varNames = new Set();
                
                if (typeof value === 'string') {
                    // Scan string for [[ varName.property ]]
                    const regex = /\[\[\s*(\w+)(?:\.([^\]]+))?\s*\]\]/g;
                    let match;
                    while ((match = regex.exec(value)) !== null) {
                        varNames.add(match[1]);
                    }
                } else if (typeof value === 'object' && value !== null) {
                    // Recursively scan object properties (workflow_input, graphql_op_variables, etc.)
                    Object.values(value).forEach(val => {
                        scanPropertyForReferences(val).forEach(v => varNames.add(v));
                    });
                }
                
                return varNames;
            };

            /**
             * Build a comprehensive map of which fields depend on which page variables
             * Scans ALL whitelisted properties universally, including nested array items
             */
            const buildPageVariableDependencyMap = (fieldConfigs) => {
                const dependencies = {};
                
                const scanConfig = (config, fieldPath = '') => {
                    // Scan all whitelisted properties
                    Object.keys(config).forEach(propName => {
                        if (!PROPERTY_WHITELIST[propName]) return;
                        
                        const value = config[propName];
                        const varNames = scanPropertyForReferences(value);
                        
                        // Add field to each variable's dependency list
                        varNames.forEach(varName => {
                            if (!dependencies[varName]) {
                                dependencies[varName] = [];
                            }
                            if (!dependencies[varName].includes(config.field_name)) {
                                dependencies[varName].push(config.field_name);
                            }
                        });
                    });
                    
                    // Special handling for datatable's data_variable
                    if (config.type === 'datatable' && config.data_variable) {
                        const dataVarPath = parseDataVariable(config.data_variable);
                        console.log(`[DATATABLE_DEPS] Field: ${config.field_name}, data_variable: ${config.data_variable}, parsed: ${dataVarPath}`);
                        if (dataVarPath) {
                            // Extract the root variable name (e.g., "so_data" from "so_data.products")
                            const rootVarName = dataVarPath.split('.')[0];
                            console.log(`[DATATABLE_DEPS] Extracted root variable: ${rootVarName}`);
                            if (!dependencies[rootVarName]) {
                                dependencies[rootVarName] = [];
                            }
                            if (!dependencies[rootVarName].includes(config.field_name)) {
                                dependencies[rootVarName].push(config.field_name);
                                console.log(`[DATATABLE_DEPS] Registered ${config.field_name} as dependent on ${rootVarName}`);
                            }
                        }
                    }
                    
                    // Recursively scan array item configs
                    if (config.type === 'array' && Array.isArray(config.items)) {
                        config.items.forEach((itemConfig, idx) => {
                            scanConfig(itemConfig, `${fieldPath}[${idx}]`);
                        });
                    }
                };
                
                fieldConfigs.forEach(config => scanConfig(config));
                
                console.log('[PAGE_VAR_DEPS] Universal dependency map:', dependencies);
                return dependencies;
            };
            
            // Build dependency map for page variables
            const pageVarDependencies = buildPageVariableDependencyMap(fieldConfigs);
            
            // Store form config globally for use in modal (e.g., checking for output_var)
            window.currentFormConfig = formConfig;
            
            // ========================================
            // DEFINE ALL HELPER FUNCTIONS HERE
            // ========================================
            
            /**
             * Universal function to replace [[ ]] references in ANY value (within renderForm scope)
             * Uses the renderForm-scoped replacePageVariableReferences function
             */
            const replaceReferencesInValue = (value) => {
                if (typeof value === 'string') {
                    // Replace in string using renderForm-scoped function
                    return replacePageVariableReferences(value);
                } else if (typeof value === 'object' && value !== null) {
                    if (Array.isArray(value)) {
                        // Recursively replace in array items
                        return value.map(item => replaceReferencesInValue(item));
                    } else {
                        // Recursively replace in object properties
                        const replaced = {};
                        Object.keys(value).forEach(key => {
                            replaced[key] = replaceReferencesInValue(value[key]);
                        });
                        return replaced;
                    }
                }
                // Return unchanged for non-string, non-object types
                return value;
            };

            /**
             * Check if a field has [[ ]] refs in any execution parameters
             * (workflow_input, graphql_op_variables, query, command, node_query)
             */
            const hasExecutionParameterReferences = (config) => {
                const executionProps = ['workflow_input', 'graphql_op_variables', 'query', 'command', 'node_query'];
                
                for (const prop of executionProps) {
                    if (!config[prop]) continue;
                    const varNames = scanPropertyForReferences(config[prop]);
                    if (varNames.size > 0) {
                        console.log(`[PAGE_VAR_EXEC] Field ${config.field_name} has refs in ${prop}:`, Array.from(varNames));
                        return true;
                    }
                }
                return false;
            };

            /**
             * Get a copy of the field config with all [[ ]] references replaced
             * Used before executing workflows, queries, etc.
             */
            const getResolvedFieldConfig = (config) => {
                const resolved = { ...config };
                
                // Replace in execution parameters
                const executionProps = ['workflow_input', 'graphql_op_variables', 'query', 'command', 'node_query'];
                executionProps.forEach(prop => {
                    if (resolved[prop]) {
                        resolved[prop] = replaceReferencesInValue(config[prop]);
                        if (resolved[prop] !== config[prop]) {
                            console.log(`[PAGE_VAR_EXEC] Resolved ${prop}:`, resolved[prop]);
                        }
                    }
                });
                
                // Replace in display parameters
                ['default_value', 'default_select', 'description', 'content', 'field_displayname'].forEach(prop => {
                    if (resolved[prop] && typeof resolved[prop] === 'string') {
                        resolved[prop] = replaceReferencesInValue(config[prop]);
                    }
                });
                
                return resolved;
            };

            /**
             * Extract [[ variable_name.property ]] references from a string
             * Returns array of {fullMatch, varName, propertyPath}
             */
            const extractPageVariableReferences = (text) => {
                if (!text || typeof text !== 'string') return [];
                const regex = /\[\[\s*(\w+)(?:\.([^\]]+))?\s*\]\]/g;
                const matches = [];
                let match;
                while ((match = regex.exec(text)) !== null) {
                    matches.push({
                        fullMatch: match[0],
                        varName: match[1],
                        propertyPath: match[2] ? match[2].trim() : ''
                    });
                }
                return matches;

        /**
         * Check if all dependencies for a field are met
         */
        function areDependenciesMet(config, allFieldConfigs) {
            if (!config.dependant_fields) return true;
            
            console.log(`[DEPS] Checking dependencies for ${config.field_name}:`, Object.keys(config.dependant_fields));
            
            for (const depFieldName of Object.keys(config.dependant_fields)) {
                const depConfig = config.dependant_fields[depFieldName];
                
                // Check if this dependency is a data_retrieval field
                const depFieldConfig = allFieldConfigs.find(f => f.field_name === depFieldName);
                if (depFieldConfig && depFieldConfig.type === 'data_retrieval') {
                    // For data_retrieval fields, check if they have cached results
                    if (depConfig.blocking) {
                        const cachedData = proxyCache.dataRetrievalResults[depFieldName];
                        console.log(`[DEPS] Checking data_retrieval ${depFieldName}: blocking=${depConfig.blocking}, cached=${!!cachedData}, hasError=${cachedData?.error ? true : false}`);
                        if (!cachedData || cachedData.error) {
                            console.log(`[DEPS] Data_retrieval field ${depFieldName} not yet executed or has error`);
                            return false;
                        }
                    }
                    continue;
                }
                
                // For regular fields, check input values
                const input = document.querySelector(`input[name="${depFieldName}"], select[name="${depFieldName}"], textarea[name="${depFieldName}"]`);
                
                if (!input) continue;
                
                // Check if the dependency field is hidden and should not block
                const depFieldFormGroup = document.querySelector(`[data-field-name="${depFieldName}"]`);
                const isDepFieldHidden = depFieldFormGroup && (depFieldFormGroup.offsetParent === null || window.getComputedStyle(depFieldFormGroup).display === 'none');
                
                // If field is hidden and block_hidden is false, skip this dependency
                if (isDepFieldHidden && depConfig.block_hidden === false) {
                    console.log(`[DEPS] Skipping hidden dependency ${depFieldName} (block_hidden=false)`);
                    continue;
                }
                
                let value = '';
                if (input.type === 'checkbox') {
                    value = input.checked;
                } else if (input.type === 'radio') {
                    const checked = document.querySelector(`input[name="${depFieldName}"]:checked`);
                    value = checked ? checked.value : null;
                } else {
                    value = input.value;
                }
                
                console.log(`[DEPS] Field ${depFieldName}: blocking=${depConfig.blocking}, value='${value}'`);
                
                // If blocking is true and value is empty, dependencies not met
                if (depConfig.blocking && (value === '' || value === null)) {
                    console.log(`[DEPS] Blocking dependency ${depFieldName} not met`);
                    return false;
                }
            }
            
            console.log(`[DEPS] All dependencies met for ${config.field_name}`);
            return true;
        }

        async function executeQueryWithRetry(apiKeyName, query, maxRetries = 2) {
            let lastError = null;
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    console.log(`[MYSQL] executeQuery attempt ${attempt}/${maxRetries}`);
                    const sessionToken = await getProxySessionToken(apiKeyName);
                    const result = await ProxyLib.executeQuery(sessionToken, REWST_USER, query, {});
                    if (result && result.result) return result;
                    if (result?.error?.toString().includes('401')) throw new Error('Invalid session token (401)');
                    throw new Error('Failed to execute query: ' + (result?.error || 'Unknown error'));
                } catch (error) {
                    lastError = error;
                    const is401 = error.message && (error.message.includes('401') || error.message.includes('HTTP 401'));
                    if (is401 && attempt < maxRetries) {
                        console.log(`[MYSQL] Got 401 error on attempt ${attempt}, clearing token cache and retrying...`);
                        proxyCache.sessions = proxyCache.sessions || {};
                        delete proxyCache.sessions[apiKeyName];
                        await new Promise(resolve => setTimeout(resolve, 500 * attempt));
                        continue;
                    }
                    throw error;
                }
            }
            throw lastError || new Error('Failed after retries');
        }

        async function executeCommandWithRetryLogic(apiKeyName, nodeId, command, commandType = 2, maxRetries = 2) {
