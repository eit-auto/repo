<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REWST Form Viewer</title>
    <!-- External Rewst Library CSS -->
    <link rel="stylesheet" href="https://eit-auto.github.io/repo/rewst-library.css">
    <style>
        /* Form Viewer specific customizations */
        body {
            background: transparent;
            display: flex;
            flex-direction: column;
        }

        .preview-placeholder {
            color: #999;
            text-align: center;
            padding: 60px 20px;
            font-size: 16px;

        .modal-status {
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 16px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-section:last-child {
            border-bottom: none;
        }

        .modal-label {
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 8px;

        }
    </style>
    <!-- Organization ID - must be set before loading rewst-library.js -->
    <script>
        window.ORG_ID = '019176c2-059f-7391-afbc-97b201efbd93';
    </script>
    <!-- Rewst Library JavaScript (embedded) -->
    <script src="https://eit-auto.github.io/repo/rewst-library.js"></script>
<body>
    <!-- Validation Error Modal -->
    <div id="validationErrorModal" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; z-index: 1000;">
        <div style="background: #2E5F75; border-radius: 8px; padding: 30px; max-width: 500px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); color: #ffffff;">
            <h2 style="margin-top: 0; margin-bottom: 20px; color: #ffffff;">Validation Error</h2>
            <p id="validationErrorMessage" style="margin-bottom: 30px; line-height: 1.6;"></p>
            <div style="text-align: center;">
                <button id="validationErrorOkBtn" style="padding: 10px 30px; background: #667eea; color: white; border: none; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer;">OK</button>
            </div>
        </div>
    </div>

    <!-- Execution Status Modal -->
    <div class="modal-overlay" id="executionModal" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; z-index: 1000;">
        <div class="modal" style="background: #2E5F75; border-radius: 8px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); padding: 30px; max-width: 600px; width: auto; max-height: 80vh; overflow-y: auto; position: relative; color: #ffffff;">
            <button class="btn-close" id="modalCloseBtn">&times;</button>
            <div class="modal-content" id="modalContent"></div>
        </div>
    </div>

    <div style="display: flex; flex-direction: column; height: 100%; width: 100%;">
        <div style="padding: 15px 20px; box-sizing: border-box; flex-shrink: 0;">
            <div style="max-width: 1200px; margin: 0 auto;">
                <!-- Open Existing Row -->
                <div id="open_existing_section" style="display: none; align-items: center; gap: 10px; justify-content: center;">
                    <select id="open_existing_dropdown" style="width: 300px; padding: 10px; background: #1a3540; border: 1px solid #555; border-radius: 4px; color: #ffffff; font-size: 14px;">
                        <option value="">-- Select a form --</option>
                    </select>
                    <div class="waiting-box" id="open_existing_loading" style="width: 300px; display: none; margin-top: 0;">
                        <h4 style="font-size: 14px; gap: 8px;">Loading Forms<span class="spinner" style="width: 16px; height: 16px; border-width: 2px;"></span></h4>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content Area with Form Preview -->
        <div class="content-wrapper">
            <div class="content-wrapper-inner">
                <div id="previewContent" class="main-panel">
                    <div class="preview-placeholder">
                        Select a form from above to view it
                    </div>
                </div>
                <!-- Form Action Buttons -->
                <div id="formButtonsContainer" style="display: none; margin-top: 20px; display: flex; gap: 10px; justify-content: center; align-items: center; position: relative;">
                    <button id="resetFormBtn" class="btn btn-gold">Reset</button>
                    <button id="submitFormBtn" class="btn btn-blue">Submit</button>
                    <div id="workflowExecutingBox" style="position: absolute; right: 0; width: auto; padding: 12px 16px; background: #fff3cd; border: 1px solid #ffeeba; border-radius: 6px; text-align: center; color: #856404; font-size: 14px; font-weight: 600; cursor: pointer; display: none; white-space: nowrap;">
                        <span class="spinner" style="display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(133, 100, 4, 0.3); border-top-color: #856404; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle;"></span>Workflow Executing...
                    </div>
                    <div id="workflowCompletionStatus" style="position: absolute; right: 0; width: auto; padding: 12px 16px; background: #d4edda; border: 1px solid #c3e6cb; border-radius: 6px; text-align: center; color: #155724; font-size: 14px; font-weight: 600; cursor: pointer; display: none; white-space: nowrap;">
                        ✓ Workflow Completed
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // REWST APP LIBRARY (Simplified)
        // ============================================
        class RewstApp {
            constructor(config = {}) {
                this.graphqlUrl = config.graphqlPath || '/graphql';
                this.orgId = config.orgId || null;
                this.isInitialized = config.orgId ? true : false;
                this.debugMode = config.debug || false;
            }

            _log(...args) {
                if (this.debugMode) console.log('[Rewst]', ...args);
            }

            _error(message, error) {
                console.error(`[Rewst Error] ${message}`);
                if (error) console.error('Details:', error);
            }

            async runWorkflowSmart(workflowId, inputData = {}, options = {}) {
                if (!this.isInitialized) {
                    throw new Error('Rewst not initialized. Call rewst.init(orgId) first!');
                }

                this._log('Running workflow (smart mode):', workflowId);

                try {
                    return await this.runWorkflow(workflowId, inputData, options);
                } catch (firstError) {
                    this._log('testWorkflow failed:', firstError.message);
                    this._log('Attempting trigger-based execution...');

                    try {
                        const triggers = await this.getWorkflowTriggers(workflowId);

                        if (!triggers || triggers.length === 0) {
                            throw new Error('Workflow has no triggers configured');
                        }

                        const enabledTrigger = triggers.find(t => t.enabled);
                        if (!enabledTrigger) {
                            throw new Error('No enabled triggers found');
                        }

                        const instance = enabledTrigger.orgInstances?.find(inst => inst.orgId === this.orgId);
                        if (!instance) {
                            throw new Error(`No trigger instance found for org ${this.orgId}`);
                        }

                        return await this.runWorkflowWithTrigger(
                            instance.id,
                            enabledTrigger.id,
                            inputData,
                            options
                        );

                    } catch (secondError) {
                        this._error('Both execution methods failed', secondError);
                        throw new Error(`Failed to run workflow: ${secondError.message}`);
                    }
                }
            }

            async runWorkflow(workflowId, inputData = {}, options = {}) {
                if (!this.isInitialized) {
                    throw new Error('Rewst not initialized. Missing orgId.');
                }

                this._log('Running workflow:', workflowId);

                try {
                    const query = `
                        mutation testWorkflow($id: ID!, $orgId: ID!, $input: JSON) {
                            testResult: testWorkflow(id: $id, orgId: $orgId, input: $input) {
                                executionId
                            }
                        }
                    `;

                    const result = await this._graphql('testWorkflow', query, { 
                        id: workflowId, 
                        orgId: this.orgId,
                        input: inputData 
                    });
                    
                    this._log('Workflow execution started:', result.testResult.executionId);
                    return await this._waitForCompletion(result.testResult.executionId, options.onProgress);
                    
                } catch (firstError) {
                    this._log('Direct execution failed:', firstError.message);
                    console.error('Direct execution error details:', firstError);
                    throw firstError;
                }
            }

            async runWorkflowWithTrigger(triggerInstanceId, triggerId, inputData = {}, options = {}) {
                const query = `
                    mutation testTrigger($input: JSON, $triggerInstance: OrgTriggerInstanceInput!) {
                        testResult: testWorkflowTrigger(triggerInstance: $triggerInstance, input: $input) {
                            executionId
                        }
                    }
                `;

                const result = await this._graphql('testTrigger', query, {
                    input: inputData,
                    triggerInstance: {
                        id: triggerInstanceId,
                        orgId: this.orgId,
                        isManualActivation: true,
                        organization: { id: this.orgId, name: 'Current Org' },
                        trigger: { id: triggerId, vars: [], orgId: this.orgId }
                    }
                });

                return await this._waitForCompletion(result.testResult.executionId, options.onProgress);
            }

            async _waitForCompletion(executionId, onProgress = null) {
                const pollInterval = 2000;
                const maxAttempts = 150;
                let attempts = 0;

                console.log('Starting poll for execution:', executionId);
                await new Promise(resolve => setTimeout(resolve, 500));

                while (attempts < maxAttempts) {
                    try {
                        console.log(`Poll attempt ${attempts + 1}/${maxAttempts}`);
                        const execution = await this.getExecutionStatus(executionId);

                        if (onProgress) {
                            try {
                                onProgress(execution.status, execution.numSuccessfulTasks);
                            } catch (e) {}
                        }

                        console.log('Poll status:', execution.status);

                        const terminalStates = ['COMPLETED', 'SUCCESS', 'succeeded', 'FAILED', 'failed', 'ERROR'];
                        const isComplete = terminalStates.some(s => execution.status.toUpperCase() === s.toUpperCase());

                        if (isComplete) {
                            const isFailed = ['FAILED', 'failed', 'ERROR'].some(s => execution.status.toUpperCase() === s.toUpperCase());
                            if (isFailed) {
                                const errorMsg = execution.conductor?.errors || 'Unknown error';
                                console.error('Workflow failed with error:', errorMsg);
                                throw new Error(`Workflow failed: ${errorMsg}`);
                            }
                            
                            // Check if conductor.output is ready
                            if (!execution.conductor?.output) {
                                console.log('Execution complete but conductor.output is empty, polling 5 more times to ensure output is ready');
                                let outputReadyAttempts = 0;
                                const maxOutputAttempts = 5;
                                
                                while (outputReadyAttempts < maxOutputAttempts) {
                                    await new Promise(resolve => setTimeout(resolve, pollInterval));
                                    const refreshedExecution = await this.getExecutionStatus(executionId);
                                    console.log(`Output ready check ${outputReadyAttempts + 1}/${maxOutputAttempts}, output:`, refreshedExecution.conductor?.output);
                                    
                                    if (refreshedExecution.conductor?.output) {
                                        console.log('Output is now ready, returning execution');
                                        return { ...refreshedExecution, success: true };
                                    }
                                    
                                    outputReadyAttempts++;
                                }
                                
                                // Output still not ready after 5 more attempts, but workflow is complete
                                console.warn('Output still empty after 5 additional polls, returning execution anyway');
                            }
                            
                            console.log('Execution completed successfully, output:', execution.conductor?.output);
                            return { ...execution, success: true };
                        }

                        await new Promise(resolve => setTimeout(resolve, pollInterval));
                        attempts++;

                    } catch (err) {
                        console.error('Poll error:', err);
                        throw err;
                    }
                }

                throw new Error('Workflow execution timeout');
            }

            async getExecutionStatus(executionId) {
                const query = `
                    query getExecution($id: ID!) {
                        workflowExecution(where: {id: $id}) {
                            id
                            status
                            conductor {
                                errors
                                output
                            }
                            numSuccessfulTasks
                            taskLogs {
                                id
                                createdAt
                                updatedAt
                                status
                                message
                            }
                        }
                    }
                `;

                const result = await this._graphql('getExecution', query, { id: executionId });
                return result.workflowExecution || {};
            }

            async startWorkflowExecution(workflowId, inputData = {}) {
                const query = `
                    mutation testWorkflow($id: ID!, $orgId: ID!, $input: JSON) {
                        testResult: testWorkflow(id: $id, orgId: $orgId, input: $input) {
                            executionId
                        }
                    }
                `;

                try {
                    const testResult = await this._graphql('testWorkflow', query, { 
                        id: workflowId, 
                        orgId: this.orgId,
                        input: inputData 
                    });
                    this._log('Workflow execution started:', testResult.testResult.executionId);
                    return testResult.testResult;
                } catch (firstError) {
                    this._log('testWorkflow failed:', firstError.message);
                    this._log('Attempting trigger-based execution...');

                    try {
                        const triggers = await this.getWorkflowTriggers(workflowId);

                        if (!triggers || triggers.length === 0) {
                            throw new Error('Workflow has no triggers configured');
                        }

                        const enabledTrigger = triggers.find(t => t.enabled);
                        if (!enabledTrigger) {
                            throw new Error('No enabled triggers found');
                        }

                        const instance = enabledTrigger.orgInstances?.find(inst => inst.orgId === this.orgId);
                        if (!instance) {
                            throw new Error(`No trigger instance found for org ${this.orgId}`);
                        }

                        const triggerQuery = `
                            mutation testTrigger($input: JSON, $triggerInstance: OrgTriggerInstanceInput!) {
                                testResult: testWorkflowTrigger(triggerInstance: $triggerInstance, input: $input) {
                                    executionId
                                }
                            }
                        `;

                        const triggerResult = await this._graphql('testTrigger', triggerQuery, {
                            input: inputData,
                            triggerInstance: {
                                id: instance.id,
                                orgId: this.orgId,
                                isManualActivation: true,
                                organization: { id: this.orgId, name: 'Current Org' },
                                trigger: { id: enabledTrigger.id, vars: [], orgId: this.orgId }
                            }
                        });

                        this._log('Workflow execution started via trigger:', triggerResult.testResult.executionId);
                        return triggerResult.testResult;

                    } catch (secondError) {
                        this._error('Both execution methods failed', secondError);
                        throw new Error(`Failed to run workflow: ${secondError.message}`);
                    }
                }
            }

            async getDetailedTaskLogs(executionId) {
                const query = `
                    query getTaskLogs($executionId: ID!) {
                        taskLogs(where: {workflowExecutionId: $executionId}) {
                            id
                            createdAt
                            status
                            message
                            workflowTaskId
                        }
                    }
                `;

                const result = await this._graphql('getTaskLogs', query, { executionId });
                return result.taskLogs || [];
            }

            async getWorkflowDetails(workflowId) {
                const query = `
                    query getWorkflow($workflowId: ID!) {
                        workflow(where: {id: $workflowId}) {
                            id
                            name
                            description
                            tasks {
                                id
                                name
                                action {
                                    name
                                    pack {
                                        name
                                    }
                                }
                            }
                        }
                    }
                `;

                try {
                    const result = await this._graphql('getWorkflow', query, { workflowId });
                    const workflow = result.workflow || {};
                    return workflow;
                } catch (error) {
                    console.error('getWorkflowDetails error:', error);
                    throw error;
                }
            }

            async getWorkflowTriggers(workflowId) {
                const query = `
                    query getTriggers($id: ID!) {
                        workflowTriggers: workflow(where: {id: $id}) {
                            triggers {
                                id
                                enabled
                                orgInstances {
                                    id
                                    orgId
                                }
                            }
                        }
                    }
                `;

                const result = await this._graphql('getTriggers', query, { id: workflowId });
                return result.workflowTriggers?.triggers || [];
            }

            async _graphql(operationName, query, variables) {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 30000);

                try {
                    const response = await fetch(this.graphqlUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query, variables, operationName }),
                        signal: controller.signal
                    });

                    if (!response.ok) {
                        const responseText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${responseText}`);
                    }
                    
                    const data = await response.json();
                    if (data.errors) {
                        throw new Error(data.errors[0]?.message || 'GraphQL error');
                    }
                    
                    return data.data;
                } catch (err) {
                    throw err;
                } finally {
                    clearTimeout(timeout);
                }
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        // UPDATE THESE VALUES FOR YOUR REWST INSTANCE
        const FETCH_FORMS_WORKFLOW_ID = '019b6911-bea8-75a9-a323-1676beb3334a';
        const SKIP_CACHE = false;  // Set to true to skip workflow result caching globally
        // Rewst processes {{ CTX.user.username }} server-side before sending HTML
        const REWST_USER = "{{ CTX.user.username }}";
        console.log('[FORM_VIEWER] REWST_USER value:', REWST_USER);
        console.log('[FORM_VIEWER] REWST_USER type:', typeof REWST_USER);
        console.log('[FORM_VIEWER] REWST_USER length:', REWST_USER.length);
        
        const rewst = new RewstApp({ 
            graphqlPath: '/graphql',
            orgId: window.ORG_ID,
            debug: true
        });

        let existingForms = [];
        let selectedFormId = null;

        // ============================================
        // URL PARAMETER DETECTION
        // ============================================
        // Shorter aliases for library functions
        const getUrlParameter = (name) => RewstLib.forms.getUrlParameter(name);
        const getFormIdFromParent = () => RewstLib.forms.getFormIdFromParent();
        const detectUrlFormId = () => RewstLib.forms.detectUrlFormId();
        const escapeHtml = (text) => RewstLib.forms.escapeHtml(text);
        const formatTaskName = (name) => RewstLib.forms.formatTaskName(name);

        // ============================================
        // LOAD FORM DIRECTLY FROM URL PARAMETER
        // ============================================
        async function loadFormFromUrlParameter(formId) {
            try {
                console.log('>>> loadFormFromUrlParameter called with formId:', formId);
                
                // Hide the forms dropdown and loading section
                const dropdown = document.getElementById('open_existing_dropdown');
                const loading = document.getElementById('open_existing_loading');
                const formsSection = document.getElementById('open_existing_section');
                
                if (dropdown) {
                    dropdown.style.display = 'none';
                }
                if (loading) {
                    loading.style.display = 'none';
                }
                if (formsSection) {
                    formsSection.style.display = 'none';
                }
                
                console.log('>>> Fetching form from org variables with form_id:', formId);
                
                // Use RewstLib to fetch the form config, with fallback if not loaded
                let formVariable = null;
                
                // Check if RewstLib is available (wrapped to avoid ReferenceError)
                let useRewstLib = false;
                try {
                    useRewstLib = (typeof window.RewstLib !== 'undefined' && window.RewstLib.orgVariables && window.RewstLib.orgVariables.get);
                } catch (e) {
                    useRewstLib = false;
                }
                
                if (useRewstLib) {
                    console.log('>>> Using RewstLib to fetch form');
                    try {
                        formVariable = await window.RewstLib.orgVariables.get(`form_${formId}`);
                        console.log('>>> RewstLib returned:', formVariable);
                    } catch (e) {
                        console.error('>>> RewstLib fetch failed:', e);
                        formVariable = null;
                    }
                }
                
                // Fallback to GraphQL if RewstLib not available or failed
                if (!formVariable) {
                    console.log('>>> Using fallback GraphQL fetch');
                    // Fallback: direct GraphQL query if RewstLib isn't loaded
                    const response = await fetch('/graphql', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            query: `{
                                visibleOrgVariables(
                                    visibleForOrgId: "${window.ORG_ID}"
                                    search: { 
                                        organization: { id: { _eq: "${window.ORG_ID}" } }
                                        name: { _eq: "form_${formId}" }
                                    }
                                ) {
                                    id
                                    name
                                    value
                                }
                            }`
                        })
                    });

                    const data = await response.json();
                    console.log('>>> GraphQL response:', data);

                    if (data.errors) {
                        throw new Error(`GraphQL Error: ${data.errors[0]?.message || 'Unknown error'}`);
                    }

                    const variables = data.data?.visibleOrgVariables || [];
                    console.log('>>> Variables found:', variables.length);
                    if (variables.length > 0) {
                        formVariable = variables[0];
                    }
                }
                
                console.log('>>> Final formVariable:', formVariable);
                
                if (!formVariable) {
                    console.warn('No form variable found for form_id:', formId);
                    console.log('Loading element:', loading);
                    
                    // Update the preview content to show the error message
                    const previewContent = document.getElementById('previewContent');
                    if (previewContent) {
                        previewContent.innerHTML = `<div class="preview-placeholder" style="color: #dc3545; font-size: 18px; font-weight: 600;">Form ID ${escapeHtml(formId)} Not Found</div>`;
                    }
                    
                    // Show the "Form not found" message in place of loading message
                    if (loading) {
                        console.log('Setting loading message for form_id:', formId);
                        loading.style.background = '#f8d7da';
                        loading.style.borderColor = '#f5c6cb';
                        loading.style.color = '#721c24';
                        loading.innerHTML = `<h4 style="font-size: 14px; margin: 0; color: #721c24;">Form ID ${escapeHtml(formId)} Not Found</h4>`;
                        loading.style.display = 'block';
                        console.log('Loading display set to:', loading.style.display);
                        console.log('Loading innerHTML:', loading.innerHTML);
                    } else {
                        console.log('Loading element is null/undefined');
                    }
                    
                    return { notFound: true };
                }

                const variable = formVariable;
                
                // Parse the form configuration
                let formConfig = null;
                try {
                    formConfig = JSON.parse(variable.value);
                } catch (e) {
                    console.error('Failed to parse form_config:', e);
                    throw new Error('Invalid form configuration JSON');
                }

                // Build the form object with the same structure as fetchExistingForms
                const form = {
                    form_id: variable.name.replace('form_', ''),
                    form_name: formConfig.form_name || variable.name,
                    form_config: formConfig
                };

                console.log('>>> Successfully loaded form:', form);
                console.log('>>> Calling renderForm with form object');
                try {
                    renderForm(form);
                    console.log('>>> renderForm completed successfully');
                } catch (renderError) {
                    console.error('>>> ERROR in renderForm:', renderError);
                    console.error('>>> Stack:', renderError.stack);
                }
                return { success: true };
                
            } catch (error) {
                console.error('>>> Error loading form from URL parameter:', error);
                
                // Update the preview content to show the error message
                const previewContent = document.getElementById('previewContent');
                if (previewContent) {
                    previewContent.innerHTML = `<div class="preview-placeholder" style="color: #dc3545; font-size: 18px; font-weight: 600;">Form ID ${escapeHtml(formId)} Not Found</div>`;
                }
                
                // Show the "Form not found" message in place of loading message
                if (loading) {
                    loading.style.background = '#f8d7da';
                    loading.style.borderColor = '#f5c6cb';
                    loading.style.color = '#721c24';
                    loading.innerHTML = `<h4 style="font-size: 14px; margin: 0; color: #721c24;">Form ID ${escapeHtml(formId)} Not Found</h4>`;
                    loading.style.display = 'block';
                }
                
                return { error: true };
            }
        }

        // ============================================
        // FETCH EXISTING FORMS
        // ============================================
        let formsAlreadyFetched = false;
        let formsCurrentlyFetching = false;
        let formsFetchPromise = null;

        async function fetchExistingForms() {
            // If already fetched, return immediately
            if (formsAlreadyFetched) {
                console.log('Forms already fetched, skipping...');
                return;
            }
            
            // If currently fetching, wait for that to complete
            if (formsCurrentlyFetching && formsFetchPromise) {
                console.log('Forms currently being fetched, waiting for completion...');
                return await formsFetchPromise;
            }
            
            // Set flag and create promise
            formsCurrentlyFetching = true;
            
            formsFetchPromise = (async () => {
                try {
                    console.log('Fetching form configurations from org variables...');
                    
                    // GraphQL query to fetch form_* org variables
                    const response = await fetch('/graphql', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            query: `{
                                visibleOrgVariables(
                                    visibleForOrgId: "${window.ORG_ID}"
                                    search: { 
                                        organization: { id: { _eq: "${window.ORG_ID}" } }
                                        name: { _ilike: "form_%" }
                                    }
                                ) {
                                    id
                                    name
                                    value
                                    category
                                    cascade
                                    createdAt
                                    updatedAt
                                    organization {
                                        id
                                        name
                                    }
                                    packConfig {
                                        id
                                        name
                                    }
                                }
                            }`
                        })
                    });

                    const data = await response.json();

                    if (data.errors) {
                        throw new Error(`GraphQL Error: ${data.errors[0]?.message || 'Unknown error'}`);
                    }

                    // Extract org variables
                    const variables = data.data?.visibleOrgVariables || [];
                    
                    if (!variables || variables.length === 0) {
                        console.warn('No form variables found');
                        formsCurrentlyFetching = false;
                        throw new Error('No form variables found');
                    }

                    // Build form objects from variables
                    existingForms = variables.map(v => {
                        let formName = v.name;
                        let formConfig = null;
                        
                        try {
                            formConfig = JSON.parse(v.value);
                            if (formConfig.form_name) {
                                formName = formConfig.form_name;
                            }
                        } catch (e) {
                            // If not valid JSON, use the variable name
                        }
                        
                        return {
                            form_id: v.name.replace('form_', ''),
                            form_name: formName,
                            form_config: v.value,
                            form_config_parsed: formConfig
                        };
                    });

                    console.log('Successfully extracted forms:', existingForms);
                    console.log('Number of forms:', existingForms.length);
                    
                    formsAlreadyFetched = true;
                    formsCurrentlyFetching = false;
                    displayForms(existingForms);
                    
                    return { success: true };
                    
                } catch (error) {
                    console.error('Error fetching form configurations:', error);
                    console.error('Error stack:', error.stack);
                    
                    formsCurrentlyFetching = false;
                    displayFormsFetchError(error.message);
                    throw error;
                }
            })();
            
            return await formsFetchPromise;
        }

        function loadFieldOptions(config, allFieldConfigs, formConfig) {
            console.log(`>>> loadFieldOptions called for: ${config.field_name}`);
            const formGroup = document.querySelector(`[data-field-name="${config.field_name}"]`);
            console.log(`>>> formGroup found?`, !!formGroup);
            if (formGroup && config.type !== 'form_extend') {
                hideWaitingMessage(formGroup, config);
                showLoadingMessage(formGroup, config);
            }
            
            if (config.dependant_fields) {
                const depFields = config.dependant_fields.split(',').map(f => f.trim());
                const allDepsMet = depFields.every(depFieldName => {
                    const depField = allFieldConfigs.find(f => f.field_name === depFieldName);
                    if (!depField) return false;
                    const input = document.querySelector(`input[name="${depFieldName}"], select[name="${depFieldName}"], textarea[name="${depFieldName}"]`);
                    if (!input) return false;
                    if (input.type === 'checkbox') return input.checked;
                    if (input.type === 'radio') {
                        const checkedRadio = document.querySelector(`input[name="${depFieldName}"]:checked`);
                        return !!checkedRadio;
                    }
                    return input.value && input.value.trim() !== '';
                });
                
                if (!allDepsMet) {
                    console.log(`Dependencies not met for ${config.field_name}, skipping workflow`);
                    if (formGroup) {
                        hideLoadingMessage(formGroup, config);
                        showWaitingMessage(formGroup, config, allFieldConfigs);
                    }
                    return Promise.resolve();
                }
            }
            
            let workflowInput = { ...config.workflow_input };
            
            // Replace field references in workflow_input values
            // Supports both direct field names and [[ field_name ]] syntax
            if (config.workflow_input) {
                Object.keys(config.workflow_input).forEach(key => {
                    let value = config.workflow_input[key];
                    
                    // If value is a string, check for [[ field_name ]] tags
                    if (typeof value === 'string') {
                        // Replace [[ field_name ]] tags with actual field values
                        value = value.replace(/\[\[\s*(\w+)\s*\]\]/g, (match, fieldName) => {
                            const input = document.querySelector(`input[name="${fieldName}"], select[name="${fieldName}"], textarea[name="${fieldName}"]`);
                            if (input) {
                                let fieldValue = input.value;
                                if (input.type === 'checkbox') fieldValue = input.checked;
                                else if (input.type === 'radio') {
                                    const checkedRadio = document.querySelector(`input[name="${fieldName}"]:checked`);
                                    fieldValue = checkedRadio ? checkedRadio.value : null;
                                }
                                return fieldValue !== null && fieldValue !== undefined ? fieldValue : match;
                            }
                            return match;
                        });
                        workflowInput[key] = value;
                    } else {
                        // For non-string values, check if it matches a field name directly (backwards compatibility)
                        const fieldRef = allFieldConfigs.find(f => f.field_name === value);
                        if (fieldRef) {
                            const input = document.querySelector(`input[name="${value}"], select[name="${value}"], textarea[name="${value}"]`);
                            if (input) {
                                let fieldValue = input.value;
                                if (input.type === 'checkbox') fieldValue = input.checked;
                                else if (input.type === 'radio') {
                                    const checkedRadio = document.querySelector(`input[name="${value}"]:checked`);
                                    fieldValue = checkedRadio ? checkedRadio.value : null;
                                }
                                workflowInput[key] = fieldValue;
                            }
                        }
                    }
                });
            }
            
            // Also add all dependent field values to the payload
            if (config.dependant_fields) {
                const depFields = config.dependant_fields.split(',').map(f => f.trim());
                depFields.forEach(depFieldName => {
                    const depInput = document.querySelector(`input[name="${depFieldName}"], select[name="${depFieldName}"], textarea[name="${depFieldName}"]`);
                    if (depInput) {
                        let value = depInput.value;
                        if (depInput.type === 'checkbox') {
                            value = depInput.checked;
                        } else if (depInput.type === 'radio') {
                            const checkedRadio = document.querySelector(`input[name="${depFieldName}"]:checked`);
                            value = checkedRadio ? checkedRadio.value : null;
                        }
                        // Add the dependent field value to the payload using its field name
                        workflowInput[depFieldName] = value;
                    }
                });

            console.log(`Executing workflow ${config.workflow_id} for field ${config.field_name}`, workflowInput);
            
            // ============================================

            /**
             * Process GraphQL variables - replace [[ ]] tags
             */
            function processGraphQLDropdownVariables(variables, formData) {
                const processed = {};
                Object.keys(variables).forEach(key => {
                    let value = variables[key];
                    if (typeof value === 'string' && value.startsWith('[[') && value.endsWith(']]')) {
                        const fieldName = value.slice(2, -2).trim();
                        if (formData.hasOwnProperty(fieldName)) {
                            // Convert arrays to JSON format (Option A)
                            const fieldValue = formData[fieldName];
                            if (Array.isArray(fieldValue)) {
                                processed[key] = JSON.stringify(fieldValue);
                                console.log(`[DROPDOWN] Replaced [[ ${fieldName} ]] with JSON array:`, processed[key]);
                            } else {
                                processed[key] = fieldValue;
                                console.log(`[DROPDOWN] Replaced [[ ${fieldName} ]] with:`, processed[key]);
                            }
                        } else {
                            processed[key] = value;
                            console.warn(`[DROPDOWN] Field not found: ${fieldName}`);
                        }
                    } else {
                        processed[key] = value;
                    }
                });
                return processed;
            }
            
            /**
             * Load GraphQL dropdown options using metadata
             */
            async function loadGraphQLDropdownOptions(config, formConfig) {
                console.log(`[DROPDOWN] Loading for ${config.field_name}, operation: ${config.graphql_op}`);
                
                // Collect current form data for variable replacement
                const currentFormData = {};
                if (formConfig && formConfig.field_configs) {
                    formConfig.field_configs.forEach(fc => {
                        const inp = document.querySelector(`input[name="${fc.field_name}"], select[name="${fc.field_name}"], textarea[name="${fc.field_name}"]`);
                        if (inp) {
                            if (inp.type === 'checkbox') {
                                currentFormData[fc.field_name] = inp.checked;
                            } else if (inp.type === 'radio') {
                                const checked = document.querySelector(`input[name="${fc.field_name}"]:checked`);
                                currentFormData[fc.field_name] = checked ? checked.value : null;
                            } else {
                                currentFormData[fc.field_name] = inp.value;
                            }
                        }
                    });
                }
                
                const opMetadata = RewstLib.graphqlOperations.get(config.graphql_op);
                if (!opMetadata) {
                    throw new Error(`Unknown operation: ${config.graphql_op}`);
                }
                
                console.log(`[DROPDOWN] Metadata:`, opMetadata);
                
                // Map function path to library reference
                let libraryFn;
                if (opMetadata.function === 'RewstLib.organizations.getSubOrganizations') {
                    libraryFn = RewstLib.organizations.getSubOrganizations;
                } else if (opMetadata.function === 'RewstLib.orgVariables.get') {
                    libraryFn = RewstLib.orgVariables.get;
                } else {
                    throw new Error(`Unknown function: ${opMetadata.function}`);
                }
                
                if (!libraryFn) {
                    throw new Error(`Function unavailable: ${opMetadata.function}`);
                }
                
                // Process variables
                let vars = {};
                if (config.graphql_op_variables) {
                    vars = processGraphQLDropdownVariables(config.graphql_op_variables, currentFormData);
                    console.log(`[DROPDOWN] Processed vars:`, vars);
                } else if (config.graphql_op === 'list_orgs') {
                    vars.parentOrgId = window.ORG_ID;
                }
                
                // Call library function with appropriate parameters
                let result;
                if (config.graphql_op === 'list_orgs') {
                    result = await libraryFn(vars.parentOrgId || window.ORG_ID);
                } else if (config.graphql_op === 'get_org_var') {
                    result = await libraryFn(vars.varName, vars.orgId);
                } else {
                    throw new Error(`No mapping for: ${config.graphql_op}`);
                }
                
                console.log(`[DROPDOWN] Result:`, result);
                return result;
            }
            
            // Check if this field config has skip_cache flag
            const skipCache = config.skip_cache === true;
            const options = skipCache ? { skip_cache: true } : {};
            
            // Handle dropdown_graphql separately
            if (config.type === 'dropdown_graphql') {
                console.log(`Loading GraphQL options for ${config.field_name} using operation: ${config.graphql_op}`);
                
                // Use metadata-driven loading, passing formConfig
                const graphqlPromise = loadGraphQLDropdownOptions(config, formConfig);
                
                return graphqlPromise.then(data => {
                    console.log(`GraphQL result for ${config.field_name}:`, data);
                    if (formGroup) hideLoadingMessage(formGroup, config);
                    
                    const input = document.querySelector(`select[name="${config.field_name}"]`);
                    if (input) {
                        // Handle both array results (list_orgs) and single object results (get_org_var)
                        const itemsArray = Array.isArray(data) ? data : (data ? [data] : []);
                        
                        if (itemsArray.length > 0) {
                            input.innerHTML = `<option value="">${RewstLib.utils.getGrammaticalPhrase(config.field_displayname)}</option>`;
                            itemsArray.forEach(item => {
                                const value = item[config.value_name] || item.id;
                                const label = item[config.label_name] || item.name;
                                if (value && label) {
                                    const opt = document.createElement('option');
                                    opt.value = value;
                                    opt.textContent = label;
                                    input.appendChild(opt);
                                }
                            });
                            
                            // If multi-select, initialize the component with loaded options
                            if (config.multi_select) {
                                const msOptions = RewstLib.utils.mapResultsToOptions(itemsArray, config.value_name, config.label_name);
                                RewstLib.utils.initializeDropdownMultiSelect(config.field_name, msOptions);
                            }
                        } else {
                            // No results - show "None Found"
                            input.innerHTML = `<option value="">${RewstLib.utils.getGrammaticalPhrase(config.field_displayname, 'Select', {noResults: true})}</option>`;
                            console.log(`[DROPDOWN] No results for ${config.field_name}, showing "None Found"`);
                        }
                    }
                }).catch(error => {
                    console.error(`Error loading GraphQL options for ${config.field_name}:`, error);
                    if (formGroup) hideLoadingMessage(formGroup, config);
                    const input = document.querySelector(`select[name="${config.field_name}"]`);
                    if (input) input.innerHTML = `<option value="">-- Error loading options --</option>`;
                });
            }
            
            // Handle form_extend separately
            if (config.type === 'form_extend') {
                console.log(`[FORM_EXTEND] Loading extended config for ${config.field_name}, extend_var: ${config.extend_var}`);
                
                // Collect current form data for variable replacement
                const currentFormData = {};
                if (formConfig && formConfig.field_configs) {
                    formConfig.field_configs.forEach(fc => {
                        const inp = document.querySelector(`input[name="${fc.field_name}"], select[name="${fc.field_name}"], textarea[name="${fc.field_name}"]`);
                        if (inp) {
                            if (inp.type === 'checkbox') {
                                currentFormData[fc.field_name] = inp.checked;
                            } else if (inp.type === 'radio') {
                                const checked = document.querySelector(`input[name="${fc.field_name}"]:checked`);
                                currentFormData[fc.field_name] = checked ? checked.value : null;
                            } else {
                                currentFormData[fc.field_name] = inp.value;
                            }
                        }
                    });
                }
                
                // Process extend_var_variables with tag replacement
                let varName = config.extend_var;
                let orgId = null;
                
                if (config.extend_var_variables) {
                    // Process varName
                    if (config.extend_var_variables.varName) {
                        if (config.extend_var_variables.varName.startsWith('[[') && config.extend_var_variables.varName.endsWith(']]')) {
                            const fieldName = config.extend_var_variables.varName.slice(2, -2).trim();
                            varName = currentFormData[fieldName] || config.extend_var_variables.varName;
                        } else {
                            varName = config.extend_var_variables.varName;
                        }
                    }
                    
                    // Process orgId
                    if (config.extend_var_variables.orgId) {
                        if (config.extend_var_variables.orgId.startsWith('[[') && config.extend_var_variables.orgId.endsWith(']]')) {
                            const fieldName = config.extend_var_variables.orgId.slice(2, -2).trim();
                            orgId = currentFormData[fieldName];
                        } else {
                            orgId = config.extend_var_variables.orgId;
                        }
                    }
                    
                    console.log(`[FORM_EXTEND] Processed variables: varName=${varName}, orgId=${orgId}`);
                }
                
                // Fallback if orgId not found
                if (!orgId) {
                    const depFieldName = config.dependant_fields ? config.dependant_fields.split(',')[0].trim() : null;
                    if (depFieldName) {
                        const depFieldInput = document.querySelector(`select[name="${depFieldName}"]`);
                        orgId = depFieldInput ? depFieldInput.value : null;
                    }
                }
                
                if (!orgId) {
                    console.log(`[FORM_EXTEND] No org ID found, skipping extended config load`);
                    return Promise.resolve();
                }
                
                // Load the org variable using processed variables
                const extendPromise = RewstLib.orgVariables.get(varName, orgId);
                
                return extendPromise.then(orgVar => {
                    console.log(`[FORM_EXTEND] Retrieved org variable:`, orgVar);
                    
                    if (!orgVar || !orgVar.value) {
                        console.log(`[FORM_EXTEND] No org variable found`);
                        return;
                    }
                    
                    // Parse the extend_config from the org variable value
                    let extendConfig;
                    try {
                        const parsed = JSON.parse(orgVar.value);
                        extendConfig = parsed.extend_config;
                        console.log(`[FORM_EXTEND] Parsed extend_config:`, extendConfig);
                    } catch (e) {
                        console.error(`[FORM_EXTEND] Failed to parse org variable value:`, e);
                        return;
                    }
                    
                    if (!extendConfig || !extendConfig.field_configs || !Array.isArray(extendConfig.field_configs)) {
                        console.log(`[FORM_EXTEND] No field_configs found in extend_config`);
                        return;
                    }
                    
                    // Merge extended field configs with main form configs
                    const extendedFields = extendConfig.field_configs;
                    console.log(`[FORM_EXTEND] Found ${extendedFields.length} extended fields`);
                    
                    // Create or get the extended section container
                    const previewContent = document.getElementById('previewContent');
                    let extendedSection = document.getElementById('extendedFieldsSection');
                    
                    if (!extendedSection) {
                        extendedSection = document.createElement('div');

                        extendedSection.style.borderTop = '1px solid #ffffff';
                        extendedSection.style.paddingTop = '15px';
                        previewContent.appendChild(extendedSection);
                    }
                    
                    // Render extend_title if provided
                    if (extendConfig.extend_title) {
                        console.log(`[FORM_EXTEND] Rendering title: ${extendConfig.extend_title}`);

                        titleElement.textContent = extendConfig.extend_title;
                        titleElement.style.color = '#ffffff';

                        titleElement.style.marginTop = '0px';

                        titleElement.style.fontWeight = '600';
                        titleElement.style.textAlign = 'center';
                        extendedSection.appendChild(titleElement);
                    }
                    
                    // Render extended fields with column layout
                    // Group extended fields by column
                    const extendedColumns = {};
                    extendedFields.forEach(config => {
                        const col = config.column || 1;
                        if (!extendedColumns[col]) {
                            extendedColumns[col] = [];
                        }
                        extendedColumns[col].push(config);
                    });
                    
                    // Sort fields within each column by sequence
                    Object.keys(extendedColumns).forEach(col => {
                        extendedColumns[col].sort((a, b) => (a.sequence || 0) - (b.sequence || 0));
                    });
                    
                    // Create a wrapper div for column layout
                    const columnWrapper = document.createElement('div');
                    columnWrapper.style.display = 'flex';
                    columnWrapper.style.gap = '20px';
                    
                    // Render columns
                    const columnCount = Math.max(...Object.keys(extendedColumns).map(Number));
                    for (let i = 1; i <= columnCount; i++) {
                        const columnDiv = document.createElement('div');
                        columnDiv.style.flex = '1';
                        
                        if (extendedColumns[i]) {

                    // Set up change listeners for extended fields

                    console.error(`[FORM_EXTEND] Error loading extended config:`, error);
                });
            }
            
            // Only execute workflow for fields that are not form_extend
            if (config.type !== 'form_extend') {
                return rewst.runWorkflowSmart(config.workflow_id, workflowInput, options).then(result => {

                if (formGroup) hideLoadingMessage(formGroup, config);

        function updateDependentFields(changedFieldName, allFieldConfigs, formConfig) {
            console.log(`>>> updateDependentFields called for: ${changedFieldName}`);
            
            // Find all fields that depend on the changed field
            const dependentFields = allFieldConfigs.filter(config => 
                config.dependant_fields && config.dependant_fields.includes(changedFieldName)
            );
            
            console.log(`>>> Found ${dependentFields.length} dependent fields`);
            dependentFields.forEach(df => console.log(`    - ${df.field_name} depends on ${changedFieldName}`));
            
            // Reload options for dependent fields and clear their cache
            dependentFields.forEach(depConfig => {
                if (depConfig.workflow_id) {
                    console.log(`>>> Reloading options for dependent field ${depConfig.field_name}`);
                    
                    // Clear the cache for this dependent field's workflow
                    // This ensures fresh data will be fetched when the parent value changed
                    try {
                        if (typeof RewstLib !== 'undefined' && RewstLib.workflows && RewstLib.workflows.clearWorkflowCache) {
                            RewstLib.workflows.clearWorkflowCache(depConfig.workflow_id);
                            console.log(`>>> Cache cleared for workflow: ${depConfig.workflow_id}`);
                        } else {
                            console.log(`>>> RewstLib not available yet, skipping cache clear for: ${depConfig.workflow_id}`);
                        }
                    } catch (e) {
                        console.log(`>>> Error clearing cache: ${e.message}`);
                    }
                    
                    console.log(`>>> Calling loadFieldOptions for ${depConfig.field_name}`);
                    loadFieldOptions(depConfig, allFieldConfigs, formConfig);
                } else if (depConfig.type === 'dropdown_graphql' && depConfig.graphql_op) {
                    console.log(`>>> Reloading GraphQL options for dependent field ${depConfig.field_name}`);
                    console.log(`>>> Calling loadFieldOptions for ${depConfig.field_name}`);
                    loadFieldOptions(depConfig, allFieldConfigs, formConfig);
                } else if (depConfig.type === 'form_extend') {
                    console.log(`>>> Reloading extended form for dependent field ${depConfig.field_name}`);
                    console.log(`>>> Calling loadFieldOptions for ${depConfig.field_name}`);
                    loadFieldOptions(depConfig, allFieldConfigs, formConfig);

                    console.log(`>>> Field ${depConfig.field_name} has no workflow_id or graphql_op`);

        /**
         * Process GraphQL variables - replace [[ ]] tags
         * @param {object} variables - Variables with potential [[ ]] tags
         * @param {object} formData - Form data for field value replacement
         * @returns {object} Processed variables
         */
        function processGraphQLVariables(variables, formData) {
            const processed = {};
            Object.keys(variables).forEach(key => {
                let value = variables[key];
                
                if (typeof value === 'string') {
                    // Replace [[ submit_payload ]] with entire form data as JSON
                    if (value === '[[ submit_payload ]]') {
                        processed[key] = JSON.stringify(formData);
                        console.log('[SUBMIT] Replaced [[ submit_payload ]] with form data JSON');
                    } else if (value.startsWith('[[') && value.endsWith(']]')) {
                        // Replace [[ field_name ]] with field value
                        const fieldName = value.slice(2, -2).trim();
                        if (formData.hasOwnProperty(fieldName)) {
                            processed[key] = formData[fieldName];
                            console.log(`[SUBMIT] Replaced [[ ${fieldName} ]] with value:`, processed[key]);
                        } else {
                            processed[key] = value; // Keep original if field not found
                            console.warn(`[SUBMIT] Field not found for replacement: ${fieldName}`);
                        }
                    } else {
                        processed[key] = value;
                    }
                } else {
                    processed[key] = value;
                }
            });
            return processed;
        }

        if (submitFormBtn) {
            submitFormBtn.addEventListener('click', async () => {
                const formConfig = window.currentFormConfig;
                
                // Determine submit type

                console.log('[SUBMIT] Submit type:', submitType);
                
                // Validate configuration based on submit type
                if (submitType === 'graphql') {
                    if (!formConfig.graphql_submit || !formConfig.graphql_submit.operation) {
                        console.error('No GraphQL operation configured for this form');
                        alert('Error: No GraphQL operation configured for this form');
                        return;
                    }
                } else {
                    if (!window.currentFormWorkflowId) {
                        console.error('No workflow ID configured for this form');

                }
                
                // Collect form data using field_configs
                const formData = {};
                
                if (formConfig && formConfig.field_configs) {
                    formConfig.field_configs.forEach(config => {
                        const input = document.querySelector(`input[name="${config.field_name}"], select[name="${config.field_name}"], textarea[name="${config.field_name}"]`);
                        
                        if (input) {
                            if (input.type === 'checkbox') {
                                formData[config.field_name] = input.checked;
                            } else if (input.type === 'radio') {
                                const checkedRadio = document.querySelector(`input[name="${config.field_name}"]:checked`);
                                formData[config.field_name] = checkedRadio ? checkedRadio.value : null;
                            } else if (input.tagName === 'SELECT' && config.multi_select) {
                                // Multi-select: collect all selected values as array
                                formData[config.field_name] = Array.from(input.selectedOptions).map(opt => opt.value).filter(val => val !== '');
                            } else {
                                formData[config.field_name] = input.value;
                            }
                        }
                    });
                }
                
                // Validate required fields using RewstLib
                const validation = RewstLib.forms.validateForm(formData, formConfig.field_configs);
                
                if (!validation.isValid) {
                    const validationErrorModal = document.getElementById('validationErrorModal');
                    const validationErrorMessage = document.getElementById('validationErrorMessage');
                    const validationErrorOkBtn = document.getElementById('validationErrorOkBtn');
                    
                    const missingRequired = Object.keys(validation.errors).map(fieldName => validation.errors[fieldName][0]);
                    validationErrorMessage.innerHTML = `Required fields missing values:<br><strong>${missingRequired.join(', ')}</strong>`;
                    validationErrorModal.style.display = 'flex';
                    
                    const closeValidationModal = () => {
                        validationErrorModal.style.display = 'none';
                        validationErrorOkBtn.removeEventListener('click', closeValidationModal);
                    };
                    
                    validationErrorOkBtn.addEventListener('click', closeValidationModal);
                    
                    // Also close on outside click
                    validationErrorModal.addEventListener('click', (e) => {
                        if (e.target === validationErrorModal) {
                            closeValidationModal();
                        }
                    });
                    
                    return;
                }
                
                // Add current user to form submission
                if (REWST_USER && REWST_USER.length > 0) {

                console.log('Submitting form with data:', formData);
                console.log('Submit type:', submitType);
                
                try {
                    // Step 1: Disable form and show as submitted
                    const originalText = submitFormBtn.textContent;
                    RewstLib.utils.setButtonState(submitFormBtn, 'Submitted!', 'btn-green', true);
                    
                    // Disable all form fields
                    const inputs = document.querySelectorAll('#previewContent input, #previewContent select, #previewContent textarea');
                    inputs.forEach(input => input.disabled = true);
                    
                    console.log('Step 1 Complete: Form fields set to read-only');
                    
                    // ============================================
                    // ROUTE TO APPROPRIATE SUBMISSION METHOD
                    // ============================================
                    if (submitType === 'graphql') {
                        // GRAPHQL SUBMISSION
                        const operationName = formConfig.graphql_submit.operation;
                        console.log('[SUBMIT] Executing GraphQL operation:', operationName);
                        
                        // Get the operation function from RewstLib
                        const operationMap = {
                            'createOrUpdateOrgVariable': RewstLib.orgVariables.createOrUpdate
                        };
                        
                        const operationFn = operationMap[operationName];
                        if (!operationFn) {
                            throw new Error(`Unknown GraphQL operation: ${operationName}`);
