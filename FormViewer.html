        function getWorkflowCacheKey(workflowId, workflowInput) {
            // Create a consistent cache key by sorting object keys
            // This ensures {a:1, b:2} and {b:2, a:1} produce the same key
            const sortedInput = {};
            const keys = Object.keys(workflowInput).sort();
            keys.forEach(key => {
                sortedInput[key] = workflowInput[key];
            });
            return `${workflowId}_${JSON.stringify(sortedInput)}`;
        }
        
        function getGraphQLCacheKey(operation, variables = {}) {
            // Create a consistent cache key by sorting variable keys
            const sortedVars = {};
            const keys = Object.keys(variables).sort();
            keys.forEach(key => {
                sortedVars[key] = variables[key];
            });
            return `${operation}_${JSON.stringify(sortedVars)}`;
        }
        
        function getQueryCacheKey(query, variables = {}) {
            // Create cache key for MySQL queries
            const sortedVars = {};
            const keys = Object.keys(variables).sort();
            keys.forEach(key => {
                sortedVars[key] = variables[key];
            });
            return `query_${query}_${JSON.stringify(sortedVars)}`;
        }
        
        /**
         * Execute a data_retrieval field with dependency checking
         * Similar to loadFieldOptions but for data_retrieval type fields
         * @param {object} config - Field configuration
         * @param {array} allFieldConfigs - All field configs for dependency resolution
         * @param {object} formConfig - Form configuration
         * @returns {Promise<void>}
         */
        // Track data_retrieval fields currently executing to prevent duplicates
        const dataRetrievalExecuting = {};
        
        async function executeDataRetrievalField(config, allFieldConfigs = [], formConfig = {}) {
            // Guard: if already executing, skip
            if (dataRetrievalExecuting[config.field_name]) {
                console.log(`[DATA_RETRIEVAL] Field ${config.field_name} already executing, skipping`);
                return;
            }
            
            dataRetrievalExecuting[config.field_name] = true;
            
            try {
                const formGroup = document.querySelector(`[data-field-name="${config.field_name}"]`);
                
                if (formGroup) {
                    RewstLib.utils.hideWaitingMessage(formGroup, config);
                    RewstLib.utils.showLoadingMessage(formGroup, config);
                }
                
                // Check dependencies
                if (config.dependant_fields) {
                    const allDepsMet = RewstLib.utils.areDependenciesMet(config, allFieldConfigs);
                    
                    if (!allDepsMet) {
                        console.log(`[DATA_RETRIEVAL] Dependencies not met for ${config.field_name}`);
                        if (formGroup) {
                            RewstLib.utils.hideLoadingMessage(formGroup, config);
                            RewstLib.utils.showWaitingMessage(formGroup, config, allFieldConfigs);
                        }
                        return;
                    }
                }
                
                if (config.data_source_type !== 'mesh_powershell') {
                    throw new Error(`Unsupported data_source_type: ${config.data_source_type}`);
                }
                
                // Resolve any [[ ]] variable references in the config
                const resolvedConfig = getResolvedFieldConfig(config);
                console.log('[DATA_RETRIEVAL] Resolved config before execution:', {
                    command: resolvedConfig.command,
                    node_query: resolvedConfig.node_query
                });
                
                // Map data_source_type to appropriate API key
                const apiKeyName = config.data_source_type === 'mesh_powershell' ? 'proxy_api_meshcentral' : 'proxy_api_key';
                
                // Get proxy session token
                const sessionToken = await getProxySessionToken(apiKeyName);
                
                // Handle node selection
                let nodeId = config.node_id;
                
                if (config.node_selection_type === 'query' && resolvedConfig.node_query) {
                    // Substitute variables in node_query
                    let nodeQuery = resolvedConfig.node_query;
                    const formValues = {};
                    allFieldConfigs.forEach(fc => {
                        const input = document.querySelector(`input[name="${fc.field_name}"], select[name="${fc.field_name}"], textarea[name="${fc.field_name}"]`);
                        if (input) {
                            if (input.type === 'checkbox') {
                                formValues[fc.field_name] = input.checked;
                            } else if (input.type === 'radio') {
                                const checkedRadio = document.querySelector(`input[name="${fc.field_name}"]:checked`);
                                formValues[fc.field_name] = checkedRadio ? checkedRadio.value : null;
                            } else {
                                formValues[fc.field_name] = input.value;
                            }
                        }
                    });
                    
                    // Replace [[variable]] patterns with actual values
                    nodeQuery = nodeQuery.replace(/\[\[(\w+)\]\]/g, (match, varName) => {
                        return formValues[varName] !== undefined ? formValues[varName] : match;
                    });
                    
                    console.log('[DATA_RETRIEVAL] Executing node query:', nodeQuery);
                    
                    // Execute getNodes to find the matching node (with retry on 401)
                    const nodesResult = await getNodesWithRetry('proxy_api_meshcentral', nodeQuery, 2);
                    
                    if (!nodesResult.success) {
                        throw new Error('Failed to query nodes: ' + (nodesResult.error || 'Unknown error'));
                    }
                    
                    // Find the node - should be exactly 1
                    let foundNode = null;
                    let nodeCount = 0;
                    
                    if (nodesResult.result && typeof nodesResult.result === 'object') {
                        Object.values(nodesResult.result).forEach(meshGroup => {
                            if (Array.isArray(meshGroup)) {
                                meshGroup.forEach(node => {
                                    nodeCount++;
                                    foundNode = node;
                                });
                            }
                        });
                    }
                    
                    if (nodeCount === 0) {
                        throw new Error('Query matched 0 nodes. Please refine the query to return exactly one node.');
                    } else if (nodeCount > 1) {
                        throw new Error(`Query matched ${nodeCount} nodes. Please refine the query to return exactly one node.`);
                    }
                    
                    nodeId = foundNode._id;
                    console.log('[DATA_RETRIEVAL] Found node:', nodeId);
                }
                
                // Execute the command (with retry on 401)
                const commandType = config.command_type || 2;  // Default to PowerShell (2) if not specified
                const commandResult = await executeCommandWithRetryLogic('proxy_api_meshcentral', nodeId, resolvedConfig.command, commandType, 2);
                
                // Parse result
                let resultData = commandResult.result;
                console.log('[DATA_RETRIEVAL] Raw command result:', typeof resultData, resultData?.substring ? resultData.substring(0, 100) : resultData);
                
                if (typeof resultData === 'object' && resultData !== null && resultData.result) {
                    resultData = resultData.result;
                }
                
                if (typeof resultData === 'string') {
                    try {
                        console.log('[DATA_RETRIEVAL] Attempting to parse string result as JSON');
                        resultData = JSON.parse(resultData);
                        console.log('[DATA_RETRIEVAL] Successfully parsed JSON result');
                    } catch (parseError) {
                        console.error('[DATA_RETRIEVAL] Failed to parse result as JSON:', parseError.message);
                        console.error('[DATA_RETRIEVAL] Raw result that failed to parse:', resultData.substring(0, 500));
                        throw new Error(`Command returned non-JSON result: ${parseError.message}`);
                    }
                }
                
                // Cache the result
                proxyCache.dataRetrievalResults[config.field_name] = resultData;
                console.log('[DATA_RETRIEVAL] Cached result for:', config.field_name, resultData);
                
                if (formGroup) {
                    RewstLib.utils.hideLoadingMessage(formGroup, config);
                    // Hide the entire form-group for data_retrieval fields (they have no UI, just cache data)
                    formGroup.style.display = 'none';
                }
                
                // Reload dependent dropdown_prefetch fields
                console.log(`[DATA_RETRIEVAL] Looking for prefetch fields that depend on ${config.field_name}`);
                allFieldConfigs.forEach(fc => {
                    const sourceElementName = fc.source_element_name || fc.source_element_uid;
                    console.log(`[DATA_RETRIEVAL] Checking field ${fc.field_name}: type=${fc.type}, source_element_name=${sourceElementName}`);
                    if (fc.type === 'dropdown_prefetch' && sourceElementName === config.field_name) {
                        console.log(`[DATA_RETRIEVAL] Reloading prefetch field: ${fc.field_name}`);
                        loadFieldOptions(fc, allFieldConfigs, formConfig);
                        
                        // Update refresh button state now that source data is available
                        updateRefreshButtonState(fc.field_name, fc, allFieldConfigs);
                    }
                });
                
            } catch (error) {
                console.error('[DATA_RETRIEVAL] Error executing', config.field_name, ':', error);
                proxyCache.dataRetrievalResults[config.field_name] = { error: error.message };
                
                const formGroup = document.querySelector(`[data-field-name="${config.field_name}"]`);
                if (formGroup) {
                    RewstLib.utils.hideLoadingMessage(formGroup, config);
                    // Hide the form-group even on error
                    formGroup.style.display = 'none';
                }
                
                // Update button states for dependent prefetch fields (will be disabled due to failed dependency)
                allFieldConfigs.forEach(fc => {
                    const sourceElementName = fc.source_element_name || fc.source_element_uid;
                    if (fc.type === 'dropdown_prefetch' && sourceElementName === config.field_name) {
                        updateRefreshButtonState(fc.field_name, fc, allFieldConfigs);
                    }
                });
            } finally {
                dataRetrievalExecuting[config.field_name] = false;
            }
        }
        
        /**
         * Get or create proxy session token for current user
         * Caches token so we only authenticate once per session per key
         * @param {string} keyName - Org variable name for API key (e.g., 'proxy_api_mysql', 'proxy_api_meshcentral')
         */
        async function getProxySessionToken(keyName = 'proxy_api_key') {
            try {
                if (!REWST_USER) {
                    throw new Error('REWST_USER not available');
                }
                
                const cacheKey = `${REWST_USER}_${keyName}`;
                
                // Check if we already have a cached token for this key
                if (proxyCache.sessionTokens[cacheKey]) {
                    console.log('[PROXY] Using cached session token for:', REWST_USER, 'with key:', keyName);
                    return proxyCache.sessionTokens[cacheKey];
                }
                
                // Get API key and authenticate
                console.log('[PROXY] Authenticating with ProxyLib for:', REWST_USER, 'using key:', keyName);
                const authResult = await ProxyLib.authenticate(REWST_USER, window.location.origin, {
                    keyName: keyName
                });
                
                // Cache the session token
                proxyCache.sessionTokens[cacheKey] = authResult.sessionToken;
                console.log('[PROXY] Session token obtained and cached for key:', keyName);
                
                return authResult.sessionToken;
            } catch (error) {
                console.error('[PROXY] Failed to get session token:', error);
                throw error;
            }
        }
        
        /**
         * Execute command with automatic single retry on failure
         * Uses ProxyLib.executeCommand internally
         */
        async function executeCommandWithRetry(sessionToken, user, nodeId, command, commandType = 1) {
            return await ProxyLib.executeCommand(sessionToken, user, nodeId, command, commandType);
        }
        
        async function getOrExecuteWorkflow(config, workflowInput, allFieldConfigs = [], formConfig = {}) {
            // Only apply caching to workflows (not GraphQL)
            if (config.type === 'dropdown_graphql') {
                return loadFieldOptions(config, allFieldConfigs, formConfig);
            }
            
            if (!config.workflow_id) {
                return loadFieldOptions(config, allFieldConfigs, formConfig);
            }
            
            const cacheKey = getWorkflowCacheKey(config.workflow_id, workflowInput);
            console.log(`[WORKFLOW CACHE] Cache key for ${config.field_name}: ${cacheKey}`);
            console.log(`[WORKFLOW CACHE] Payload for ${config.field_name}:`, JSON.stringify(workflowInput));
            
            // Skip cache if explicitly requested (e.g., refresh button)
            if (config.skip_cache) {
                console.log(`[WORKFLOW CACHE] Skipping cache for ${config.field_name} (skip_cache=true)`);
            } else {
                // Check if results are already cached
                if (workflowCache.results[cacheKey]) {
                    console.log(`[WORKFLOW CACHE] Found cached results for ${config.field_name}, using cache`);
                    // Use cached results directly
                    const cachedData = workflowCache.results[cacheKey];
                    return populateFieldFromCachedResults(config, cachedData, cacheKey);
                }
                
                // Check if this workflow is currently executing (in-flight)
                if (workflowCache.inFlight[cacheKey]) {
                    console.log(`[WORKFLOW CACHE] Workflow for ${config.field_name} is in-flight, waiting... (key: ${cacheKey})`);
                    // Wait for the in-flight promise to complete
                    try {
                        const cachedData = await workflowCache.inFlight[cacheKey];
                        console.log(`[WORKFLOW CACHE] In-flight workflow completed for ${config.field_name}, using results`);
                        return populateFieldFromCachedResults(config, cachedData, cacheKey);
                    } catch (error) {
                        console.error(`[WORKFLOW CACHE] In-flight workflow failed for ${config.field_name}:`, error);
                        throw error;
                    }
                }
            }
            
            // Workflow not cached and not in-flight, execute it
            console.log(`[WORKFLOW CACHE] Executing workflow for ${config.field_name} with cache key: ${cacheKey}`);
            
            // Create a promise for this workflow execution and store it as in-flight
            const executionPromise = (async () => {
                try {
                    const result = await RewstLib.workflows.execute(config.workflow_id, workflowInput, { skip_cache: true });
                    const options = result.conductor?.output?.options || [];
                    const fullOutput = result.conductor?.output || {};
                    
                    // Cache the results - store BOTH options and full output
                    workflowCache.results[cacheKey] = {
                        options: options,
                        output: fullOutput,
                        conductor: result.conductor
                    };
                    
                    // Store metadata about this dropdown's data source
                    dropdownSourceMetadata[config.field_name] = {
                        cacheType: 'workflow',
                        cacheKey: cacheKey,
                        valueName: config.value_name || 'id',
                        labelName: config.label_name || 'name',
                        data: options
                    };
                    
                    console.log(`[WORKFLOW CACHE] Cached results for ${config.field_name} (${options.length} options)`, { fullOutput });
                    
                    return workflowCache.results[cacheKey];
                } catch (error) {
                    // Don't cache errors, remove from in-flight so retry can happen
                    delete workflowCache.inFlight[cacheKey];
                    throw error;
                }
            })();
            
            workflowCache.inFlight[cacheKey] = executionPromise;
            
            try {
                const cachedData = await executionPromise;
                return populateFieldFromCachedResults(config, cachedData, cacheKey);
            } finally {
                // Remove from in-flight after completion
                delete workflowCache.inFlight[cacheKey];
            }
        }
        
        function populateFieldFromCachedResults(config, cachedData, cacheKey) {
            const formGroup = document.querySelector(`[data-field-name="${config.field_name}"]`);
            const input = document.querySelector(`select[name="${config.field_name}"]`);
            
            if (!input) return;
            
            const options = cachedData.options || [];
            
            // Store metadata about this dropdown's data source
            dropdownSourceMetadata[config.field_name] = {
                cacheType: 'workflow',
                cacheKey: cacheKey,  // Use the actual cacheKey that was used to store results
                valueName: config.value_name || 'id',
                labelName: config.label_name || 'name',
                data: options
            };
            
            if (options.length > 0) {
                if (config.multi_select) {
                    const msOptions = RewstLib.utils.mapResultsToOptions(options, config.value_name, config.label_name);
                    RewstLib.utils.initializeDropdownMultiSelect(config.field_name, msOptions);
                } else {
                    input.innerHTML = `<option value="">${RewstLib.utils.getGrammaticalPhrase(config.field_displayname)}</option>`;
                    options.forEach(option => {
                        const value = option[config.value_name] || option.id || option.Id;
                        const label = option[config.label_name] || option.name || option.Name;
                        if (value && label) {
                            const opt = document.createElement('option');
                            opt.value = value;
                            opt.textContent = label;
                            input.appendChild(opt);
                        }
                    });
                }
            } else {
                input.innerHTML = `<option value="">${RewstLib.utils.getGrammaticalPhrase(config.field_displayname, 'Select', {noResults: true})}</option>`;
            }
            
            if (formGroup) {
                RewstLib.utils.hideLoadingMessage(formGroup, config);
            }
        }

        /**
         * Process GraphQL variables - replace [[ ]] tags
         * @param {object} variables - Variables with potential [[ ]] tags
         * @param {object} formData - Form data for field value replacement
         * @returns {object} Processed variables
         */
        function processGraphQLVariables(variables, formData) {
            const processed = {};
            Object.keys(variables).forEach(key => {
                let value = variables[key];
                
                if (typeof value === 'string') {
                    // Replace [[ submit_payload ]] with entire form data as JSON
                    if (value === '[[ submit_payload ]]') {
                        processed[key] = JSON.stringify(formData);
                        console.log('[SUBMIT] Replaced [[ submit_payload ]] with form data JSON');
                    } else if (value.startsWith('[[') && value.endsWith(']]')) {
                        // Replace [[ field_name ]] with field value
                        const fieldName = value.slice(2, -2).trim();
                        if (formData.hasOwnProperty(fieldName)) {
                            processed[key] = formData[fieldName];
                            console.log(`[SUBMIT] Replaced [[ ${fieldName} ]] with value:`, processed[key]);
                        } else {
                            processed[key] = value; // Keep original if field not found
                            console.warn(`[SUBMIT] Field not found for replacement: ${fieldName}`);
                        }
                    } else {
                        processed[key] = value;
                    }
                } else {
                    processed[key] = value;
                }
            });
            return processed;
        }

                                    console.log(`[SUBMIT DEBUG] Processing instance ${instanceIndex}`);
                                    
                                    // Handle array items which are now an array instead of an object
                                    const itemsArray = Array.isArray(config.items) ? config.items : [];
                                    
                                    itemsArray.forEach(itemConfig => {
                                        const fieldName = itemConfig.name;
                                        const fieldId = `${config.field_name}_${fieldName}_${instanceIndex}`;
                                        
                                        // Look for any field type (input, select, textarea) using the ID
                                        const field = instance.querySelector(`#${fieldId}`);
                                        console.log(`[SUBMIT DEBUG] Looking for field #${fieldId} (type: ${itemConfig.type}), found:`, !!field);
                                        
                                        if (field) {
                                            let value = '';
                                            if (field.tagName === 'SELECT') {
                                                value = field.value;
                                            } else if (field.tagName === 'INPUT') {
                                                if (field.type === 'checkbox') {
                                                    value = field.checked;
                                                } else if (field.type === 'radio') {
                                                    value = field.checked ? field.value : '';
                                                } else {
                                                    value = field.value;
                                                }
                                            } else if (field.tagName === 'TEXTAREA') {
                                                value = field.value;
                                            }
                                            
                                            instanceData[fieldName] = value;
                                            console.log(`[SUBMIT DEBUG] Field ${fieldName} = ${value}`);
                                        }
                                    });
                                    
                                    // Check if at least one field has a value
                                    const hasAtLeastOneValue = Object.values(instanceData).some(value => {
                                        if (typeof value === 'string') {
                                            return value && value.trim() !== '';
                                        }
                                        return value !== '' && value !== false;
                                    });
                                    
                                    if (hasAtLeastOneValue) {
                                        instances.push(instanceData);
                                        console.log(`[SUBMIT DEBUG] Instance ${instanceIndex} has values, including in payload`);
                                    } else {
                                        console.log(`[SUBMIT DEBUG] Instance ${instanceIndex} is empty, excluding from payload`);
                                    }
                                });
                                
                                formData[config.field_name] = instances;
                                console.log(`[SUBMIT] Array field ${config.field_name}: ${instances.length} instances`, instances);
                            } else {
                                console.warn(`[SUBMIT] No array container found for field: ${config.field_name}`);
                            }
                            return; // Skip the normal input lookup for array types
                        }
                        
                        const input = document.querySelector(`input[name="${config.field_name}"], select[name="${config.field_name}"], textarea[name="${config.field_name}"]`);
                        
                        if (input) {
                            if (input.type === 'checkbox') {
                                formData[config.field_name] = input.checked;
                            } else if (input.type === 'radio') {
                                const checkedRadio = document.querySelector(`input[name="${config.field_name}"]:checked`);
                                formData[config.field_name] = checkedRadio ? checkedRadio.value : null;
                            } else if (input.tagName === 'SELECT' && config.multi_select) {
                                // Multi-select: read from data-selected-values attribute
                                const dataAttr = input.getAttribute('data-selected-values');
                                const selectedValues = dataAttr ? JSON.parse(dataAttr) : [];
                                formData[config.field_name] = selectedValues;
                                console.log(`[SUBMIT] Multi-select ${config.field_name}: ${selectedValues.length} items selected`, selectedValues);
                            } else {
                                formData[config.field_name] = input.value;
                            }
                        }
                    });
                }
                
                // Also collect from extended fields (from form_extend)
                // Find all form-groups that are NOT in the main config (these are extended fields)
                const baseFieldNames = new Set(formConfig && formConfig.field_configs ? formConfig.field_configs.map(f => f.field_name) : []);
                const arrayInstancePattern = /_\w+_\d+$/; // Pattern for array instance fields (e.g., m365_errors_client_0)
                
                document.querySelectorAll('[data-field-name]').forEach(formGroup => {
                    const fieldName = formGroup.getAttribute('data-field-name');
                    
                    // Skip array instance fields and hidden fields
                    if (arrayInstancePattern.test(fieldName)) {
                        console.log(`[SUBMIT] Skipping array instance field: ${fieldName}`);
                        return;
                    }
                    
                    if (formGroup.offsetParent === null || window.getComputedStyle(formGroup).display === 'none') {
                        console.log(`[SUBMIT] Skipping hidden field: ${fieldName}`);
                        return;
                    }
                    
                    if (!baseFieldNames.has(fieldName) && !formData.hasOwnProperty(fieldName)) {
                        const input = formGroup.querySelector('input[type="text"], input[type="email"], input[type="date"], input[type="datetime-local"], select, textarea');
                        const checkboxInput = formGroup.querySelector('input[type="checkbox"]');
                        const radioInput = formGroup.querySelector('input[type="radio"]');
                        
                        if (checkboxInput) {
                            formData[fieldName] = checkboxInput.checked;
                        } else if (radioInput) {
                            const checkedRadio = formGroup.querySelector('input[type="radio"]:checked');
                            formData[fieldName] = checkedRadio ? checkedRadio.value : null;
                        } else if (input && input.tagName === 'SELECT') {
                            // Could be multi-select - check for data-selected-values attribute
                            const dataAttr = input.getAttribute('data-selected-values');
                            if (dataAttr) {
                                const selectedValues = JSON.parse(dataAttr);
                                formData[fieldName] = selectedValues;
                                if (selectedValues.length > 0) {
                                    console.log(`[SUBMIT] Extended multi-select ${fieldName}: ${selectedValues.length} items selected`, selectedValues);
                                }
                            } else {
                                // Fallback to selectedOptions for regular selects
                                const selectedValues = Array.from(input.selectedOptions).map(opt => opt.value).filter(val => val !== '');
                                formData[fieldName] = selectedValues;
                            }
                        } else if (input) {
                            formData[fieldName] = input.value;
                        }
                    }
                });
                
                // Prepare all field configs (main + extended) for validation
                let allFieldConfigs = formConfig.field_configs || [];
                
                // Find extended field configs from the DOM (if they exist in data attributes)
                const extendedFieldConfigs = [];
                document.querySelectorAll('[data-field-name]').forEach(formGroup => {
                    const fieldName = formGroup.getAttribute('data-field-name');
                    
                    // Skip array instance fields
                    if (arrayInstancePattern.test(fieldName)) {
                        return;
                    }
                    
                    // Skip hidden fields
                    if (formGroup.offsetParent === null || window.getComputedStyle(formGroup).display === 'none') {
                        return;
                    }
                    
                    if (!baseFieldNames.has(fieldName)) {
                        // This is an extended field - check if it's required by looking for required indicators
                        const label = formGroup.querySelector('label');
                        const isRequired = label && label.textContent.includes('Required');
                        if (isRequired || formGroup.querySelector('input, select, textarea')) {
                            extendedFieldConfigs.push({
                                field_name: fieldName,
                                field_displayname: label ? label.textContent.replace(/ - Required.*/, '').trim() : fieldName,
                                required: isRequired
                            });
                        }
                    }
                });
                
                allFieldConfigs = [...allFieldConfigs, ...extendedFieldConfigs];
                
                // Validate required fields using RewstLib
                const validation = RewstLib.forms.validateForm(formData, allFieldConfigs);
                
                if (!validation.isValid) {
                    const validationErrorModal = document.getElementById('validationErrorModal');
                    const validationErrorMessage = document.getElementById('validationErrorMessage');
                    const validationErrorOkBtn = document.getElementById('validationErrorOkBtn');
                    
                    const missingRequired = Object.keys(validation.errors).map(fieldName => validation.errors[fieldName][0]);
                    validationErrorMessage.innerHTML = `Required fields missing values:<br><strong>${missingRequired.join(', ')}</strong>`;
                    validationErrorModal.style.display = 'flex';
                    
                    const closeValidationModal = () => {
                        validationErrorModal.style.display = 'none';
                        validationErrorOkBtn.removeEventListener('click', closeValidationModal);
                    };
                    
                    validationErrorOkBtn.addEventListener('click', closeValidationModal);
                    
                    // Also close on outside click
                    validationErrorModal.addEventListener('click', (e) => {
                        if (e.target === validationErrorModal) {
                            closeValidationModal();
                        }
                    });
                    
                    return;
                }
                
                // Add current user to form submission
                if (REWST_USER && REWST_USER.length > 0) {
                    formData.rewst_user = REWST_USER;
                    console.log('Added rewst_user to payload:', REWST_USER);
                } else {
                    console.warn('No rewst_user available - CTX.user.username not set by Rewst');
                }
                
                console.log('Submitting form with data:', formData);
                console.log('Submit type:', submitType);
                
                try {
                    // Step 1: Disable form and show as submitted
                    const originalText = submitFormBtn.textContent;
                    RewstLib.utils.setButtonState(submitFormBtn, 'Submitted!', 'btn-green', true);
                    
                    // Disable all form fields
                    const inputs = document.querySelectorAll('#previewContent input, #previewContent select, #previewContent textarea');
                    inputs.forEach(input => input.disabled = true);
                    
                    console.log('Step 1 Complete: Form fields set to read-only');
                    
                    // ============================================
                    // ROUTE TO APPROPRIATE SUBMISSION METHOD
                    // ============================================
                    if (submitType === 'graphql') {
                        // GRAPHQL SUBMISSION
                        const operationName = formConfig.graphql_submit.operation;
                        console.log('[SUBMIT] Executing GraphQL operation:', operationName);
                        
                        // Get the operation function from RewstLib
                        const operationMap = {
                            'createOrUpdateOrgVariable': RewstLib.orgVariables.createOrUpdate
                        };
                        
                        const operationFn = operationMap[operationName];
                        if (!operationFn) {
                            throw new Error(`Unknown GraphQL operation: ${operationName}`);
                        }
                        
                        // Process variables with tag replacement
                        const processedVars = processGraphQLVariables(formConfig.graphql_submit.variables, formData);
                        console.log('[SUBMIT] Processed GraphQL variables:', processedVars);
                        
                        // Call the operation function
                        // Map the processed variables to function parameters
                        let result;
                        if (operationName === 'createOrUpdateOrgVariable') {
                            result = await operationFn(
                                processedVars.varName,
                                processedVars.varValue,
                                { org_id: processedVars.orgId }
                            );
                        }
                        
                        console.log('[SUBMIT] GraphQL operation completed:', result);
                        
                        // Show success message
                        const completionStatus = document.getElementById('workflowCompletionStatus');
                        completionStatus.style.display = 'block';
                        completionStatus.textContent = '✓ Org Variable Created/Updated';
                        completionStatus.style.background = '#d4edda';
                        completionStatus.style.borderColor = '#c3e6cb';
                        completionStatus.style.color = '#155724';
                        
                        console.log('[SUBMIT] GraphQL submission complete');
                        
                    } else {
                        // WORKFLOW SUBMISSION (original logic)
                        console.log('[SUBMIT] Executing workflow submission');
                        
                        // Step 2: Execute workflow and fetch details
                        const workflowId = window.currentFormWorkflowId;
                        const result = await rewst.startWorkflowExecution(workflowId, formData);
                        window.currentExecutionId = result.executionId;
                        console.log('Step 2a Complete: Execution ID:', window.currentExecutionId);
                        
                        // Wait 1 second before fetching workflow details
                        await new Promise(resolve => setTimeout(resolve, 1000));
                        
                        // Fetch workflow details after delay
                        try {
                            window.currentWorkflowDetails = await rewst.getWorkflowDetails(workflowId);
                            console.log('Step 2b Complete: Got workflow details');
                        } catch (detailsError) {
                            console.error('Could not fetch workflow details:', detailsError);
                            window.currentWorkflowDetails = null;
                        }
                        
                        // Step 3: Show "Workflow Executing" message
                        const executingBox = document.getElementById('workflowExecutingBox');
                        executingBox.style.display = 'block';
                        
                        const executingBoxClickHandler = () => {
                            console.log('Executing box clicked, showing modal');
                            showExecutionModal(window.currentExecutionId, false);
                        };
                        executingBox.addEventListener('click', executingBoxClickHandler);
                        console.log('Step 3 Complete: Workflow Executing message displayed');
                        
                        // Step 4: Poll execution status
                        const completionStatus = document.getElementById('workflowCompletionStatus');
                        const pollInterval = setInterval(async () => {
                            try {
                                window.currentFinalExecutionStatus = await rewst.getExecutionStatus(window.currentExecutionId);
                                console.log('Poll: Current status:', window.currentFinalExecutionStatus.status);
                                
                                const terminalStates = ['COMPLETED', 'SUCCESS', 'succeeded', 'FAILED', 'failed', 'ERROR'];
                                const isComplete = terminalStates.some(s => 
                                    window.currentFinalExecutionStatus.status?.toUpperCase() === s.toUpperCase()
                                );
                                
                                if (isComplete) {
                                    console.log('Workflow complete:', window.currentFinalExecutionStatus.status);
                                    clearInterval(pollInterval);
                                    
                                    // Hide executing, show completion
                                    executingBox.style.display = 'none';
                                    executingBox.removeEventListener('click', executingBoxClickHandler);
                                    
                                    // Check if workflow failed
                                    const failedStates = ['FAILED', 'failed', 'ERROR'];
                                    const isFailed = failedStates.some(s => 
                                        window.currentFinalExecutionStatus.status?.toUpperCase() === s.toUpperCase()
                                    );
                                    
                                    // Update completion status with appropriate message and styling
                                    completionStatus.style.display = 'block';
                                    if (isFailed) {
                                        completionStatus.textContent = '✗ Workflow Failed';
                                        completionStatus.style.background = '#f8d7da';
                                        completionStatus.style.borderColor = '#f5c6cb';
                                        completionStatus.style.color = '#721c24';
                                    } else {
                                        completionStatus.textContent = '✓ Workflow Completed';
                                        completionStatus.style.background = '#d4edda';
                                        completionStatus.style.borderColor = '#c3e6cb';
                                        completionStatus.style.color = '#155724';
                                    }
                                    
                                    const completionClickHandler = () => {
                                        console.log('Completion status clicked, showing modal');
                                        showExecutionModal(window.currentExecutionId, true);
                                    };
                                    completionStatus.addEventListener('click', completionClickHandler);
                                    
                                    // Update modal if it's currently open
                                    const modal = document.getElementById('executionModal');
                                    if (modal && modal.classList.contains('active')) {
                                        showExecutionModal(window.currentExecutionId, true);
                                    }
                                    
                                    console.log('Step 4 Complete: Workflow completed');
                                
                                // Flush/reset the form after successful completion
                                setTimeout(() => {
                                    const inputs = document.querySelectorAll('#previewContent input, #previewContent select, #previewContent textarea');
                                    inputs.forEach(input => {
                                        input.disabled = false; // Re-enable fields
                                        if (input.type === 'checkbox' || input.type === 'radio') {
                                            input.checked = false;
                                        } else {
                                            input.value = '';
                                        }
                                    });
                                    
                                    // Reset button state
                                    RewstLib.utils.setButtonState(submitFormBtn, 'Submit', 'btn-blue', false);
                                    
                                    console.log('Form flushed and ready for new submission');
                                }, 1000); // Wait 1 second before resetting
                            }
                        } catch (error) {
                            console.error('Poll error:', error);
                        }
                    }, 2000); // Check every 2 seconds
                    } // END WORKFLOW SUBMISSION
                    
                } catch (error) {
                    console.error('Submission Error:', error);
                    
                    RewstLib.utils.setButtonState(submitFormBtn, 'Error - Try Again', 'btn-red', false);
                    
                    // Re-enable form fields
                    const inputs = document.querySelectorAll('#previewContent input, #previewContent select, #previewContent textarea');
                    inputs.forEach(input => input.disabled = false);
                    
                    setTimeout(() => {
                        RewstLib.utils.setButtonState(submitFormBtn, 'Submit', 'btn-blue');
                    }, 3000);
                }
            });
        }
        
        // ============================================
        // EXECUTION MODAL FUNCTIONS
        // ============================================
        function showExecutionModal(executionId, isCompleted = false) {
            const modal = document.getElementById('executionModal');
            const modalContent = document.getElementById('modalContent');
            
            console.log('showExecutionModal called with executionId:', executionId, 'isCompleted:', isCompleted);
            console.log('Modal element found:', !!modal);
            console.log('Modal current classes:', modal?.className);
            
            // Clear any existing polling interval
            if (window.currentModalPollInterval) {
                clearInterval(window.currentModalPollInterval);
                window.currentModalPollInterval = null;
            }
            
            function updateModal() {
                console.log('updateModal called');
                rewst.getExecutionStatus(executionId).then(execution => {
                    console.log('Got execution status:', execution.status);
                    // Fetch detailed task logs
                    return rewst.getDetailedTaskLogs(executionId).then(detailedLogs => {
                        // Create set of executed task IDs
                        const executedTaskIds = new Set();
                        const taskFirstExecutionTime = {};
                        
                        detailedLogs.forEach(log => {
                            if (log.workflowTaskId) {
                                executedTaskIds.add(log.workflowTaskId);
                                if (!taskFirstExecutionTime[log.workflowTaskId]) {
                                    taskFirstExecutionTime[log.workflowTaskId] = log.createdAt;
                                }
                            }
                        });
                        
                        // Create a sorted copy of only executed workflow tasks
                        let sortedTasks = [];
                        if (window.currentWorkflowDetails && window.currentWorkflowDetails.tasks) {
                            sortedTasks = window.currentWorkflowDetails.tasks
                                .filter(task => executedTaskIds.has(task.id))
                                .sort((a, b) => {
                                    const timeA = taskFirstExecutionTime[a.id] || Number.MAX_VALUE;
                                    const timeB = taskFirstExecutionTime[b.id] || Number.MAX_VALUE;
                                    return timeA - timeB;
                                });
                        }
                        
                        // Create map of workflow task ID to latest task log status
                        const taskStatusMap = {};
                        detailedLogs.forEach(log => {
                            if (log.workflowTaskId) {
                                taskStatusMap[log.workflowTaskId] = log.status;
                            }
                        });
                        
                        let workflowTasksHtml = 'No tasks executed';
                        if (sortedTasks && sortedTasks.length > 0) {
                            workflowTasksHtml = sortedTasks.map(task => {
                                let statusIcon = '';
                                
                                if (taskStatusMap[task.id]) {
                                    const status = taskStatusMap[task.id];
                                    // Add icon based on status
                                    if (status.toLowerCase() === 'succeeded') {
                                        statusIcon = '<span style="color: #28a745; margin-right: 8px; font-weight: bold;">✓</span>';
                                    } else if (status.toLowerCase() === 'failed') {
                                        statusIcon = '<span style="color: #dc3545; margin-right: 8px; font-weight: bold;">✗</span>';
                                    } else {
                                        // Show spinner for running status
                                        statusIcon = '<span style="display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #ffffff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle;"></span>';
                                    }
                                }
                                return `<div style="padding: 6px 0;">${statusIcon}${formatTaskName(task.name)}</div>`;
                            }).join('');
                        }

                        let html = `
                            <div class="modal-status">
                                <span style="display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #ffffff; border-radius: 50%; animation: spin 0.8s linear infinite;"></span>
                                Running...
                            </div>
                            <div class="modal-section">
                                <div class="modal-label">Workflow Tasks</div>
                                <div>${workflowTasksHtml}</div>
                            </div>
                        `;
                        modalContent.innerHTML = html;
                    });
                }).catch(error => {
                    modalContent.innerHTML = `<pre style="color: #ff6b6b;">Error loading execution details:\n${error.message}</pre>`;
                });
            }

            // If completed and we have final status, show that instead of polling
            if (isCompleted && window.currentFinalExecutionStatus) {
                // Fetch detailed task logs
                rewst.getDetailedTaskLogs(executionId).then(detailedLogs => {
                    // Create set of executed task IDs
                    const executedTaskIds = new Set();
                    const taskFirstExecutionTime = {};
                    
                    detailedLogs.forEach(log => {
                        if (log.workflowTaskId) {
                            executedTaskIds.add(log.workflowTaskId);
                            if (!taskFirstExecutionTime[log.workflowTaskId]) {
                                taskFirstExecutionTime[log.workflowTaskId] = log.createdAt;
                            }
                        }
                    });
                    
                    // Create a sorted copy of only executed workflow tasks
                    let sortedTasks = [];
                    if (window.currentWorkflowDetails && window.currentWorkflowDetails.tasks) {
                        sortedTasks = window.currentWorkflowDetails.tasks
                            .filter(task => executedTaskIds.has(task.id))
                            .sort((a, b) => {
                                const timeA = taskFirstExecutionTime[a.id] || Number.MAX_VALUE;
                                const timeB = taskFirstExecutionTime[b.id] || Number.MAX_VALUE;
                                return timeA - timeB;
                            });
                    }
                    
                    // Create map of workflow task ID to latest task log status
                    const taskStatusMap = {};
                    detailedLogs.forEach(log => {
                        if (log.workflowTaskId) {
                            taskStatusMap[log.workflowTaskId] = log.status;
                        }
                    });
                    
                    let workflowTasksHtml = 'No tasks executed';
                    if (sortedTasks && sortedTasks.length > 0) {
                        workflowTasksHtml = sortedTasks.map(task => {
                            let statusIcon = '';
                            
                            if (taskStatusMap[task.id]) {
                                const status = taskStatusMap[task.id];
                                // Add icon based on status
                                if (status.toLowerCase() === 'succeeded') {
                                    statusIcon = '<span style="color: #28a745; margin-right: 8px; font-weight: bold;">✓</span>';
                                } else if (status.toLowerCase() === 'failed') {
                                    statusIcon = '<span style="color: #dc3545; margin-right: 8px; font-weight: bold;">✗</span>';
                                } else {
                                    // Show spinner for running status
                                    statusIcon = '<span style="display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #ffffff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle;"></span>';
                                }
                            }
                            return `<div style="padding: 6px 0;">${statusIcon}${formatTaskName(task.name)}</div>`;
                        }).join('');
                    }

                    let html = `
                        <div class="modal-status" style="${window.currentFinalExecutionStatus.status === 'succeeded' ? 'color: #28a745;' : 'color: #dc3545;'}">
                            ${window.currentFinalExecutionStatus.status === 'succeeded' ? '✓ Completed' : '✗ Failed'}
                        </div>
                        <div class="modal-section">
                            <div class="modal-label">Workflow Tasks</div>
                            <div>${workflowTasksHtml}</div>
                        </div>
                    `;
                    
                    // If form config has output_var defined, display the workflow result
                    if (window.currentFormConfig && window.currentFormConfig.output_var && window.currentFinalExecutionStatus.conductor?.output) {
                        const output = window.currentFinalExecutionStatus.conductor.output;
                        const outputVarName = window.currentFormConfig.output_var;
                        const outputValue = output[outputVarName];
                        
                        if (outputValue !== undefined && outputValue !== null) {
                            const displayValue = typeof outputValue === 'string' ? outputValue : JSON.stringify(outputValue, null, 2);
                            const outputHtml = `
                                <div class="modal-section">
                                    <div class="modal-label">Workflow Result:</div>
                                    <pre style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: 4px; max-height: 200px; overflow-y: auto; font-size: 12px; white-space: pre-wrap; word-wrap: break-word;">${escapeHtml(displayValue)}</pre>
                                </div>
                            `;
                            html += outputHtml;
                        }
                    }
                    
                    modalContent.innerHTML = html;
                }).catch(error => {
                    modalContent.innerHTML = `<pre style="color: #ff6b6b;">Error loading task logs:\n${error.message}</pre>`;
                });
            } else {
                // Initial load for executing modal
                updateModal();
            }

            // Poll every 5 seconds if not completed
            if (!isCompleted) {
                window.currentModalPollInterval = setInterval(updateModal, 5000);
            }

            // Show modal
            console.log('Adding active class to modal, current display:', window.getComputedStyle(modal).display);
            modal.classList.add('active');
            modal.style.display = 'flex';  // Directly set display to ensure it shows
            console.log('Active class added, new classes:', modal.className);
            console.log('New computed display:', window.getComputedStyle(modal).display);

            // Close button handler
            const closeBtn = document.getElementById('modalCloseBtn');
            
            const overlayClickHandler = (e) => {
                if (e.target === modal) {
                    closeHandler();
                }
            };

            const closeHandler = () => {
                console.log('Closing modal, removing active class');
                modal.classList.remove('active');
                modal.style.display = 'none';  // Directly set display to ensure it hides
                if (window.currentModalPollInterval) {
                    clearInterval(window.currentModalPollInterval);
                    window.currentModalPollInterval = null;
                }
                closeBtn.removeEventListener('click', closeHandler);
                modal.removeEventListener('click', overlayClickHandler);
            };

            closeBtn.addEventListener('click', closeHandler);
            modal.addEventListener('click', overlayClickHandler);
        }
        
        
        // ============================================
        // LIBRARY DEPENDENCY CHECK
        // ============================================
        if (typeof RewstLib === 'undefined' || !RewstLib.forms) {
            console.error('❌ CRITICAL ERROR: RewstLib library not loaded!');
            const previewContent = document.getElementById('previewContent');
            if (previewContent) {
                previewContent.innerHTML = `<div class="preview-placeholder" style="color: #dc3545; font-size: 18px; font-weight: 600; padding: 40px; text-align: center; line-height: 1.6;">
                    <strong>❌ Critical Error</strong><br><br>
                    The Rewst Form Viewer requires the rewst-library.js to be loaded first.<br><br>
                    Please ensure the library script is loaded before this page loads.
                </div>`;
            }
            throw new Error('RewstLib library not loaded - cannot continue');
        }
        
        // Configure library settings
        if (typeof SKIP_CACHE !== 'undefined') {
            RewstLib.config.setSkipCache(SKIP_CACHE);
            console.log('[CONFIG] Global SKIP_CACHE set to:', SKIP_CACHE);
        }
        
        if (!FETCH_FORMS_WORKFLOW_ID) {
            console.error('FETCH_FORMS_WORKFLOW_ID not configured');
            displayFormsFetchError('Workflow ID not configured. Update FETCH_FORMS_WORKFLOW_ID in the script.');
        } else {
            // Detect URL parameter
            const detectedFormId = detectUrlFormId();
            
            console.log('=== PAGE INITIALIZATION ===');
            console.log('FETCH_FORMS_WORKFLOW_ID:', FETCH_FORMS_WORKFLOW_ID);
            console.log('Detected urlFormId:', detectedFormId);
            console.log('urlFormId is truthy?', !!detectedFormId);
            
            // Check if form_id parameter is in URL
            if (detectedFormId) {
                console.log('✓ form_id parameter detected in URL, loading form directly');
                console.log('Calling loadFormFromUrlParameter with:', detectedFormId);
                
                // Hide the dropdown and loading sections immediately
                const dropdown = document.getElementById('open_existing_dropdown');
                const loading = document.getElementById('open_existing_loading');
                const formsSection = document.getElementById('open_existing_section');
                
                if (dropdown) {
                    dropdown.style.display = 'none';
                }
                if (loading) {
                    loading.style.display = 'none';
                }
                if (formsSection) {
                    formsSection.style.display = 'none';
                }
                
                loadFormFromUrlParameter(detectedFormId).catch(error => {
                    console.error('Form load from URL failed:', error);
                });
            } else {
                console.log('✗ No form_id parameter provided');
                // Show "No Form ID Provided" message instead of fetching forms list
                const previewContent = document.getElementById('previewContent');
                if (previewContent) {
                    // Try to get URL from parent window if in iframe, otherwise use current location
                    let baseUrl = '/forms_v2';
                    try {
                        if (window.parent && window.parent !== window && window.parent.location) {
                            const parentUrl = window.parent.location.href;
                            baseUrl = parentUrl.split('?')[0];
                        }
                    } catch (e) {
                        // If we can't access parent (cross-origin), fall back to a generic path
                        console.log('Cannot access parent window URL, using default path');
                    }
                    
                    const exampleUrl = `${baseUrl}?form_id=1`;
                    previewContent.innerHTML = `<div class="preview-placeholder" style="color: #ffc107; font-size: 16px; font-weight: 600; line-height: 1.6;">No Form ID Provided<br><span style="font-size: 14px; font-weight: normal; margin-top: 12px; display: block;">Form ID is specified in the URL (ie, <code style="background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 3px;">${escapeHtml(exampleUrl)}</code>)</span></div>`;
                }
                
                // Hide the dropdown and loading sections
                const dropdown = document.getElementById('open_existing_dropdown');
                const loading = document.getElementById('open_existing_loading');
                const formsSection = document.getElementById('open_existing_section');
                
                if (dropdown) {
                    dropdown.style.display = 'none';
                }
                if (loading) {
                    loading.style.display = 'none';
                }
                if (formsSection) {
                    formsSection.style.display = 'none';
                }
                
                // DISABLED: Existing forms lookup functionality
                // To re-enable later, uncomment the code below:
                /*
                console.log('Calling fetchExistingForms()');
                fetchExistingForms().catch(error => {
                    console.error('Form fetch failed:', error);
                    displayFormsFetchError(error.message);
                });
                */
            }
            console.log('===========================');
        }
    </script>
</div>
